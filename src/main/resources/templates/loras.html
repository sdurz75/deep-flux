<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="#{loras.title}">LoRA</title>
</head>
<body>
<div layout:fragment="content">
    <!--
      Dialog Pines UI per creare E modificare un LoRA anagrafato (stessa meccanica di tokens.html): `dialogOpen` e' lo stato
      Alpine letto da button :: dialogOpen/dialogClose. Il contenuto (#lora-form) si ri-carica a ogni apertura; al salvataggio
      riuscito il server emette `lora-saved` (HX-Trigger) che chiude il dialog, con un errore il form si rimpiazza da se'
      (HX-Retarget) e il dialog resta aperto col messaggio.
    -->
    <div x-data="{ dialogOpen: false }" @keydown.escape.window="dialogOpen = false" @lora-saved.window="dialogOpen = false">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <h1 class="m-0" th:text="#{loras.title}">LoRA</h1>
            <button th:replace="~{fragments/button :: dialogOpen(text=#{loras.button.new}, hxGet=@{/loras/new},
                        hxTarget='#lora-form', hxSwap='outerHTML', neutral=false, extraClass='px-3 py-1.5 text-[0.85rem]')}">Nuovo LoRA</button>
        </div>

        <p class="text-ink-muted dark:text-ink-muted-dark" th:text="#{loras.intro}">LoRA anagrafati.</p>

        <div x-show="dialogOpen" x-cloak x-trap.inert.noscroll="dialogOpen"
             class="fixed inset-0 z-[100] flex items-center justify-center p-4"
             role="dialog" aria-modal="true" aria-labelledby="lora-dialog-title">
            <div class="absolute inset-0 bg-scrim/50" @click="dialogOpen = false" x-show="dialogOpen" x-transition.opacity></div>
            <div class="relative w-full max-w-lg max-h-full overflow-y-auto rounded-lg p-5 shadow-xl
                        bg-surface dark:bg-surface-dark border border-line dark:border-line-dark"
                 x-show="dialogOpen"
                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
                <div th:replace="~{fragments/loras :: loraForm(loraId=${loraId}, loraName=${loraName}, loraSource=${loraSource}, loraScale=${loraScale}, loraTriggerWords=${loraTriggerWords}, loraNote=${loraNote}, loraError=${loraError})}"></div>
            </div>
        </div>

        <div id="lora-list">
            <div th:replace="~{fragments/loras :: list(loras=${loras})}"></div>
        </div>
    </div>
</div>
</body>
</html>
