<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="#{search.title}">Ricerca semantica</title>
</head>
<body>
<div layout:fragment="content">
    <h1 th:text="#{search.title}">Ricerca semantica</h1>
    <p class="text-ink-muted dark:text-ink-muted-dark" th:text="#{search.intro}">Interroga e gestisci il vector store.</p>

    <div th:replace="~{fragments/search :: stats(stats=${stats}, oob=false)}"></div>

    <h2 class="mt-8" th:text="#{search.query.title}">Interroga</h2>
    <form th:hx-get="@{/search/results}" hx-target="#search-results" hx-swap="innerHTML"
          hx-trigger="submit, input changed delay:500ms" class="flex flex-col gap-3 md:flex-row md:items-end">
        <div class="flex-1">
            <label for="search-q" th:text="#{search.query.label}">Cerca</label>
            <input type="search" id="search-q" name="q" class="w-full" autocomplete="off" th:placeholder="#{search.query.placeholder}">
        </div>
        <div>
            <label for="search-type" th:text="#{search.query.type}">Tipo</label>
            <div class="relative" x-data="pinesSelect" x-bind="root">
                <select id="search-type" name="type" class="sr-only" tabindex="-1" aria-hidden="true">
                    <option th:each="t : ${types}" th:value="${t}" th:text="#{'search.type.' + ${t}}">Tutti</option>
                </select>
                <div th:replace="~{fragments/select :: ui}"></div>
            </div>
        </div>
        <div>
            <label for="search-topk" th:text="#{search.query.topK}">Risultati</label>
            <input type="number" id="search-topk" name="topK" min="1" max="50" th:value="${topK}" class="w-24">
        </div>
        <div>
            <label for="search-threshold" th:text="#{search.query.threshold}">Somiglianza minima (%)</label>
            <input type="number" id="search-threshold" name="threshold" min="0" max="100" th:value="${threshold}" class="w-24">
        </div>
        <button th:replace="~{fragments/button :: primary(type='submit', text=#{search.query.button}, extraClass=null)}">Cerca</button>
    </form>
    <div id="search-results" class="mt-4"></div>

    <!--
      Documenti + dialog note, per creare E modificare (Pines UI modal, stessa meccanica del lightbox di gallery.html): `dialogOpen` e' lo stato
      Alpine letto da button :: dialogOpen/dialogClose. x-trap.inert.noscroll (plugin @alpinejs/focus) confina il focus e blocca
      lo scroll; niente x-teleport. Il contenuto (#note-form) si ri-carica a ogni apertura (button :: dialogOpen con hxGet: form vuoto o
      precompilato). Al salvataggio riuscito il server emette l'evento htmx `note-saved` (HX-Trigger) che chiude il dialog; con un
      errore di validazione il form si rimpiazza da se' (HX-Retarget) e il dialog resta aperto col messaggio.
    -->
    <div x-data="{ dialogOpen: false }" @keydown.escape.window="dialogOpen = false" @note-saved.window="dialogOpen = false">
        <div class="mt-8 flex flex-wrap items-center justify-between gap-3">
            <h2 class="m-0" th:text="#{search.list.title}">Documenti</h2>
            <button th:replace="~{fragments/button :: dialogOpen(text=#{search.note.open}, hxGet=@{/search/notes/new},
                        hxTarget='#note-form', hxSwap='outerHTML', neutral=false, extraClass='px-3 py-1.5 text-[0.85rem]')}">Nuova nota</button>
        </div>

        <div x-show="dialogOpen" x-cloak x-trap.inert.noscroll="dialogOpen"
             class="fixed inset-0 z-[100] flex items-center justify-center p-4"
             role="dialog" aria-modal="true" aria-labelledby="note-dialog-title">
            <div class="absolute inset-0 bg-scrim/50" @click="dialogOpen = false" x-show="dialogOpen" x-transition.opacity></div>
            <div class="relative w-full max-w-lg max-h-full overflow-y-auto rounded-lg p-5 shadow-xl
                        bg-surface dark:bg-surface-dark border border-line dark:border-line-dark"
                 x-show="dialogOpen"
                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
                <div th:replace="~{fragments/search :: noteForm(noteId=null, noteTitle=${noteTitle}, noteText=${noteText}, noteError=${noteError})}"></div>
            </div>
        </div>

        <div id="search-list">
            <div th:replace="~{fragments/search :: list(listing=${listing}, listType=${listType}, currentPage=${currentPage}, totalPages=${totalPages}, hasPrevious=${hasPrevious}, hasNext=${hasNext}, pageNumbers=${pageNumbers}, types=${types})}"></div>
        </div>
    </div>
</div>
</body>
</html>
