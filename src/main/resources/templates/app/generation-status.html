<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{generationStatus.heading(${generation.id})}">Generazione #1</title>
</head>
<body>
<!--
  Il livello intermedio dipende da dove si e' arrivati (vedi GenerationController#status): dalla galleria contestuale di una
  conversazione /deep-chat (conversationId presente) la conversazione, dal listato /generations (generationsPage presente) la pagina del
  listato da cui si e' cliccato, altrimenti (galleria globale o generazione appena creata dal form diretto) /gallery.
-->
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=null, parentPath=${conversationId != null} ? '/deep-chat/' + ${conversationId} : (${generationsPage != null} ? '/generations?page=' + ${generationsPage} : '/gallery'), parentText=${conversationId != null} ? #{header.nav.deepChat} : (${generationsPage != null} ? #{header.nav.generations} : #{header.nav.gallery}), current=#{generationStatus.heading(${generation.id})})}"></nav>
</div>
<div layout:fragment="content">
    <h1 th:text="#{generationStatus.heading(${generation.id})}">Generazione #1</h1>
    <p><em th:text="${generation.prompt}">prompt</em></p>

    <div th:replace="~{fragments/app/generation :: status}"></div>

    <!-- Solo per i toast d'errore (system-event): un poll che fallisce ripetutamente non ha altro canale su questa pagina. -->
    <div th:replace="~{fragments/core/live-events :: connect}"></div>

    <!-- Lato scrittura dello slot globale prompt/seed ("Usa prompt"/"Usa seed" nel dettaglio), vedi il fragment. -->
    <th:block th:replace="~{fragments/app/generation-shared-slot :: pusher}"></th:block>
</div>
</body>
</html>
