<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{training.title}">Addestra un LoRA</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.create}, parentPath=null, parentText=null, current=#{training.title})}"></nav>
</div>
<div layout:fragment="content">
    <h1 th:text="#{training.title}">Addestra un LoRA</h1>
    <p class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.intro}">Prepara un dataset di immagini e addestra un LoRA.</p>

    <!--
      Nuovo dataset: un form NATIVO (POST + redirect all'editor, funziona anche senza JS). Con un errore di validazione la pagina intera
      si riscrive con i valori digitati e il messaggio sopra il form.
    -->
    <h2 th:text="#{training.create.title}">Nuovo dataset</h2>
    <form th:action="@{/trainings/datasets}" method="post" autocomplete="off"
          class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark p-4 max-w-xl">
        <th:block th:if="${createError}">
            <p th:replace="~{fragments/core/alert :: error(text=${createError})}">Errore</p>
        </th:block>

        <label for="training-name" th:text="#{training.form.name}">Nome</label>
        <input type="text" id="training-name" name="name" class="w-full" maxlength="80" required th:value="${formName}">

        <label for="training-trigger-word" th:text="#{training.form.triggerWord}">Trigger word</label>
        <input type="text" id="training-trigger-word" name="triggerWord" class="w-full" maxlength="40" required th:value="${formTriggerWord}">
        <p class="mt-1 mb-0 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{training.form.triggerWordHelp}">Una parola che non esiste.</p>

        <fieldset class="mt-3 border-0 p-0">
            <legend class="p-0" th:text="#{training.form.type}">Che cosa insegna</legend>
            <label class="flex items-center gap-2">
                <input type="radio" name="loraType" value="subject" class="accent-accent dark:accent-accent-dark" th:checked="${formType != 'style'}">
                <span th:text="#{training.type.subject.long}">Un soggetto</span>
            </label>
            <label class="flex items-center gap-2">
                <input type="radio" name="loraType" value="style" class="accent-accent dark:accent-accent-dark" th:checked="${formType == 'style'}">
                <span th:text="#{training.type.style.long}">Uno stile</span>
            </label>
        </fieldset>

        <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{training.form.create}, extraClass='mt-4')}">Crea il dataset</button>
    </form>

    <h2 class="mt-8" th:text="#{training.datasets.title}">I tuoi dataset</h2>
    <div id="trainings-content">
        <div th:replace="~{fragments/app/training-datasets :: content(datasets=${datasets}, currentPage=${currentPage}, totalPages=${totalPages}, hasPrevious=${hasPrevious}, hasNext=${hasNext}, pageNumbers=${pageNumbers})}"></div>
    </div>
</div>
</body>
</html>
