<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="${editPage} ? #{generate.edit.title} : (${videoPage} ? #{generate.video.title} : #{generate.title})">Genera immagine</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.create}, parentPath=null, parentText=null, current=${editPage} ? #{generate.edit.title} : (${videoPage} ? #{generate.video.title} : #{generate.title}))}"></nav>
</div>
<div layout:fragment="content">
    <h1 th:text="${editPage} ? #{generate.edit.title} : (${videoPage} ? #{generate.video.title} : #{generate.title})">Genera immagine</h1>
    <p th:text="${editPage} ? #{generate.edit.intro} : (${videoPage} ? #{generate.video.intro} : #{generate.intro})">Scegli un modello censito, scrivi un prompt e regola larghezza, altezza, formato e gli altri parametri di generazione nei campi dedicati.</p>

    <div id="generation-panel">
        <div th:replace="~{fragments/app/generate-form :: form}"></div>
    </div>

    <!-- Persistenza dello stato della form (modello, parametri, prompt) fra navigazioni: vedi il fragment. -->
    <th:block th:replace="~{fragments/app/generation-settings-persist :: script}"></th:block>

    <!-- Editor della maschera di inpainting (componente Alpine registrato UNA volta: il suo markup sta nel fragment dei campi, sostituito al cambio modello). -->
    <th:block th:replace="~{fragments/app/mask-editor :: script}"></th:block>

    <!-- Solo per i toast d'errore: il polling della generazione appena creata (sotto, in #generation-panel) non ha altro canale su questa pagina. -->
    <div th:replace="~{fragments/core/live-events :: connect}"></div>
</div>
</body>
</html>
