<!DOCTYPE html>
<!--
  Template decoratore di thymeleaf-layout-dialect: ogni pagina si
  applica questo layout con layout:decorate="~{fragments/layout}" sul
  proprio <html> e marca il contenuto da inserire con
  layout:fragment="content". Il <title> di ogni pagina sostituisce
  automaticamente quello qui sotto (comportamento di default del
  dialect), il resto di <head> viene fuso con quello della pagina.
-->
<!--
  lang risolto dal bundle (html.lang in messages.properties/
  messages_en.properties), non da #{#locale.language}: su una locale
  browser non mappata (es. "de") il contenuto servito ricade comunque
  sul bundle italiano di default, quindi lang deve seguire il bundle
  effettivamente usato, non la locale richiesta - altrimenti
  mentirebbe sulla lingua reale del testo. Le pagine (index.html,
  generate.html, ecc.) NON devono avere un lang="it" letterale sul
  proprio <html>: essendo un attributo letterale su entrambi i lati,
  vincerebbe sempre quello della pagina nel merge di
  thymeleaf-layout-dialect (vedi sezione layout manager sopra),
  vanificando questo th:lang dinamico.
-->
<html th:lang="#{html.lang}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>App</title>

    <!--
      Boot sincrono del tema PRIMA del CSS: evita il flash bianco/nero
      (FOUC) al primo render. Alpine, una volta partito, prende il
      controllo dello stato "theme" ma parte gia' dal valore corretto.
    -->
    <script>
        (function () {
            var stored = localStorage.getItem('theme') || 'auto';
            var resolved = stored === 'auto'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : stored;
            document.documentElement.setAttribute('data-theme', resolved);
        })();
    </script>

    <!-- Nessun bundler: htmx e Alpine arrivano da CDN, zero build step -->
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <!-- Plugin Alpine richiesto da x-trap (usato dalla lightbox di Pines UI in fragments/gallery.html): va caricato PRIMA del core Alpine sotto, entrambi defer. -->
    <script src="https://unpkg.com/@alpinejs/focus@3.14.3/dist/cdn.min.js" defer></script>
    <!-- Plugin Alpine richiesto da x-collapse (usato dall'accordion di Pines UI in fragments/accordion.html): stessa regola di ordine/defer del plugin focus sopra. -->
    <script src="https://unpkg.com/@alpinejs/collapse@3.14.3/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js" defer></script>

    <!--
      Tailwind via Play CDN (compilatore JIT nel browser via
      MutationObserver, nessuno step di build: niente npm/postcss/
      tailwind.config.js su disco) e' il sistema di stile dell'INTERO
      sito, non solo dei componenti Pines UI come in passato: vedi
      CLAUDE.md, "Convenzione: theming". preflight e' attivo (fa da
      reset di base al posto del vecchio theme.css). I design token
      (colori chiaro/scuro) vivono qui sotto in theme.extend.colors,
      ognuno con una coppia {DEFAULT, dark}: la variante dark: (attivata
      da darkMode sotto, non da prefers-color-scheme direttamente) legge
      la shade "-dark" solo quando <html> porta data-theme="dark" - lo
      stesso attributo gia' gestito dal boot script qui sopra e dal
      toggle Alpine su <body>, invariati. Il suffisso "-dark" nel nome
      della shade e il prefisso "dark:" della variante sono due cose
      diverse che solo si assomigliano: "canvas-dark" e' un colore come
      un altro nella palette, "dark:" e' cio' che decide quando usarlo.
    -->
    <!--
      Config Tailwind UNICA: src/main/tailwind/tailwind.config.js (copiata
      in /js/tailwind.config.js a build). In modalita' CDN la si carica
      con uno shim `module` (il file e' CommonJS per la CLI). Con il
      profilo Maven "tailwind" (vedi TailwindAssets) si serve invece il
      CSS compilato e il Play CDN non viene caricato affatto.
    -->
    <link rel="stylesheet" th:if="${@tailwindAssets.compiled}" th:href="@{/css/tailwind.css}">
    <th:block th:unless="${@tailwindAssets.compiled}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>var module = {};</script>
    <script th:src="@{/js/tailwind.config.js}"></script>
    <script>tailwind.config = module.exports;</script>

    <!--
      Stili trasversali che altrimenti andrebbero ripetuti identici su
      decine di tag in ogni pagina (link, <code>, form "nudi" senza
      classi nel markup): un blocco @layer base, meccanismo NATIVO di
      Tailwind (il Play CDN compila JIT anche questo tag), non un
      secondo sistema di stile parallelo. Ogni componente specifico
      (bottoni-variante, card, pannelli...) resta invece utility inline
      nel proprio template. Sicurezza della cascata: ogni selettore qui
      e' un tag nudo (specificita' 0,0,1 o 0,0,2) o un attributo
      semplice - qualunque classe inline nei template (specificita'
      0,1,0+) vince sempre, a prescindere dall'ordine.
    -->
    <style type="text/tailwindcss">
        @layer base {
            /* Alpine.js: nasconde un elemento finche' Alpine non e'
               partito (usato dalla lightbox in fragments/gallery.html).
               Nessuna relazione col tema: preflight non lo fornisce. */
            [x-cloak] { display: none !important; }

            h1 { @apply text-[2em] font-bold my-[0.67em]; }
            p, dl, pre { @apply my-[1em]; }
            dd { @apply ml-[40px]; }
            a { @apply text-accent dark:text-accent-dark underline; }
            code {
                @apply bg-surface dark:bg-surface-dark rounded px-[5px] py-[2px] text-[0.9em];
            }

            button {
                @apply bg-accent dark:bg-accent-dark text-accent-contrast dark:text-accent-contrast-dark
                       border-0 rounded-md px-4 py-2 cursor-pointer hover:opacity-90;
            }
            input[type="search"], input[type="text"], input[type="number"], select, textarea {
                @apply w-full px-3 py-2 border border-line dark:border-line-dark rounded-md
                       bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark;
            }
            textarea { @apply resize-y; }
            label { @apply block mt-4 mb-2 text-sm text-ink-muted dark:text-ink-muted-dark; }
        }
    </style>
    </th:block>
</head>

<body class="m-0 bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark font-sans leading-normal transition-colors duration-150"
      x-data="{ theme: localStorage.getItem('theme') || 'auto' }"
      x-init="$watch('theme', function (v) {
                localStorage.setItem('theme', v);
                var resolved = v === 'auto'
                    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : v;
                document.documentElement.setAttribute('data-theme', resolved);
              })">

<header th:replace="~{fragments/header :: header}"></header>

<!--
  max-w-[1200px]/px-[clamp(...)] invece del container "stock" di
  Tailwind: preserva esattamente il contenitore fluido di prima (largo
  al massimo 1200px, margine laterale minimo 16px che cresce fino a
  64px sui monitor larghi, nessun breakpoint fisso). Il <nav> dell'header
  usa invece un padding fisso (px-4): comportamento gia' cosi' anche
  prima di questa migrazione, non una differenza introdotta ora - vedi
  fragments/header.html.
-->
<main class="max-w-[1200px] mx-auto px-[clamp(16px,5vw,64px)] py-8 min-h-[60vh]">

    <div layout:fragment="breadcrumbs">
        <!-- breadcrumbs -->
    </div>

    <div layout:fragment="content">
        <!-- contenuto pagina -->
    </div>

</main>

<footer class="max-w-[1200px] mx-auto px-[clamp(16px,5vw,64px)] border-t border-line dark:border-line-dark py-6 text-ink-muted dark:text-ink-muted-dark">
    <small>Spring Boot &middot; Thymeleaf &middot; htmx &middot; Alpine.js</small>
</footer>

<div th:replace="~{fragments/toast :: container}"></div>

</body>
</html>
