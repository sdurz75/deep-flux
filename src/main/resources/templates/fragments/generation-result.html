<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Risultato di una generazione in /deep-chat: rimpiazza il placeholder
  (fragments/generation-placeholder.html) nello stesso messaggio "html" di
  <deep-chat>. Come il placeholder vive nello shadow DOM: SOLO stili inline.
  Renderizzato una volta in un <template> (deep-chat.html) e clonato dal
  client: __ID__ -> id generazione, __TEXT__ -> testo (gia' escapato),
  __IMAGES__ -> gli <img> (costruiti lato client dai file della risposta).
  Il bottone (in basso, sotto le immagini) nasconde/mostra .gen-images (handler 'gen-toggle').
-->
<div th:fragment="result"
     data-generation-result data-generation-id="__ID__"
     style="display:inline-flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:100%">
    <span style="white-space:pre-wrap">__TEXT__</span>
    <div class="gen-images" style="display:flex;flex-direction:column;gap:8px;max-width:100%">__IMAGES__</div>
    <button th:replace="~{fragments/button :: galleryToggle(text=#{generationResult.button.hide}, hideText=#{generationResult.button.hide}, showText=#{generationResult.button.show})}">Nascondi</button>
</div>

</body>
</html>
