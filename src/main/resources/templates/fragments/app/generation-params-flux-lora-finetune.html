<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campi del form-type FLUX_LORA_FINETUNE, valido per ogni LoRA addestrato su Replicate (es. flux-lora-ff3; vedi GenerationFormType/
  FluxLoraFinetuneParameterHandler): gli stessi 9 campi tipizzati della
  vecchia form "generica" condivisa da tutti i modelli, solo spostati
  qui — vedi il piano di questa feature. Parametro-meno: legge i valori
  correnti direttamente dal Model (nomi = chiave Replicate del campo,
  vedi FluxLoraFinetuneParameterHandler.defaultFields/toParameterMap), non da
  parametri di fragment — cosi' sia il primo caricamento di
  /generations/new e /deep-chat sia GET /generations/params (cambio
  modello) lo includono nello stesso identico modo, senza dover ripetere
  9 nomi di parametro ad ogni punto di inclusione.

  aspect_ratio resta un hidden fisso ("custom"): unico modo per ottenere
  width/height liberi invece di un enum di ratio predefiniti (vedi
  ModelCatalogService per il perche' non tutti i modelli lo accettano).
-->
<th:block th:fragment="fields">
    <input type="hidden" name="aspect_ratio" value="custom">

    <div>
        <label for="param-num-outputs" th:text="#{generationParams.label.numOutputs}">Numero di immagini</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-num-outputs', name='num_outputs', value=${num_outputs}, defaultValue=${fieldDefaults['num_outputs']}, min='1', max=${maxNumOutputs}, step=null, extraClass=null, spinner=false)}"></div>
    </div>

    <div class="flex gap-2">
        <div class="flex-1 min-w-0">
            <label for="param-width" th:text="#{generationParams.label.width}">Larghezza</label>
            <div th:replace="~{fragments/app/generation-params-number :: field(id='param-width', name='width', value=${width}, defaultValue=${fieldDefaults['width']}, min='256', max='1440', step='16', extraClass=null, spinner=false)}"></div>
        </div>
        <div class="flex-1 min-w-0">
            <label for="param-height" th:text="#{generationParams.label.height}">Altezza</label>
            <div th:replace="~{fragments/app/generation-params-number :: field(id='param-height', name='height', value=${height}, defaultValue=${fieldDefaults['height']}, min='256', max='1440', step='16', extraClass=null, spinner=false)}"></div>
        </div>
    </div>

    <div>
        <label for="param-output-format" th:text="#{generationParams.label.format}">Formato</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-output-format" name="output_format" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="jpg" th:selected="${output_format == 'jpg'}">jpg</option>
                <option value="webp" th:selected="${output_format == 'webp'}">webp</option>
                <option value="png" th:selected="${output_format == 'png'}">png</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <!--
      flux_model e num_inference_steps sono accoppiati: "schnell" accetta
      solo pochi passi di inferenza (4, valore fisso) mentre "dev" ne
      accetta 1-50 (28 di default) — passare da un modello all'altro
      forza il numero di passi coerente e lo rende immutabile solo per
      "schnell", con readonly (non disabled: un campo disabled non
      verrebbe incluso nel submit del form dedicato di /generations/new,
      mentre readonly mantiene comunque il valore nella richiesta).
    -->
    <!--/*
      fluxModel parte dal valore DOM della select (non da un attributo del server): il server marca l'<option> selezionata
      (th:selected) e il ripristino dello stato salvato lato client (fragments/app/generation-settings-persist.html) scrive la select
      PRIMA che Alpine parta; un x-model inizializzato da un attributo del server riscriverebbe il valore ripristinato.
    */-->
    <!--/* Il campo dei passi sta nel fragment condiviso dei numerici (generation-params-number.html, con un x-data suo): un x-ref li' non sarebbe
         visibile a questo componente, quindi lo si legge per id (unico per pagina). */-->
    <div x-data="{ fluxModel: 'dev', steps() { return document.getElementById('param-steps') } }"
         x-init="fluxModel = $el.querySelector('select[name=flux_model]').value || 'dev';
                 $nextTick(() => { steps().readOnly = (fluxModel === 'schnell'); steps().dispatchEvent(new Event('input', { bubbles: true })) })">
        <label for="param-flux-model" th:text="#{generationParams.label.fluxModel}">Variante Flux</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-flux-model" name="flux_model" x-model="fluxModel"
                    @change="steps().value = (fluxModel === 'schnell' ? 4 : 28);
                             steps().readOnly = (fluxModel === 'schnell');
                             $nextTick(() => steps().dispatchEvent(new Event('input', { bubbles: true })))"
                    class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="dev" th:selected="${flux_model != 'schnell'}">dev</option>
                <option value="schnell" th:selected="${flux_model == 'schnell'}">schnell</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>

        <label for="param-steps" th:text="#{generationParams.label.steps}">Passi di inferenza</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-steps', name='num_inference_steps', value=${num_inference_steps}, defaultValue=${fieldDefaults['num_inference_steps']}, min='1', max='50', step=null, extraClass='read-only:opacity-60 read-only:cursor-not-allowed', spinner=false)}"></div>
    </div>

    <div>
        <label for="param-guidance" th:text="#{generationParams.label.guidance}">Guidance scale</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-guidance', name='guidance_scale', value=${guidance_scale}, defaultValue=${fieldDefaults['guidance_scale']}, min='0', max='10', step='0.1', extraClass=null, spinner=false)}"></div>
    </div>

    <div th:replace="~{fragments/app/generation-params-seed :: field}"></div>

    <!--/* img2img/inpainting OPZIONALI (image/mask/prompt_strength dello schema): senza upload e' un normale text-to-image. Come per
         flux-dev-lora il blocco e' nascosto nel pannello di /deep-chat (nessun upload, il tool non prende sorgenti); l'editor della
         maschera sta in un <template x-if> perche' il componente `maskEditor` e' registrato solo da generate.html e li' non esisterebbe. */-->
    <div x-data x-cloak x-show="!$el.closest('#generation-settings-panel')">
        <div th:replace="~{fragments/app/generation-params-source-upload :: field(label=#{generationParams.label.sourceUpload}, required=false)}"></div>

        <template x-if="!$el.closest('#generation-settings-panel')">
            <div th:replace="~{fragments/app/mask-editor :: field}"></div>
        </template>

        <div>
            <label for="param-prompt-strength" th:text="#{generationParams.label.promptStrength}">Forza del prompt (img2img)</label>
            <div th:replace="~{fragments/app/generation-params-number :: field(id='param-prompt-strength', name='prompt_strength', value=${prompt_strength}, defaultValue=${fieldDefaults['prompt_strength']}, min='0', max='1', step='0.05', extraClass=null, spinner=true)}"></div>
        </div>

        <!--/* Con un'immagine di partenza il modello ignora larghezza/altezza e la dimensione dell'output la decide questo (enum 0.25/1 dello schema). */-->
        <div>
            <label for="param-megapixels" th:text="#{generationParams.label.megapixelsWithSource}">Megapixel (con immagine di partenza)</label>
            <div class="relative" x-data="pinesSelect" x-bind="root">
                <select id="param-megapixels" name="megapixels" class="sr-only" tabindex="-1" aria-hidden="true">
                    <option value="0.25" th:selected="${megapixels == '0.25'}">0.25</option>
                    <option value="1" th:selected="${megapixels != '0.25'}">1</option>
                </select>
                <div th:replace="~{fragments/core/select :: ui}"></div>
            </div>
        </div>
    </div>

    <div>
        <label for="param-lora-scale" th:text="#{generationParams.label.loraScale}">Intensita' LoRA</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-lora-scale', name='lora_scale', value=${lora_scale}, defaultValue=${fieldDefaults['lora_scale']}, min='-1', max='3', step='0.1', extraClass=null, spinner=true)}"></div>
    </div>

    <!--/* Seconda LoRA (extra_lora/extra_lora_scale dello schema): nessun token, quindi solo sorgenti pubbliche. La select dei preset (`loraPresets`
         nel Model, GenerationFormService#extraFormOptions) e' un aiuto di compilazione lato client, come in flux-dev-lora. */-->
    <div th:replace="~{fragments/app/generation-params-lora-preset :: field(selectId='param-extra-lora-preset', sourceId='param-extra-lora', scaleId='param-extra-lora-scale')}"></div>

    <div>
        <label for="param-extra-lora" th:text="#{generationParams.label.extraLora}">LoRA aggiuntivo</label>
        <input type="text" id="param-extra-lora" name="extra_lora" autocomplete="off"
               th:value="${extra_lora}">
    </div>

    <div>
        <label for="param-extra-lora-scale" th:text="#{generationParams.label.extraLoraScale}">Intensita' LoRA aggiuntivo</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-extra-lora-scale', name='extra_lora_scale', value=${extra_lora_scale}, defaultValue=${fieldDefaults['extra_lora_scale']}, min='-1', max='3', step='0.1', extraClass=null, spinner=true)}"></div>
    </div>
    <p class="-mt-1 mb-0 text-[0.8rem]"><a th:href="@{/loras}" th:text="#{generationParams.link.manageLoras}">Gestisci i LoRA</a></p>
</th:block>

</body>
</html>
