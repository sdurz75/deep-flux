<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Wrapper app degli editor di tag UTENTE (non i tag AI dell'analisi delle importate ne' le tag d'indice di GenerationSearchText). Il markup
  generico sta in fragments/core/tag-chips.html; qui si risolvono testi (#{tags.*}), URL (@{...}), l'identita' dell'oggetto taggato
  (`filename` di una generazione, `activeConversationId` della sidebar: hidden solo se valorizzati) e la datalist dei tag noti
  (`suggestions`: UNA <datalist id="known-tags"> per pagina).
-->
<!-- Tag di una generazione intera (filename null) o di UN suo file; il server risponde con questo stesso fragment. -->
<th:block th:fragment="generationEditor(generation, filename, suggestions)">
    <th:block th:with="domId=${filename == null ? 'gen-tags-' + generation.id : 'file-tags-' + generation.id + '-' + #strings.replace(filename, '.', '-')},
                       tagSuggestions=${suggestions ? @generationService.allTags() : null}">
    <div th:replace="~{fragments/core/tag-chips :: editor(editorId=${domId},
                     tags=${filename == null ? generation.tags : generation.tagsOf(filename)},
                     addUrl=@{/generations/{id}/tags/add(id=${generation.id})}, removeUrl=@{/generations/{id}/tags/remove(id=${generation.id})},
                     idName='filename', idValue=${filename}, target=${'#' + domId}, swap='outerHTML',
                     suggestions=${tagSuggestions},
                     removeTitlePattern=#{tags.remove('{0}')}, addPlaceholder=#{tags.add.placeholder}, addLabel=#{tags.add.label})}"></div>
    </th:block>
</th:block>

<!-- Tag di una conversazione nella sidebar: la risposta e' l'intero elenco (conversation-list :: items). -->
<th:block th:fragment="conversationEditor(conversation, activeConversationId)">
    <div th:replace="~{fragments/core/tag-chips :: editor(editorId=${'conv-tags-' + conversation.id}, tags=${conversation.tags},
                     addUrl=@{/deep-chat/{id}/tags/add(id=${conversation.id})}, removeUrl=@{/deep-chat/{id}/tags/remove(id=${conversation.id})},
                     idName='activeConversationId', idValue=${activeConversationId},
                     target='#conversation-list-items', swap='outerHTML', suggestions=null,
                     removeTitlePattern=#{tags.remove('{0}')}, addPlaceholder=#{tags.add.placeholder}, addLabel=#{tags.add.label})}"></div>
</th:block>

</body>
</html>
