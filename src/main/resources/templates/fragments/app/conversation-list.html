<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Contenuto della lista conversazioni di /deep-chat: solo items(...),
  il <ul> - incluso da deep-chat.html dentro il rail sinistro non
  collassabile (fragments/core/accordion.html :: staticPanels, sezione
  "Conversazioni", insieme al pannello impostazioni), che fornisce gia'
  lui il contenitore (bordo/sfondo/larghezza). Il bottone "Nuova
  conversazione" NON e' piu' qui (ne' in un ipotetico list(...) che lo
  includesse insieme a items(...)): deve restare visibile a prescindere
  dai pannelli sotto, quindi vive in deep-chat.html sopra l'intero
  accordion, non dentro una sua sezione - vedi il commento li'.
  items(...) e' anche il target htmx di rename/delete
  (#conversation-list-items): uno swap della SOLA lista.

  activeConversationId viaggia come query param appeso a ogni URL
  @{...} di questo fragment (rename/delete), non come campo hidden nel
  form: stesso principio gia' usato da fragments/core/pagination.html per i
  suoi parametri extra.

  Fallback titolo via operatore Elvis (${c.title} ?: #{...}): un
  titolo null non e' mai un letterale di default persistito (vedi
  ChatConversation), la stringa "senza titolo" vive solo qui, risolta
  ogni volta nella lingua della richiesta corrente.

  Rinomina inline: un'icona matita rivela un input (x-show="editing")
  che sottomette solo su blur (mai ad ogni tasto). Invio ed Escape
  forzano entrambi il blur (quindi la sottomissione): Escape ripristina
  prima il valore originale, cosi' la sottomissione che segue è
  equivalente a un no-op invece di richiedere una logica di annullo
  separata.
-->
<ul th:fragment="items(conversations, activeConversationId)" id="conversation-list-items" class="flex flex-col gap-1">
    <li th:if="${#lists.isEmpty(conversations)}" th:text="#{deepChat.sidebar.empty}"
        class="text-[0.85rem] text-ink-muted dark:text-ink-muted-dark px-2 py-1">Nessuna conversazione.</li>

    <li th:each="c : ${conversations}"
        th:classappend="${c.id == activeConversationId} ? 'bg-canvas dark:bg-canvas-dark' : ''"
        class="flex flex-wrap items-center gap-1 rounded-md px-1 py-1"
        x-data="{ editing: false }">

        <a th:href="@{/deep-chat/{id}(id=${c.id})}"
           th:text="${c.title} ?: #{deepChat.conversation.untitled}"
           x-show="!editing"
           class="flex-1 min-w-0 truncate no-underline text-[0.9rem] text-ink dark:text-ink-dark">Conversazione</a>

        <!--
          onsubmit non serve qui a differenza del pannello impostazioni
          di deep-chat.html: questo form si sottomette davvero, via
          htmx (th:hx-post sotto). @blur/@keydown restano Alpine puro
          sull'input, non toccati da Thymeleaf.
        -->
        <form x-show="editing" x-cloak
              th:hx-post="@{/deep-chat/{id}/rename(id=${c.id}, activeConversationId=${activeConversationId})}"
              hx-target="#conversation-list-items" hx-swap="outerHTML"
              class="flex-1 min-w-0">
            <input type="text" name="title" th:value="${c.title}" th:placeholder="#{deepChat.conversation.untitled}"
                   x-ref="renameInput"
                   @blur="$el.form.requestSubmit()"
                   @keydown.enter.prevent="$el.blur()"
                   @keydown.escape.prevent="$el.value = $el.defaultValue; $el.blur()"
                   class="w-full px-1 py-0.5 text-[0.9rem]">
        </form>

        <button type="button" @click="editing = true; $nextTick(() => $refs.renameInput.focus())"
                x-show="!editing"
                th:aria-label="#{deepChat.sidebar.rename.label}"
                class="shrink-0 text-ink-muted dark:text-ink-muted-dark hover:text-accent dark:hover:text-accent-dark cursor-pointer bg-transparent border-0 p-1 leading-none">&#9998;</button>

        <form th:hx-post="@{/deep-chat/{id}/delete(id=${c.id}, activeConversationId=${activeConversationId})}"
              th:hx-confirm="#{deepChat.sidebar.confirm.delete}"
              hx-target="#conversation-list-items" hx-swap="outerHTML"
              x-show="!editing" class="shrink-0">
            <button th:replace="~{fragments/core/button :: danger(type='submit', text='✕', hxPost=null, hxDelete=null, hxConfirm=null, hxSwap=null, hxTarget=null, extraClass='px-2 py-1 text-[0.85rem] leading-none')}">✕</button>
        </form>

        <!--/* Tag utente: sempre per la conversazione aperta e per quelle gia' taggate (le altre si taggano aprendole, per non riempire la sidebar di campi). */-->
        <div th:if="${c.id == activeConversationId or !#sets.isEmpty(c.tags)}" x-show="!editing" class="basis-full px-1">
            <th:block th:replace="~{fragments/app/tag-editor :: conversationEditor(conversation=${c}, activeConversationId=${activeConversationId})}"></th:block>
        </div>
    </li>

    <!--/* Unica datalist dei suggerimenti per tutti i campi tag della sidebar (id known-tags). */-->
    <li class="hidden" aria-hidden="true">
        <datalist id="known-tags"><option th:each="s : ${@generationService.allTags()}" th:value="${s}"></option></datalist>
    </li>
</ul>

</body>
</html>
