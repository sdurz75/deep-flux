<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Contenuto del dialog "Scegli dall'archivio" (GalleryController#picker, fragments/app/archive-picker.html): le immagini riuscite dell'archivio,
  generate e importate, come miniature cliccabili. Non e' la griglia della galleria (niente lightbox, selezione o overlay): scegliere una
  miniatura porta a /generations/new con la sorgente, lo stesso link di "Usa come sorgente" (kind = image, vuoto = video). Il prompt gia'
  scritto nel form si porta dietro (query `prompt`, letto da #prompt al click): la pagina lo mostra com'e', il resto delle impostazioni lo
  ripristina il browser (generation-settings-persist.html). Le tab e la paginazione ricaricano questo stesso fragment (#archive-picker).
-->
<div th:fragment="picker(items, tab, kind, currentPage, totalPages, hasPrevious, hasNext, pageNumbers)">
    <nav class="flex gap-1 mb-3 border-b border-line dark:border-line-dark" role="tablist">
        <a th:each="t : ${#strings.arraySplit('all,imported', ',')}"
           th:href="@{/gallery/picker(tab=${t}, kind=${kind})}" th:hx-get="@{/gallery/picker(tab=${t}, kind=${kind})}"
           hx-target="#archive-picker" hx-swap="innerHTML" role="tab" th:aria-selected="${t == tab}"
           th:text="${t == 'all'} ? #{gallery.tab.all} : #{gallery.tab.imported}"
           class="px-3 py-1.5 -mb-px border-b-2 no-underline text-[0.85rem]"
           th:classappend="${t == tab} ? 'border-accent dark:border-accent-dark text-accent dark:text-accent-dark font-semibold' : 'border-transparent text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark'">Tutte</a>
    </nav>
    <p th:if="${#lists.isEmpty(items)}" class="text-ink-muted dark:text-ink-muted-dark" th:text="#{picker.empty}">Nessuna immagine nell'archivio.</p>
    <div th:unless="${#lists.isEmpty(items)}" class="grid grid-cols-[repeat(auto-fill,minmax(7rem,1fr))] gap-2">
        <a th:each="item : ${items}" th:href="@{/generations/new(kind=${kind}, source=${item.generation.id}, sourceImage=${item.filename})}"
           th:title="${#strings.isEmpty(item.generation.prompt)} ? null : ${#strings.abbreviate(item.generation.prompt, 120)}"
           @click="const p = document.getElementById('prompt'); if (p &amp;&amp; p.value) { const u = new URL($el.href); u.searchParams.set('prompt', p.value); $el.href = u.toString() }"
           class="block rounded-md overflow-hidden border border-line dark:border-line-dark hover:border-accent dark:hover:border-accent-dark">
            <img th:src="@{'/images/' + ${item.filename}}" alt="" loading="lazy" class="block w-full aspect-square object-cover"
                 onerror="this.style.visibility='hidden'">
        </a>
    </div>
    <div th:replace="~{fragments/core/pagination :: nav('/gallery/picker?tab=' + ${tab} + '&kind=' + ${kind ?: ''}, '#archive-picker', ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, null)}"></div>
</div>

</body>
</html>
