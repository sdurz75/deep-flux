<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campi del form-type FLUX_FILL_PRO (vedi GenerationFormType/FluxFillProParameterHandler): inpainting con black-forest-labs/flux-fill-pro
  (schema letto da Replicate il 2026-10-02). Come FLUX_FILL_DEV (generation-params-flux-fill-dev.html) "image" e "mask" sono obbligatorie e le
  aggiunge GenerationService (sorgente = upload o generazione; maschera dipinta nell'editor, fragments/app/mask-editor.html), ma senza LoRA ne' num_outputs
  (una prediction = un'immagine); "safety_tolerance" (al posto di disable_safety_checker) NON e' un campo: la forza GenerationService al massimo. "outpaint" non e' esposto: ignorerebbe la maschera.
-->
<th:block th:fragment="fields">

    <div th:replace="~{fragments/app/generation-params-source-upload :: field(label=#{generationParams.label.editSourceUpload}, required=true)}"></div>

    <div th:replace="~{fragments/app/mask-editor :: field}"></div>

    <div>
        <label for="param-steps" th:text="#{generationParams.label.steps}">Passi di inferenza</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-steps', name='steps', value=${steps}, defaultValue=${fieldDefaults['steps']}, min='15', max='50', step=null, extraClass=null, spinner=false)}"></div>
    </div>

    <div>
        <label for="param-guidance" th:text="#{generationParams.label.guidance}">Guidance scale</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-guidance', name='guidance', value=${guidance}, defaultValue=${fieldDefaults['guidance']}, min='1.5', max='100', step='0.5', extraClass=null, spinner=false)}"></div>
    </div>

    <div>
        <label for="param-output-format" th:text="#{generationParams.label.format}">Formato</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-output-format" name="output_format" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="jpg" th:selected="${output_format == 'jpg'}">jpg</option>
                <option value="png" th:selected="${output_format == 'png'}">png</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/app/generation-params-seed :: field}"></div>

    <div>
        <label for="param-prompt-upsampling" th:text="#{generationParams.label.promptUpsampling}">Prompt upsampling</label>
        <input type="checkbox" id="param-prompt-upsampling" name="prompt_upsampling" value="true"
               th:checked="${prompt_upsampling == true or prompt_upsampling == 'true'}">
    </div>

</th:block>

</body>
</html>
