<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Editor di ritaglio delle immagini di un dataset di addestramento (templates/app/training-dataset.html). Come mask-editor.html, due pezzi:

  - `script`: registra UNA volta il componente Alpine `cropEditor` (alpine:init). A livello di PAGINA.
  - `dialog(datasetId, maxSide)`: dialog Pines + form htmx NASCOSTO. Sta FUORI da #training-images, perche' la griglia si rimpiazza a ogni modifica
    (caricamento, rimozione, ritaglio) e un dialog dentro perderebbe lo stato.

  Funziona SULL'ORIGINALE (/images/{originalFilename}, stessa origine: il canvas non si "sporca"), cosi' si puo' sempre rifare il ritaglio. La card annuncia
  l'immagine con l'evento window `crop-open` (button-gen :: cropOpen). Il risultato esce dal canvas come JPEG con il lato lungo <= maxSide e viaggia nel
  form nascosto (<input type=file> riscritto con DataTransfer, come la maschera) insieme al rettangolo in pixel dell'ORIGINALE: il server non decodifica nulla.
  Il form e' htmx, quindi overlay "operazione in corso", toast d'errore e swap di #training-images funzionano come per ogni altra azione.

  Stato pesante (rettangolo, trascinamento, dimensioni naturali) in variabili di closure, FUORI dal Proxy Alpine: si aggiorna a ogni pointermove. Reattivo
  e' solo cio' che la UI legge. I pixel del ritaglio sono SEMPRE quelli dell'immagine naturale; la scala con lo schermo e' calcolata dal bounding box.
  Il testo dei messaggi arriva da data-* (regola "binding Alpine via data-*"). Niente `[[` ne' `[(` nello script: Thymeleaf li leggerebbe come inline.
-->
<th:block th:fragment="script">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('cropEditor', () => {
                const MIN = 32;                      // lato minimo del ritaglio, in pixel dell'immagine naturale
                let nat = { w: 0, h: 0 };            // dimensioni naturali dell'immagine aperta
                let rect = { x: 0, y: 0, w: 0, h: 0 }; // ritaglio corrente, in pixel naturali
                let saved = null;                    // ritaglio gia' salvato per questa immagine (riapre l'editor dove era)
                let drag = null;                     // trascinamento in corso

                const clamp = (value, low, high) => Math.min(Math.max(value, low), high);

                /* "free" o "L:A" (larghezza:altezza) -> larghezza/altezza; null = libero. */
                function ratioOf(aspect) {
                    if (aspect === 'free') {
                        return null;
                    }
                    const parts = aspect.split(':').map(Number);
                    return parts[0] / parts[1];
                }

                /*
                 * Il rettangolo con un angolo FISSO in (ax, ay) che arriva al punto (px, py): dentro l'immagine e, se serve, con le proporzioni date.
                 * Serve sia per ridimensionare (l'angolo fisso e' quello opposto alla maniglia) sia per disegnare un riquadro nuovo.
                 */
                function span(ax, ay, px, py, ratio) {
                    px = clamp(px, 0, nat.w);
                    py = clamp(py, 0, nat.h);
                    const sx = px >= ax ? 1 : -1;
                    const sy = py >= ay ? 1 : -1;
                    const maxW = sx > 0 ? nat.w - ax : ax;
                    const maxH = sy > 0 ? nat.h - ay : ay;
                    let w = Math.abs(px - ax);
                    let h = Math.abs(py - ay);
                    if (ratio) {
                        if (w / ratio > h) {
                            h = w / ratio;
                        } else {
                            w = h * ratio;
                        }
                        if (w < MIN) {
                            w = MIN;
                            h = MIN / ratio;
                        }
                        if (h < MIN) {
                            h = MIN;
                            w = MIN * ratio;
                        }
                        const k = Math.min(1, maxW / w, maxH / h);
                        w *= k;
                        h *= k;
                    } else {
                        w = Math.min(Math.max(w, MIN), maxW);
                        h = Math.min(Math.max(h, MIN), maxH);
                    }
                    return { x: sx > 0 ? ax : ax - w, y: sy > 0 ? ay : ay - h, w: w, h: h };
                }

                /* Riporta un rettangolo (salvato, o ricalcolato) dentro i confini dell'immagine. */
                function fit(r) {
                    const w = clamp(r.w, 1, nat.w);
                    const h = clamp(r.h, 1, nat.h);
                    return { x: clamp(r.x, 0, nat.w - w), y: clamp(r.y, 0, nat.h - h), w: w, h: h };
                }

                return {
                    dialogOpen: false,
                    ready: false,
                    saving: false,
                    error: '',
                    imageId: null,
                    imageUrl: null,
                    aspect: 'free',
                    view: { l: 0, t: 0, w: 100, h: 100 }, // il riquadro in % dell'immagine: e' quello che la UI disegna
                    size: '',

                    open(detail) {
                        this.imageId = detail.imageId;
                        saved = detail.w ? { x: Number(detail.x), y: Number(detail.y), w: Number(detail.w), h: Number(detail.h) } : null;
                        this.ready = false;
                        this.saving = false;
                        this.error = '';
                        this.aspect = 'free';
                        this.imageUrl = null;
                        this.dialogOpen = true;
                        // Anche riaprendo la STESSA immagine l'<img> deve ricaricarsi (senza, `load` non scatta): prima si svuota, poi si imposta.
                        this.$nextTick(() => {
                            this.imageUrl = detail.url;
                        });
                    },

                    onLoad() {
                        const img = this.$refs.img;
                        if (!img.naturalWidth) {
                            return;
                        }
                        nat = { w: img.naturalWidth, h: img.naturalHeight };
                        rect = saved ? fit(saved) : { x: 0, y: 0, w: nat.w, h: nat.h };
                        this.ready = true;
                        this.sync();
                    },

                    /* Aggiorna cio' che la UI legge (riquadro in % e dimensione) dal rettangolo in pixel naturali. */
                    sync() {
                        this.view = { l: rect.x / nat.w * 100, t: rect.y / nat.h * 100, w: rect.w / nat.w * 100, h: rect.h / nat.h * 100 };
                        this.size = Math.round(rect.w) + ' × ' + Math.round(rect.h) + ' px';
                    },

                    setAspect(value) {
                        this.aspect = value;
                        const ratio = ratioOf(value);
                        if (!ratio || !this.ready) {
                            return;
                        }
                        // Il rettangolo piu' grande con queste proporzioni DENTRO la selezione attuale, con lo stesso centro: non esce da cio' che avevi scelto.
                        const cx = rect.x + rect.w / 2;
                        const cy = rect.y + rect.h / 2;
                        let w = rect.w;
                        let h = rect.w / ratio;
                        if (h > rect.h) {
                            h = rect.h;
                            w = rect.h * ratio;
                        }
                        rect = fit({ x: cx - w / 2, y: cy - h / 2, w: w, h: h });
                        this.sync();
                    },

                    /* Punto del puntatore in pixel naturali: la scala e' quella del bounding box, che segue le dimensioni a schermo. */
                    pos(e) {
                        const box = this.$refs.img.getBoundingClientRect();
                        return [(e.clientX - box.left) * nat.w / box.width, (e.clientY - box.top) * nat.h / box.height];
                    },

                    down(e) {
                        if (!this.ready) {
                            return;
                        }
                        e.preventDefault();
                        const point = this.pos(e);
                        const handle = e.target.dataset ? e.target.dataset.handle : null;
                        const inside = point[0] >= rect.x && point[0] <= rect.x + rect.w && point[1] >= rect.y && point[1] <= rect.y + rect.h;
                        if (handle) {
                            drag = { mode: 'resize', handle: handle, start: Object.assign({}, rect), px: point[0], py: point[1] };
                        } else if (inside) {
                            drag = { mode: 'move', start: Object.assign({}, rect), px: point[0], py: point[1] };
                        } else {
                            drag = { mode: 'new', ox: clamp(point[0], 0, nat.w), oy: clamp(point[1], 0, nat.h) };
                        }
                        this.$refs.stage.setPointerCapture(e.pointerId);
                    },

                    move(e) {
                        if (!drag) {
                            return;
                        }
                        const point = this.pos(e);
                        const ratio = ratioOf(this.aspect);
                        if (drag.mode === 'move') {
                            const s = drag.start;
                            rect = {
                                x: clamp(s.x + point[0] - drag.px, 0, nat.w - s.w),
                                y: clamp(s.y + point[1] - drag.py, 0, nat.h - s.h),
                                w: s.w,
                                h: s.h
                            };
                        } else if (drag.mode === 'resize') {
                            const s = drag.start;
                            // L'angolo FISSO e' quello opposto alla maniglia; quello trascinato parte dov'era, spostato dello stesso tratto del puntatore.
                            const fixed = { nw: [s.x + s.w, s.y + s.h], ne: [s.x, s.y + s.h], sw: [s.x + s.w, s.y], se: [s.x, s.y] }[drag.handle];
                            const moving = { nw: [s.x, s.y], ne: [s.x + s.w, s.y], sw: [s.x, s.y + s.h], se: [s.x + s.w, s.y + s.h] }[drag.handle];
                            rect = span(fixed[0], fixed[1], moving[0] + point[0] - drag.px, moving[1] + point[1] - drag.py, ratio);
                        } else {
                            rect = span(drag.ox, drag.oy, point[0], point[1], ratio);
                        }
                        this.sync();
                    },

                    up(e) {
                        drag = null;
                        if (this.$refs.stage.hasPointerCapture(e.pointerId)) {
                            this.$refs.stage.releasePointerCapture(e.pointerId);
                        }
                    },

                    /* Ritaglia nel canvas (lato lungo <= data-max-side), riscrive l'<input type=file> del form nascosto e lo invia con htmx. */
                    apply() {
                        if (!this.ready || this.saving || rect.w < 1 || rect.h < 1) {
                            return;
                        }
                        const data = this.$root.dataset;
                        const maxSide = Number(data.maxSide) || 1536;
                        const scale = Math.min(1, maxSide / Math.max(rect.w, rect.h));
                        const width = Math.max(1, Math.round(rect.w * scale));
                        const height = Math.max(1, Math.round(rect.h * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const context = canvas.getContext('2d');
                        // Il JPEG non ha il canale alpha: le trasparenze di un PNG finirebbero nere. Si appiattiscono su bianco, e' una scelta sui dati, non di tema.
                        context.fillStyle = '#ffffff';
                        context.fillRect(0, 0, width, height);
                        context.drawImage(this.$refs.img, rect.x, rect.y, rect.w, rect.h, 0, 0, width, height);
                        canvas.toBlob(blob => {
                            if (!blob) {
                                this.error = data.error;
                                return;
                            }
                            const transfer = new DataTransfer();
                            transfer.items.add(new File([blob], 'crop.jpg', { type: 'image/jpeg' }));
                            const form = this.$refs.form;
                            form.elements['file'].files = transfer.files;
                            form.elements['imageId'].value = this.imageId;
                            form.elements['x'].value = Math.round(rect.x);
                            form.elements['y'].value = Math.round(rect.y);
                            form.elements['w'].value = Math.max(1, Math.round(rect.w));
                            form.elements['h'].value = Math.max(1, Math.round(rect.h));
                            this.error = '';
                            this.saving = true;
                            htmx.trigger(form, 'submit');
                        }, 'image/jpeg', 0.95);
                    },

                    /* Fine della richiesta del form nascosto (riuscita o no): si chiude solo se e' andata bene, il fallimento lo mostra il toast. */
                    onDone(event) {
                        if (event.target !== this.$refs.form) {
                            return;
                        }
                        this.saving = false;
                        if (event.detail.successful) {
                            this.dialogOpen = false;
                        }
                    }
                };
            });
        });
    </script>
</th:block>

<div th:fragment="dialog(datasetId, maxSide)" x-data="cropEditor" @crop-open.window="open($event.detail)"
     @keydown.escape.window="dialogOpen = false" @htmx:after-request.window="onDone($event)"
     th:data-max-side="${maxSide}" th:data-error="#{training.crop.error}">
    <div x-show="dialogOpen" x-cloak x-trap.inert.noscroll="dialogOpen"
         class="fixed inset-0 z-[100] flex items-center justify-center p-4"
         role="dialog" aria-modal="true" aria-labelledby="training-crop-title">
        <div class="absolute inset-0 bg-scrim/50" @click="dialogOpen = false" x-show="dialogOpen" x-transition.opacity></div>
        <div class="relative w-full max-w-3xl max-h-full overflow-y-auto rounded-lg p-5 shadow-xl
                    bg-surface dark:bg-surface-dark border border-line dark:border-line-dark"
             x-show="dialogOpen"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
            <div class="flex items-start justify-between gap-3">
                <h2 id="training-crop-title" class="m-0" th:text="#{training.crop.title}">Ritaglia l'immagine</h2>
                <button th:replace="~{fragments/core/button :: dialogCloseIcon(title=#{training.crop.close})}">&times;</button>
            </div>
            <p class="mt-2 mb-0 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{training.crop.help}">Trascina il riquadro.</p>

            <div class="mt-3 flex flex-wrap items-center gap-2" role="group" th:aria-label="#{training.crop.aspect.label}">
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text=#{training.crop.aspect.free}, value='free')}">Libero</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='1:1', value='1:1')}">1:1</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='4:3', value='4:3')}">4:3</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='3:4', value='3:4')}">3:4</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='3:2', value='3:2')}">3:2</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='2:3', value='2:3')}">2:3</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='16:9', value='16:9')}">16:9</button>
                <button th:replace="~{fragments/app/button-gen :: cropAspect(text='9:16', value='9:16')}">9:16</button>
            </div>

            <p x-show="!ready" class="mt-4 text-center text-ink-muted dark:text-ink-muted-dark" th:text="#{training.crop.loading}">Caricamento...</p>

            <div class="mt-3 flex justify-center">
                <!-- Il palco: immagine + oscuramento fuori dal riquadro + riquadro con le quattro maniglie. I colori sono i token del tema. -->
                <div x-ref="stage" class="relative inline-block max-w-full touch-none select-none"
                     @pointerdown="down($event)" @pointermove="move($event)" @pointerup="up($event)" @pointercancel="up($event)">
                    <img x-ref="img" :src="imageUrl" @load="onLoad()" alt="" draggable="false" class="block max-h-[55vh] max-w-full">
                    <div x-show="ready" x-cloak class="absolute inset-0 pointer-events-none">
                        <div class="absolute bg-scrim/50" :style="'left:0;top:0;width:100%;height:' + view.t + '%'"></div>
                        <div class="absolute bg-scrim/50" :style="'left:0;top:' + (view.t + view.h) + '%;width:100%;height:' + (100 - view.t - view.h) + '%'"></div>
                        <div class="absolute bg-scrim/50" :style="'left:0;top:' + view.t + '%;width:' + view.l + '%;height:' + view.h + '%'"></div>
                        <div class="absolute bg-scrim/50" :style="'left:' + (view.l + view.w) + '%;top:' + view.t + '%;width:' + (100 - view.l - view.w) + '%;height:' + view.h + '%'"></div>
                    </div>
                    <div x-show="ready" x-cloak class="absolute border-2 border-accent dark:border-accent-dark cursor-move"
                         :style="'left:' + view.l + '%;top:' + view.t + '%;width:' + view.w + '%;height:' + view.h + '%'">
                        <span data-handle="nw" class="absolute -left-2 -top-2 w-4 h-4 rounded-sm bg-accent dark:bg-accent-dark cursor-nwse-resize"></span>
                        <span data-handle="ne" class="absolute -right-2 -top-2 w-4 h-4 rounded-sm bg-accent dark:bg-accent-dark cursor-nesw-resize"></span>
                        <span data-handle="sw" class="absolute -left-2 -bottom-2 w-4 h-4 rounded-sm bg-accent dark:bg-accent-dark cursor-nesw-resize"></span>
                        <span data-handle="se" class="absolute -right-2 -bottom-2 w-4 h-4 rounded-sm bg-accent dark:bg-accent-dark cursor-nwse-resize"></span>
                    </div>
                </div>
            </div>
            <p x-show="ready" x-cloak x-text="size" class="mt-2 mb-0 text-center text-[0.85rem] text-ink-muted dark:text-ink-muted-dark"></p>
            <p x-show="error" x-cloak x-text="error" role="alert" class="mt-2 mb-0 text-center text-[0.85rem] text-danger dark:text-danger-dark"></p>

            <!--
              Il form htmx nascosto: lo riempie apply(). Il file nasce nel canvas, non nel disco dell'utente, quindi nessun attributo `required`.
              Il suo <input type=file> NON e' una <select>: il test strutturale delle select non lo riguarda.
            -->
            <form x-ref="form" th:hx-post="@{/trainings/datasets/{id}/crop(id=${datasetId})}" hx-encoding="multipart/form-data"
                  hx-target="#training-images" hx-swap="innerHTML" th:data-busy-text="#{training.crop.saving}" class="hidden">
                <input type="file" name="file" accept="image/jpeg">
                <input type="hidden" name="imageId">
                <input type="hidden" name="x">
                <input type="hidden" name="y">
                <input type="hidden" name="w">
                <input type="hidden" name="h">
            </form>

            <div class="mt-4 flex flex-wrap justify-end gap-2">
                <button th:replace="~{fragments/core/button :: dialogClose(text=#{training.crop.cancel}, extraClass='px-3 py-1.5 text-[0.85rem]')}">Annulla</button>
                <button th:replace="~{fragments/app/button-gen :: cropApply(text=#{training.crop.apply})}">Applica</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
