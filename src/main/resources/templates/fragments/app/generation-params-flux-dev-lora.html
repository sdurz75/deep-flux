<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campi del form-type FLUX_DEV_LORA (vedi GenerationFormType/FluxDevLoraParameterHandler):
  schema reale di black-forest-labs/flux-dev-lora, escluso "disable_safety_checker" (forzato da
  GenerationService#create). Legge i valori correnti dal Model (nomi = chiave Replicate del campo).

  Token HF/Civitai: select dei token salvati (CRUD /tokens, IApiTokens) per NOME; al server arriva l'ID
  (hf_token_id/civitai_token_id), che GenerationService#doCreate trasforma nel token in chiaro solo verso Replicate.
  hfTokens/civitaiTokens (senza segreti) li mette nel Model GenerationController/DeepChatController solo per questo form-type.

  LoRA predefiniti: select dei preset anagrafati (CRUD /loras, LoraPresetService; `loraPresets` nel Model, stesso punto dei token)
  sopra ciascuno dei due slot. Sono solo un aiuto di compilazione lato client: al server arrivano sempre testo e scala.

  Blocco img2img (upload + prompt_strength): nascosto nel pannello impostazioni di /deep-chat
  (#generation-settings-panel), dove non c'e' upload e il tool non prende sorgenti.
-->
<th:block th:fragment="fields">

    <div th:replace="~{fragments/app/generation-params-lora-preset :: field(selectId='param-lora-preset', sourceId='param-lora-weights', scaleId='param-lora-scale')}"></div>

    <div>
        <label for="param-lora-weights" th:text="#{generationParams.label.loraWeights}">LoRA</label>
        <input type="text" id="param-lora-weights" name="lora_weights" autocomplete="off"
               th:value="${lora_weights}">
    </div>

    <div>
        <label for="param-lora-scale" th:text="#{generationParams.label.loraScale}">Intensita' LoRA</label>
        <input type="number" id="param-lora-scale" name="lora_scale" min="-1" max="3" step="0.1" th:value="${lora_scale}">
    </div>

    <div th:replace="~{fragments/app/generation-params-lora-preset :: field(selectId='param-extra-lora-preset', sourceId='param-extra-lora', scaleId='param-extra-lora-scale')}"></div>

    <div>
        <label for="param-extra-lora" th:text="#{generationParams.label.extraLora}">LoRA aggiuntivo</label>
        <input type="text" id="param-extra-lora" name="extra_lora" autocomplete="off"
               th:value="${extra_lora}">
    </div>

    <div>
        <label for="param-extra-lora-scale" th:text="#{generationParams.label.extraLoraScale}">Intensita' LoRA aggiuntivo</label>
        <input type="number" id="param-extra-lora-scale" name="extra_lora_scale" min="-1" max="3" step="0.1" th:value="${extra_lora_scale}">
    </div>
    <p class="-mt-1 mb-0 text-[0.8rem]"><a th:href="@{/loras}" th:text="#{generationParams.link.manageLoras}">Gestisci i LoRA</a></p>

    <!--/* Token per i LoRA privati: scelti PER NOME fra quelli salvati in /tokens (mai digitati qui); l'ID arriva al server e
         GenerationService lo sostituisce col token in chiaro solo verso Replicate. Scaduto = non selezionabile. */-->
    <div>
        <label for="param-hf-token" th:text="#{generationParams.label.hfToken}">Token HuggingFace</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-hf-token" name="hf_token_id" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="" th:text="#{generationParams.option.noToken}">— nessuno —</option>
                <option th:each="t : ${hfTokens}" th:value="${t.id}"
                        th:disabled="${t.status.name() == 'EXPIRED'}"
                        th:selected="${#strings.toString(hf_token_id) == #strings.toString(t.id)}"
                        th:text="${t.expiresAt == null} ? ${t.name} : (${t.status.name() == 'EXPIRED'} ? #{generationParams.option.tokenExpired(${t.name})} : #{generationParams.option.tokenExpires(${t.name}, ${t.expiresAt})})">nome</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div>
        <label for="param-civitai-token" th:text="#{generationParams.label.civitaiToken}">Token CivitAI</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-civitai-token" name="civitai_token_id" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="" th:text="#{generationParams.option.noToken}">— nessuno —</option>
                <option th:each="t : ${civitaiTokens}" th:value="${t.id}"
                        th:disabled="${t.status.name() == 'EXPIRED'}"
                        th:selected="${#strings.toString(civitai_token_id) == #strings.toString(t.id)}"
                        th:text="${t.expiresAt == null} ? ${t.name} : (${t.status.name() == 'EXPIRED'} ? #{generationParams.option.tokenExpired(${t.name})} : #{generationParams.option.tokenExpires(${t.name}, ${t.expiresAt})})">nome</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
        <p class="mt-1 mb-0 text-[0.8rem]"><a th:href="@{/tokens}" th:text="#{generationParams.link.manageTokens}">Gestisci i token</a></p>
    </div>

    <div x-data x-cloak x-show="!$el.closest('#generation-settings-panel')">
        <div th:replace="~{fragments/app/generation-params-source-upload :: field(label=#{generationParams.label.sourceUpload}, required=false)}"></div>

        <div>
            <label for="param-prompt-strength" th:text="#{generationParams.label.promptStrength}">Forza del prompt (img2img)</label>
            <input type="number" id="param-prompt-strength" name="prompt_strength" min="0" max="1" step="0.05" th:value="${prompt_strength}">
        </div>
    </div>

    <div>
        <label for="param-aspect-ratio" th:text="#{generationParams.label.aspectRatio}">Aspect ratio</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-aspect-ratio" name="aspect_ratio" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="1:1" th:selected="${aspect_ratio == '1:1'}">1:1</option>
                <option value="16:9" th:selected="${aspect_ratio == '16:9'}">16:9</option>
                <option value="9:16" th:selected="${aspect_ratio == '9:16'}">9:16</option>
                <option value="3:2" th:selected="${aspect_ratio == '3:2'}">3:2</option>
                <option value="2:3" th:selected="${aspect_ratio == '2:3'}">2:3</option>
                <option value="4:3" th:selected="${aspect_ratio == '4:3'}">4:3</option>
                <option value="3:4" th:selected="${aspect_ratio == '3:4'}">3:4</option>
                <option value="5:4" th:selected="${aspect_ratio == '5:4'}">5:4</option>
                <option value="4:5" th:selected="${aspect_ratio == '4:5'}">4:5</option>
                <option value="21:9" th:selected="${aspect_ratio == '21:9'}">21:9</option>
                <option value="9:21" th:selected="${aspect_ratio == '9:21'}">9:21</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div>
        <label for="param-megapixels" th:text="#{generationParams.label.megapixels}">Megapixel</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-megapixels" name="megapixels" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="0.25" th:selected="${megapixels == '0.25'}">0.25</option>
                <option value="1" th:selected="${megapixels == '1'}">1</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div>
        <label for="param-num-outputs" th:text="#{generationParams.label.numOutputs}">Numero di immagini</label>
        <input type="number" id="param-num-outputs" name="num_outputs" min="1" th:max="${T(org.dual.replicate.app.generation.port.in.IGenerationForms).MAX_NUM_OUTPUTS}" th:value="${num_outputs}">
    </div>

    <div>
        <label for="param-steps" th:text="#{generationParams.label.steps}">Passi di inferenza</label>
        <input type="number" id="param-steps" name="num_inference_steps" min="1" max="50" th:value="${num_inference_steps}">
    </div>

    <div>
        <label for="param-guidance" th:text="#{generationParams.label.guidance}">Guidance scale</label>
        <input type="number" id="param-guidance" name="guidance" min="0" max="10" step="0.1" th:value="${guidance}">
    </div>

    <div>
        <label for="param-output-format" th:text="#{generationParams.label.format}">Formato</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-output-format" name="output_format" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="jpg" th:selected="${output_format == 'jpg'}">jpg</option>
                <option value="webp" th:selected="${output_format == 'webp'}">webp</option>
                <option value="png" th:selected="${output_format == 'png'}">png</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div>
        <label for="param-output-quality" th:text="#{generationParams.label.quality}">Qualita'</label>
        <input type="number" id="param-output-quality" name="output_quality" min="0" max="100" th:value="${output_quality}">
    </div>

    <div th:replace="~{fragments/app/generation-params-seed :: field}"></div>

    <div>
        <label for="param-go-fast" th:text="#{generationParams.label.goFast}">Go fast</label>
        <input type="checkbox" id="param-go-fast" name="go_fast" value="true"
               th:checked="${go_fast == true or go_fast == 'true'}">
    </div>

</th:block>

</body>
</html>
