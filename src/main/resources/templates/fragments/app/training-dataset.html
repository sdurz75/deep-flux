<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Immagini di un dataset (contenuto di #training-images, templates/app/training-dataset.html): l'esito dell'ultimo caricamento (se c'e') e la griglia.
  E' il fragment che rispondono sia il caricamento (POST .../images) sia la rimozione di un'immagine, quindi porta anche il contatore e il form del
  caricamento (dentro, perche' il tetto residuo cambia a ogni modifica). Il wrapper #training-images e' nella pagina: qui solo il contenuto.

  report: esito per file, o null (nessun caricamento appena fatto). frozen: snapshot di un training, sola lettura (niente caricamento ne' rimozione).
-->
<th:block th:fragment="images(dataset, report, maxImages, maxBytes)">
    <div th:if="${report != null}" class="mb-4" aria-live="polite">
        <p th:if="${#lists.isEmpty(report.results)}" class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.upload.none}">Nessun file selezionato.</p>
        <th:block th:unless="${#lists.isEmpty(report.results)}">
            <p class="font-semibold" th:text="#{training.upload.summary(${report.acceptedCount}, ${report.rejectedCount})}">N aggiunte, M rifiutate</p>
            <ul class="list-none p-0 m-0 flex flex-col gap-1">
                <li th:each="r : ${report.results}" th:unless="${r.accepted}" class="text-[0.85rem] text-danger dark:text-danger-dark">
                    <span th:text="${r.originalName}">foto.png</span>: <span th:text="${r.rejection}">motivo</span>
                </li>
            </ul>
        </th:block>
    </div>

    <p class="text-[0.9rem] text-ink-muted dark:text-ink-muted-dark"
       th:text="#{training.images.count(${#lists.size(dataset.images)}, ${maxImages})}">3 di 40 immagini</p>

    <form th:unless="${dataset.frozen or #lists.size(dataset.images) >= maxImages}" id="training-upload-form"
          th:action="@{/trainings/datasets/{id}/images(id=${dataset.id})}" method="post" enctype="multipart/form-data"
          th:hx-post="@{/trainings/datasets/{id}/images(id=${dataset.id})}" hx-encoding="multipart/form-data"
          hx-target="#training-images" hx-swap="innerHTML" th:data-busy-text="#{training.upload.busy}" class="mb-4">
        <div th:replace="~{fragments/app/image-dropzone :: field(inputId='training-files', formId='training-upload-form', maxBytes=${maxBytes},
                    maxFiles=${maxImages - #lists.size(dataset.images)}, compact=true, prompt=#{training.dropzone.prompt},
                    hint=#{training.dropzone.hint(${maxImages - #lists.size(dataset.images)}, ${maxBytes / 1048576})}, invalidType=#{training.dropzone.invalidType},
                    tooLarge=#{training.dropzone.tooLarge}, tooMany=#{training.dropzone.tooMany}, removeTitle=#{training.dropzone.remove})}"></div>
        <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{training.upload.submit}, extraClass='mt-3')}">Aggiungi</button>
    </form>

    <p th:if="${#lists.isEmpty(dataset.images)}" class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.images.empty}">Nessuna immagine ancora.</p>

    <!--/* Azioni di massa sulle didascalie: dopo un caricamento o un cambio di trigger word. Rimpiazzano tutta la griglia (le card in sospeso ripartono col polling). */-->
    <div th:unless="${dataset.frozen or #lists.isEmpty(dataset.images)}" class="mb-3 flex flex-wrap items-center gap-2">
        <span class="text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{training.caption.bulk.title}">Didascalie</span>
        <button th:replace="~{fragments/app/button-gen :: trainingAction(text=#{training.caption.bulk.regenerate},
                    url=@{/trainings/datasets/{id}/captions/regenerate(id=${dataset.id})}, target='#training-images', swap='innerHTML',
                    confirmText=#{training.caption.bulk.regenerateConfirm})}"></button>
        <button th:replace="~{fragments/app/button-gen :: trainingAction(text=#{training.caption.bulk.addTrigger},
                    url=@{/trainings/datasets/{id}/captions/trigger-word(id=${dataset.id})}, target='#training-images', swap='innerHTML',
                    confirmText=null)}"></button>
    </div>

    <ul th:unless="${#lists.isEmpty(dataset.images)}" class="list-none p-0 m-0 grid grid-cols-[repeat(auto-fill,minmax(10rem,1fr))] gap-3">
        <li th:each="image : ${dataset.images}" th:id="'training-image-' + ${image.id}"
            class="relative border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark p-2">
            <img th:src="@{'/images/' + ${image.filename}}" th:alt="${image.originalName}" loading="lazy"
                 onerror="this.style.visibility='hidden'" class="block w-full aspect-square object-cover rounded-md">
            <span class="block mt-1 truncate text-[0.75rem] text-ink-muted dark:text-ink-muted-dark" th:text="${image.originalName}">foto.png</span>
            <span th:if="${image.cropped}" class="block text-[0.7rem] text-accent dark:text-accent-dark" th:text="#{training.crop.badge}">ritagliata</span>
            <!--/* th:unless su un th:block separato: sullo stesso tag di th:replace scatterebbe comunque (precedenza piu' alta). */-->
            <th:block th:unless="${dataset.frozen}">
                <button th:replace="~{fragments/app/button-gen :: removeTrainingImage(title=#{training.images.remove},
                            url=@{/trainings/datasets/{id}/images/{imageId}/delete(id=${dataset.id}, imageId=${image.id})}, confirmText=#{training.images.confirmRemove})}"></button>
                <div class="mt-2 flex flex-wrap gap-1">
                    <!--/* Il ritaglio si apre SEMPRE sull'originale (non sul file gia' ritagliato): cosi' si puo' rifare. Il rettangolo salvato riposiziona il riquadro. */-->
                    <button th:replace="~{fragments/app/button-gen :: cropOpen(text=#{training.crop.open}, imageId=${image.id},
                                url=@{'/images/' + ${image.originalFilename}}, cropX=${image.cropX}, cropY=${image.cropY},
                                cropW=${image.cropW}, cropH=${image.cropH})}"></button>
                    <th:block th:if="${image.cropped}">
                        <button th:replace="~{fragments/app/button-gen :: resetTrainingCrop(text=#{training.crop.reset},
                                    url=@{/trainings/datasets/{id}/images/{imageId}/crop/reset(id=${dataset.id}, imageId=${image.id})})}"></button>
                    </th:block>
                </div>
            </th:block>
            <th:block th:replace="~{fragments/app/training-caption :: box(dataset=${dataset}, image=${image})}"></th:block>
        </li>
    </ul>
</th:block>

</body>
</html>
