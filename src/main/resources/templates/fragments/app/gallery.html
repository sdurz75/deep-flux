<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  content(...) e' il collante specifico della galleria: compone la
  griglia (grid, sotto) con la paginazione generica
  (fragments/core/pagination.html), passandole basePath="/gallery" e
  hxTarget="#gallery-content" - i due soli dettagli davvero specifici
  di QUESTA lista, che un futuro listato diverso passerebbe diversi
  senza toccare fragments/core/pagination.html. Stessi 6 parametri nominati
  di sempre: il contratto verso GalleryController non cambia (vedi
  CLAUDE.md, "Pattern controller: quando restituire fragment vs pagina
  intera" - una vista fragment risolta direttamente dal controller
  richiede parametri nominati).
-->
<!--
  Il wrapper con hx-trigger="gallery-update from:body" (evento SSE
  ri-dispatchato da fragments/core/live-events.html, vedi
  GalleryPushNotifier) deve stare QUI dentro, non sul div
  #gallery-content in gallery.html: quel div e' il target dello swap
  (hx-swap="innerHTML"), sopravvive intatto a ogni ricarica, quindi un
  hx-get="@{/gallery(page=...)}" li' sopra congelerebbe currentPage al
  valore del primo caricamento. Qui dentro invece si ri-renderizza a ogni
  swap (pagina cambiata O refresh da SSE), cosi' currentPage e' sempre
  quello appena servito da GalleryController. style="display:contents":
  serve solo da hook per gli attributi hx-*, non deve influire sul layout
  (la griglia CSS vive sul div grid() qui sotto, la paginazione e' un
  fratello separato).
-->
<th:block th:fragment="content(items, tab, currentPage, totalPages, hasPrevious, hasNext, pageNumbers)">
    <div style="display:contents" th:hx-get="@{/gallery(page=${currentPage}, tab=${tab})}"
         hx-trigger="gallery-update from:body" hx-target="#gallery-content" hx-swap="innerHTML">
        <!--
          Il messaggio "galleria vuota" vive QUI (non piu' in gallery.html,
          fuori da #gallery-content) per lo stesso motivo del wrapper
          sopra: deve ricomparire/sparire a ogni refresh (SSE incluso),
          non restare congelato allo stato del primo caricamento - una
          prima generazione completata mentre la pagina e' aperta su una
          galleria vuota deve far sparire questo messaggio, non lasciarlo
          sopra alla nuova immagine.
        -->
        <!--
          Tab Tutte/Preferiti: link htmx dentro content(...) (non in gallery.html) cosi' lo
          stato attivo e' deciso dal server a ogni swap, SSE incluso. Sempre da pagina 1.
        -->
        <nav class="flex gap-1 mb-4 border-b border-line dark:border-line-dark" role="tablist">
            <a th:each="t : ${#strings.arraySplit('all,favourites,imported', ',')}"
               th:href="@{/gallery(tab=${t})}" th:hx-get="@{/gallery(tab=${t})}"
               hx-target="#gallery-content" hx-swap="innerHTML" role="tab"
               th:aria-selected="${t == tab}"
               th:text="${t == 'all'} ? #{gallery.tab.all} : (${t == 'favourites'} ? #{gallery.tab.favourites} : #{gallery.tab.imported})"
               class="px-4 py-2 -mb-px border-b-2 no-underline text-[0.9rem]"
               th:classappend="${t == tab} ? 'border-accent dark:border-accent-dark text-accent dark:text-accent-dark font-semibold' : 'border-transparent text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark'">Tutte</a>
        </nav>
        <p th:if="${#lists.isEmpty(items) and tab == 'all'}">
            <span th:text="#{gallery.empty.prefix}">Nessuna immagine ancora.</span>
            <a th:href="@{/generations/new}" th:text="#{gallery.empty.link}">Generane una</a>.
        </p>
        <p th:if="${#lists.isEmpty(items) and tab == 'imported'}">
            <span th:text="#{gallery.empty.imported}">Nessuna immagine importata ancora.</span>
            <a th:href="@{/import}" th:text="#{gallery.empty.imported.link}">Importane una</a>.
        </p>
        <p th:if="${#lists.isEmpty(items) and tab == 'favourites'}" th:text="#{gallery.empty.favourites}"
           class="text-ink-muted dark:text-ink-muted-dark">Nessun preferito ancora.</p>
        <!-- th:unless su un th:block separato, non th:if sullo stesso tag di th:replace: stesso principio gia' documentato altrove in questo file (th:each+th:replace), th:replace ha precedenza piu' alta e scatterebbe comunque. Altrimenti la toolbar di selezione (dentro grid(...)) comparirebbe anche a galleria vuota. -->
        <th:block th:unless="${#lists.isEmpty(items)}">
            <div th:replace="~{fragments/app/gallery :: grid(${items}, null, ${tab != 'favourites'}, false)}"></div>
        </th:block>
        <div th:replace="~{fragments/core/pagination :: nav(${tab != 'all'} ? '/gallery?tab=' + ${tab} : '/gallery', '#gallery-content', ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, null)}"></div>
    </div>
</th:block>

<!--
  gridOrEmpty(...) e' grid(...) con un messaggio al posto della griglia
  quando la lista e' vuota: usata dalla galleria contestuale di
  /deep-chat (deep-chat.html E DeepChatController#gallery, l'endpoint
  htmx richiamato ad ogni "new-message" - stesso identico markup in
  entrambi i punti, un solo posto da cui deriva). th:if/th:unless non
  possono stare sullo STESSO tag di th:replace (th:insert/th:replace ha
  precedenza piu' alta, scatterebbe comunque a prescindere dalla
  condizione, verificato dal vivo): serve il th:block che avvolge il
  th:replace condizionale, stesso principio gia' documentato sopra per
  th:each+th:replace in grid(...).

  conversationId: propagato a grid(...)/card(...) sotto (vedi
  fragments/app/gallery-card.html), sempre valorizzato qui - unico
  chiamante di gridOrEmpty e' la galleria contestuale di /deep-chat.
-->
<th:block th:fragment="gridOrEmpty(items, emptyMessage, conversationId)">
    <p th:if="${#lists.isEmpty(items)}" th:text="${emptyMessage}"
       class="text-ink-muted dark:text-ink-muted-dark">Nessuna immagine.</p>
    <th:block th:unless="${#lists.isEmpty(items)}">
        <div th:replace="~{fragments/app/gallery :: grid(${items}, ${conversationId}, true, true)}"></div>
    </th:block>
</th:block>

<!--
  Griglia + lightbox: adattamento del componente "Image Gallery" di
  Pines UI (https://devdojo.com/pines/docs/image-gallery), con tre
  scostamenti deliberati dallo snippet originale:
  1. Niente array JS "imageGallery" duplicato con photo/alt, ne'
     un conteggio/indice cachato: i dati sono gia' nel DOM (th:each
     sotto), qui il wraparound di next/prev ricalcola ogni volta la
     lista live delle <img> (imageGalleryImages()), cosi' resta
     corretto anche dopo che una generazione viene eliminata (dal
     dettaglio, non piu' da qui - il dettaglio vive su /generations/{id},
     vedi CLAUDE.md) e la card sparisce dalla griglia al prossimo
     caricamento.
  2. Niente x-teleport="body" sul modal: il fragment viene sostituito
     per intero dalle risposte htmx di paginazione
     (hx-target="#gallery-content" hx-swap="innerHTML"); un nodo
     teletrasportato fuori da quel contenitore resterebbe orfano nel
     <body> ad ogni cambio pagina. position:fixed funziona lo stesso
     senza teleport (nessun antenato usa transform/filter).
  3. Grid/card restano <div>, non <ul>/<li>: niente reset list-style
     da preoccuparsi. .gallery-card (in fragments/app/gallery-card.html,
     non piu' in questo file) e' l'unica classe non-Tailwind rimasta
     su questi elementi, ed e' un hook di selezione cross-file (letto
     da imageGalleryImages() qui sotto), non una classe di stile - il
     suo aspetto visivo e' Tailwind inline nella card.
  x-trap.inert.noscroll sul modal richiede il plugin @alpinejs/focus
  caricato in fragments/core/layout.html prima del core Alpine.

  th:each su fragments/app/gallery-card :: card non puo' stare sullo stesso
  tag di th:replace (Thymeleaf processa l'inclusione fragment PRIMA
  dell'iterazione: la replace scatterebbe una volta sola, non per ogni
  elemento) - serve il th:block th:each sotto che avvolge un div
  th:replace figlio.

  selectionByFile: la card e' UN FILE (galleria contestuale: tutti i file della conversazione) invece di una generazione: la checkbox
  seleziona il file ("<idGenerazione>:<filename>", POST /gallery/delete-selected-files) e il badge "+N" non ha senso.

  conversationId (nullable): solo propagato a ogni card(...) sotto
  (vedi fragments/app/gallery-card.html) per il link "torna a" del
  dettaglio - null dalla galleria globale (content(...) sopra), l'id
  della conversazione dalla galleria contestuale di /deep-chat
  (gridOrEmpty(...) sopra).

  Selezione multipla + cancellazione in blocco: la radice x-data e'
  salita da un tempo su questo <form> (non-submitting, JS-required come
  il resto dell'app, stesso pattern del form impostazioni non-submitting
  di deep-chat.html) invece che sul div griglia sotto, perche' un
  elemento htmx dentro un <form> include di default TUTTI i valori del
  form piu' vicino - le checkbox di ogni card (name="ids", vedi
  fragments/app/gallery-card.html) bastano da sole, nessun hx-include
  esplicito sul bottone "Elimina selezionate". x-ref="gallery" resta sul
  div griglia interno: $refs di Alpine scandisce l'intero sottoalbero
  del componente, non solo i figli diretti, quindi restare piu' in
  profondita' non rompe imageGalleryImages() sotto. selectedIds e'
  l'array (di stringhe: x-model su una checkbox tiene i valori nativi
  come stringa) letto da fragments/core/button.html :: dangerSelectable per
  lo stato disabled, e da ogni checkbox delle card per il proprio stato
  checked/unchecked.
-->
<th:block th:fragment="grid(items, conversationId, selectable, selectionByFile)">
    <form x-data="{
            selectedIds: [],
            imageGalleryOpened: false,
            imageGalleryActiveUrl: null,
            imageGalleryImageIndex: null,
            imageGalleryImages() {
                return Array.from(this.$refs.gallery.querySelectorAll('.gallery-card img'));
            },
            imageGalleryOpen(event) {
                this.imageGalleryImageIndex = this.imageGalleryImages().indexOf(event.target);
                this.imageGalleryActiveUrl = event.target.src;
                this.imageGalleryOpened = true;
            },
            imageGalleryClose() {
                this.imageGalleryOpened = false;
                setTimeout(() => this.imageGalleryActiveUrl = null, 300);
            },
            imageGalleryNext() {
                const images = this.imageGalleryImages();
                if (images.length === 0) { this.imageGalleryClose(); return; }
                this.imageGalleryImageIndex = (this.imageGalleryImageIndex + 1) % images.length;
                this.imageGalleryActiveUrl = images[this.imageGalleryImageIndex].src;
            },
            imageGalleryPrev() {
                const images = this.imageGalleryImages();
                if (images.length === 0) { this.imageGalleryClose(); return; }
                this.imageGalleryImageIndex = (this.imageGalleryImageIndex - 1 + images.length) % images.length;
                this.imageGalleryActiveUrl = images[this.imageGalleryImageIndex].src;
            }
         }"
         @image-gallery-next.window="imageGalleryNext()"
         @image-gallery-prev.window="imageGalleryPrev()"
         @keyup.right.window="imageGalleryNext()"
         @keyup.left.window="imageGalleryPrev()">

        <!-- Toolbar di selezione: conteggio (puro Alpine) + bottone "Elimina selezionate", disabilitato finche' selectedIds e' vuoto (vedi fragments/core/button.html :: dangerSelectable). -->
        <div th:if="${selectable}" class="flex items-center justify-between gap-3 mb-3">
            <span class="text-[0.85rem] text-ink-muted dark:text-ink-muted-dark">
                <span x-text="selectedIds.length"></span> <span th:text="#{gallery.selection.label}">selezionate</span>
            </span>
            <!--/* selectionByFile (galleria contestuale: una card per file) elimina i singoli file, altrimenti intere generazioni (card = generazione). */-->
            <th:block th:unless="${selectionByFile}">
                <button th:replace="~{fragments/core/button :: dangerSelectable(text=#{gallery.button.deleteSelected}, hxPost=@{/gallery/delete-selected}, hxConfirm=#{gallery.confirm.deleteSelected}, extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina selezionate</button>
            </th:block>
            <th:block th:if="${selectionByFile}">
                <button th:replace="~{fragments/core/button :: dangerSelectable(text=#{gallery.button.deleteSelected}, hxPost=@{/gallery/delete-selected-files}, hxConfirm=#{gallery.confirm.deleteSelectedFiles}, extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina selezionate</button>
            </th:block>
        </div>

        <div class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-4"
             x-ref="gallery">

        <th:block th:each="item : ${items}">
            <div th:replace="~{fragments/app/gallery-card :: card(${item}, ${conversationId}, ${selectable}, ${selectionByFile})}"></div>
        </th:block>

        <!-- Lightbox fullscreen: apertura via imageGalleryOpen sul click di un'immagine (in fragments/app/gallery-card.html). -->
        <div x-show="imageGalleryOpened"
             x-transition:enter="transition ease-in-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:leave="transition ease-in-in duration-300"
             x-transition:leave-end="opacity-0"
             @click="imageGalleryClose"
             @keydown.window.escape="imageGalleryClose"
             x-trap.inert.noscroll="imageGalleryOpened"
             class="fixed inset-0 z-[99] flex items-center justify-center bg-scrim/50 select-none cursor-zoom-out"
             x-cloak>
            <div class="flex relative justify-center items-center w-11/12 xl:w-4/5 h-[91.6667%]">
                <div @click="$event.stopPropagation(); $dispatch('image-gallery-prev')"
                     class="flex absolute left-0 justify-center items-center w-14 h-14 text-scrim-contrast rounded-full translate-x-10 cursor-pointer xl:-translate-x-24 2xl:-translate-x-32 bg-scrim-contrast/10 hover:bg-scrim-contrast/20">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </div>

                <img x-show="imageGalleryOpened"
                     x-transition:enter="transition ease-in-out duration-300"
                     x-transition:enter-start="opacity-0 transform scale-50"
                     x-transition:leave="transition ease-in-in duration-300"
                     x-transition:leave-end="opacity-0 transform scale-50"
                     class="object-contain object-center w-full h-full select-none cursor-zoom-out"
                     :src="imageGalleryActiveUrl"
                     alt="">

                <div @click="$event.stopPropagation(); $dispatch('image-gallery-next')"
                     class="flex absolute right-0 justify-center items-center w-14 h-14 text-scrim-contrast rounded-full -translate-x-10 cursor-pointer xl:translate-x-24 2xl:translate-x-32 bg-scrim-contrast/10 hover:bg-scrim-contrast/20">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </div>
        </div>
        </div>
    </form>
</th:block>

</body>
</html>
