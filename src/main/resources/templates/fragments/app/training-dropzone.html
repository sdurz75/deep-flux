<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Dropzone dell'editor di un dataset di addestramento (templates/app/training-dataset.html). Stesso schema di import-dropzone.html (e' una copia
  adattata, non un riuso: li' id, nomi dei campi e messaggi sono quelli di /import), in due pezzi:

  - `script`: registra UNA volta il componente Alpine `trainingDropzone` (alpine:init). A livello di PAGINA.
  - `field(maxBytes, maxFiles)`: il markup. La zona e' una <label> sull'<input type=file multiple name=images>: SENZA JS il click apre il selettore
    nativo e il form si invia come multipart normale; CON JS si aggiungono trascinamento, incolla, anteprime, rimozione del singolo file e la
    validazione client (tipo, dimensione, quante immagini ci stanno ancora: il server resta l'autorita'). L'elenco finale si riscrive nell'input con
    DataTransfer, cosi' il form htmx lo invia in UNA richiesta multipart. I File stanno fuori dallo stato reattivo (Alpine.raw).

  Limiti e messaggi arrivano da data-* (regola "binding Alpine via data-*"), mai da espressioni #{...} dentro @click. `maxFiles` e' quanto resta di
  spazio nel dataset, non il tetto assoluto.
-->
<th:block th:fragment="script">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('trainingDropzone', () => ({
                items: [],
                dragging: false,
                notice: '',

                add(fileList) {
                    const data = this.$root.dataset;
                    const allowed = ['image/png', 'image/jpeg', 'image/webp'];
                    const notes = [];
                    for (const file of Array.from(fileList)) {
                        if (!allowed.includes(file.type)) {
                            notes.push(file.name + ': ' + data.invalidType);
                        } else if (file.size > Number(data.maxBytes)) {
                            notes.push(file.name + ': ' + data.tooLarge);
                        } else if (this.items.length >= Number(data.maxFiles)) {
                            notes.push(file.name + ': ' + data.tooMany);
                        } else {
                            this.items.push({ file: file, url: URL.createObjectURL(file), name: file.name });
                        }
                    }
                    this.notice = notes.join(' · ');
                    this.sync();
                },

                remove(index) {
                    URL.revokeObjectURL(this.items[index].url);
                    this.items.splice(index, 1);
                    this.sync();
                },

                clear() {
                    this.items.forEach(item => URL.revokeObjectURL(item.url));
                    this.items = [];
                    this.notice = '';
                    this.sync();
                },

                /* Riscrive l'<input type=file> con l'elenco accumulato: e' quello che il form invia. */
                sync() {
                    const transfer = new DataTransfer();
                    this.items.forEach(item => transfer.items.add(Alpine.raw(item.file)));
                    this.$refs.input.files = transfer.files;
                },

                onPick(event) {
                    this.add(event.target.files);
                },

                onDrop(event) {
                    this.dragging = false;
                    this.add(event.dataTransfer.files);
                },

                onPaste(event) {
                    const files = Array.from((event.clipboardData && event.clipboardData.files) || []);
                    if (files.length > 0) {
                        event.preventDefault();
                        this.add(files);
                    }
                }
            }));
        });
    </script>
</th:block>

<div th:fragment="field(maxBytes, maxFiles)" x-data="trainingDropzone" @paste.window="onPaste($event)"
     @htmx:after-request.window="if ($event.target.id === 'training-upload-form' &amp;&amp; $event.detail.successful) clear()"
     th:data-max-bytes="${maxBytes}" th:data-max-files="${maxFiles}"
     th:data-invalid-type="#{training.dropzone.invalidType}" th:data-too-large="#{training.dropzone.tooLarge}" th:data-too-many="#{training.dropzone.tooMany}">
    <label for="training-files"
           class="flex flex-col items-center justify-center gap-1 text-center cursor-pointer rounded-lg border-2 border-dashed p-6
                  border-line dark:border-line-dark bg-surface dark:bg-surface-dark text-ink-muted dark:text-ink-muted-dark"
           :class="dragging ? 'border-accent dark:border-accent-dark' : ''"
           @dragover.prevent="dragging = true" @dragleave.prevent="dragging = false" @drop.prevent="onDrop($event)">
        <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
        </svg>
        <span th:text="#{training.dropzone.prompt}">Trascina qui le immagini, incollale o scegli dal disco</span>
        <span class="text-[0.8rem]" th:text="#{training.dropzone.hint(${maxFiles}, ${maxBytes / 1048576})}">PNG, JPEG o WebP</span>
        <input type="file" id="training-files" name="images" multiple accept="image/png,image/jpeg,image/webp" x-ref="input"
               @change="onPick($event)" class="mt-2 text-[0.85rem]">
    </label>

    <p x-show="notice" x-cloak x-text="notice" class="mt-2 text-[0.85rem] text-danger dark:text-danger-dark" role="alert"></p>

    <ul x-show="items.length > 0" x-cloak class="list-none p-0 m-0 mt-3 grid grid-cols-[repeat(auto-fill,minmax(6rem,1fr))] gap-3">
        <template x-for="(item, index) in items" :key="item.url">
            <li class="relative">
                <img :src="item.url" :alt="item.name" class="block w-full aspect-square object-cover rounded-md">
                <span class="block truncate text-[0.75rem] text-ink-muted dark:text-ink-muted-dark" x-text="item.name"></span>
                <button th:replace="~{fragments/app/button-gen :: removeFile(title=#{training.dropzone.remove})}"></button>
            </li>
        </template>
    </ul>
</div>

</body>
</html>
