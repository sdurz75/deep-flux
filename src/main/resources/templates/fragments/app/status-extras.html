<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Parte APP della barra di stato in basso (fragments/core/status-bar.html): il credito residuo su Replicate e OpenRouter.
  `container` e' nel layout di ogni pagina e NON fa chiamate remote nel render: carica `items` da GET /credits/bar (htmx: al load, ogni 5
  minuti e a fine generazione, evento `gallery-update` sul body; un GET non attiva l'overlay "operazione in corso"). Lo stato Alpine
  `balanceOpen` e il popover stanno nel container, FUORI dalla zona sostituita da htmx: un ricaricamento non chiude il popover ne' cancella
  quanto si sta digitando. Il credito Replicate e' una STIMA (Replicate non espone il saldo): il chip apre un popover dove si inserisce il
  saldo attuale, da li' l'app sottrae i costi stimati delle nuove generazioni. Il chip OpenRouter c'e' solo con la management key.
-->
<div th:fragment="container" class="relative" x-data="{ balanceOpen: false }"
     @credits-saved="balanceOpen = false" @keydown.escape.window="balanceOpen = false" @click.outside="balanceOpen = false">
    <div id="status-credits" class="flex items-center gap-3"
         th:hx-get="@{/credits/bar}" hx-trigger="load, every 300s, gallery-update from:body" hx-swap="innerHTML"></div>
    <form x-show="balanceOpen" x-cloak x-transition.opacity
          class="absolute bottom-full right-0 mb-3 w-64 rounded-md p-3 flex flex-col gap-2 shadow-lg text-[0.85rem] leading-normal
                 bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark"
          th:hx-post="@{/credits/replicate}" hx-target="#status-credits" hx-swap="innerHTML" data-busy="off">
        <label for="credits-replicate-balance" th:text="#{credits.form.label}">Saldo Replicate (USD)</label>
        <input type="text" inputmode="decimal" id="credits-replicate-balance" name="balance" autocomplete="off"
               th:placeholder="#{credits.form.placeholder}" placeholder="25,00">
        <p class="m-0 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{credits.form.hint}">Replicate non espone il saldo.</p>
        <button th:replace="~{fragments/core/button :: neutral(type='submit', text=#{credits.form.save}, hxGet=null, hxPost=null, hxTarget=null, hxSwap=null, extraClass=null)}">Salva</button>
    </form>
</div>

<!--
  I chip del credito (risposta di GET /credits/bar e del POST del saldo). `creditLines`: List<CreditLine>, gia' nell'ordine di visualizzazione.
  Sotto CreditLine.LOW_THRESHOLD_USD il chip prende il colore `warning`. Importo formattato nella locale della richiesta.
-->
<th:block th:fragment="items(creditLines)">
    <th:block th:each="line : ${creditLines}"
              th:with="name=${line.provider.name()}, ok=${line.status.name() == 'OK'},
                       amount=${ok} ? ${#numbers.formatDecimal(line.amountUsd, 1, 2)} : '',
                       warn=${line.low() or line.status.name() == 'NOT_SET'}">
        <th:block th:if="${name == 'REPLICATE'}"
                  th:with="text=${ok} ? (#{credits.label.REPLICATE} + ' ~$' + ${amount}) : #{credits.notSet}">
            <button th:replace="~{fragments/app/button-gen :: creditToggle(text=${text}, title=#{credits.title.REPLICATE}, low=${warn})}">Replicate</button>
        </th:block>
        <span th:unless="${name == 'REPLICATE'}" class="whitespace-nowrap" th:classappend="${warn} ? 'text-warning dark:text-warning-dark'"
              th:title="#{credits.title.OPENROUTER}"
              th:text="${ok} ? (#{credits.label.OPENROUTER} + ' $' + ${amount}) : (#{credits.label.OPENROUTER} + ' ' + #{credits.unavailable})">OpenRouter</span>
    </th:block>
</th:block>

</body>
</html>
