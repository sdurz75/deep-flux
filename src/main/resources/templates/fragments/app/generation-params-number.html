<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Wrapper app del campo numerico dei form-type (markup in fragments/core/number-field.html): ogni <input type="number"> dei
  generation-params-<form-type>.html passa da qui (test strutturale `everyNumericParameterFieldUsesTheSharedResetFragment`). Risolve i testi
  #{generationParams.button.*} e collega il refresh all'evento `generation-settings:restored` emesso a fine restore da
  generation-settings-persist.html (lo script scrive i valori con `.value`, senza eventi `input`). Parametri: id, name, value, defaultValue, min, max,
  step, extraClass, spinner (vedi il fragment ui).
-->
<th:block th:fragment="field(id, name, value, defaultValue, min, max, step, extraClass, spinner)">
    <th:block th:replace="~{fragments/core/number-field :: field(id=${id}, name=${name}, value=${value}, defaultValue=${defaultValue}, min=${min}, max=${max},
        step=${step}, extraClass=${extraClass}, spinner=${spinner}, refreshEvent='generation-settings:restored',
        resetTitle=#{generationParams.button.resetDefault(${#strings.toString(defaultValue)})},
        stepDownTitle=#{generationParams.button.stepDown}, stepUpTitle=#{generationParams.button.stepUp})}"></th:block>
</th:block>

</body>
</html>
