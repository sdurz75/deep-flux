<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campo NUMERICO di un form-type con reset al default (un solo posto per il markup: ogni <input type="number"> dei
  generation-params-<form-type>.html passa da qui, come il seed passa da generation-params-seed.html; test strutturale
  `everyNumericParameterFieldUsesTheSharedResetFragment`). La <label> resta fuori dal fragment.

  Il default arriva dal server (`fieldDefaults` nel Model = IGenerationParameterHandler#defaultFields) in `data-default`
  (regola "binding Alpine via data-*": l'espressione Alpine resta HTML statico). Il bottone (button-gen :: resetNumber) compare solo se
  il valore e' diverso dal default: un campo svuotato conta come variato (l'handler lo omette e Replicate userebbe un SUO default, non
  quello dell'app); un campo readonly (i fine-tune LoRA con "schnell": passi fissi) non si resetta mai. A differenza del seed (default "vuoto", CSS
  `peer-placeholder-shown`) serve JS, e lo script di persistenza scrive i valori con `.value` senza eventi `input`: per questo oltre a
  `@input` si ascolta `generation-settings:restored` (bubbling, emesso a fine restore). Niente `x-ref`: un ref dentro questo x-data non
  sarebbe visibile al componente esterno (il fragment dei fine-tune LoRA legge il campo dei passi dal suo select per id).

  Parametri (tutti passati, gli inutilizzati a null): id, name, value (valore corrente), defaultValue, min, max, step (null = attributo
  omesso), extraClass (classi Tailwind LETTERALI in piu' sull'input).
-->
<div th:fragment="field(id, name, value, defaultValue, min, max, step, extraClass)" class="relative"
     x-data="{ changed: false,
               refresh() {
                   const input = this.$root.querySelector('input');
                   this.changed = !input.readOnly &amp;&amp; (input.value === '' || Number(input.value) !== Number(input.dataset.default));
               } }"
     x-init="refresh()" @input="refresh()" @generation-settings:restored.window="refresh()">
    <input type="number" th:id="${id}" th:name="${name}" th:min="${min}" th:max="${max}" th:step="${step}" th:value="${value}"
           th:data-default="${defaultValue}"
           class="peer pr-8 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
           th:classappend="${extraClass}">
    <button th:replace="~{fragments/app/button-gen :: resetNumber(title=#{generationParams.button.resetDefault(${#strings.toString(defaultValue)})})}"></button>
</div>

</body>
</html>
