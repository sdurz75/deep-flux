<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment riusabile sia dal primo caricamento di /generations/new (via
  th:replace) sia dalla risposta di POST /generations quando la
  creazione fallisce e htmx deve solo ri-sostituire il form con
  l'errore inline (nessuna pagina di errore generica).
-->
<th:block th:fragment="form">
    <div>
        <th:block th:if="${error}">
            <p th:replace="~{fragments/core/alert :: error(text=${error})}">Errore</p>
        </th:block>

        <!--/*
          Stato persistito lato client (fragments/app/generation-settings-persist.html, incluso da generate.html): chiave per
          TIPO di pagina (modelli e campi differiscono), separata da quella della chat. Prompt/seed valorizzati dal server
          (link "riusa", "Anima"/"Modifica") NON si ripristinano: vince il link. `version` (hash pinnato) non si persiste mai.
        */-->
        <form th:hx-post="@{/generations}" hx-target="#generation-panel" hx-swap="innerHTML" hx-encoding="multipart/form-data"
              th:data-busy-text="#{generateForm.busy.create}"
              th:data-persist-key="${editPage} ? 'generate.edit' : (${videoPage} ? 'generate.video' : 'generate.image')"
              th:data-persist-no-restore="${(prompt != null ? 'prompt ' : '') + (seed != null ? 'seed' : '')}"
              data-persist-ignore="version">
            <div th:if="${sourceGeneration}" class="mb-4">
                <input type="hidden" name="sourceGenerationId" th:value="${sourceGeneration.id}">
                <input type="hidden" name="sourceImage" th:value="${sourceImage}">
                <p th:text="${editPage} ? #{generateForm.label.editSource(${sourceGeneration.id})} : #{generateForm.label.sourceImage(${sourceGeneration.id})}">Animazione della generazione</p>
                <img th:src="@{'/images/' + ${sourceImage}}" alt="" class="mt-1 h-32 w-auto rounded-md">
            </div>

            <div th:replace="~{fragments/app/generation-params :: fields}"></div>

            <!--/* x-data: lo @click del bottone (riporta la select al modello di default) ha bisogno di uno scope Alpine. */-->
            <div x-data>
                <button th:replace="~{fragments/app/button-gen :: resetToDefaults(text=#{generateForm.button.reset}, hxGet=@{/generations/params(model=${defaultModel})}, defaultModel=${defaultModel}, extraClass='mt-2 text-[0.85rem] py-1.5')}">Reimposta ai default</button>
            </div>

            <label for="version" th:text="#{generateForm.label.version}">Version (opzionale, hash pinnato)</label>
            <input type="text" id="version" name="version" th:value="${version}"
                   th:placeholder="#{generateForm.placeholder.version}" placeholder="lascia vuoto per usare l'ultima versione pubblicata">

            <div th:replace="~{::promptField(prompt=${prompt}, enhanceError=null)}"></div>

            <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{generateForm.button.submit}, extraClass='mt-4')}">Genera</button>
        </form>
    </div>
</th:block>

<!--
  Blocco label+textarea+icona "AI enhance"+eventuale errore: estratto a se'
  stante (invece di restare inline nel form sopra) perche' POST
  /generations/enhance-prompt (GenerationController) deve poter
  risostituire ESATTAMENTE questo blocco via hx-swap="outerHTML"
  (fragments/core/button.html :: aiEnhance ha hx-target="#prompt-field",
  l'id fisso di questo div) senza toccare il resto del form - stesso
  principio "nessuna duplicazione di markup" gia' visto altrove
  (CLAUDE.md, "Pattern controller"): un solo posto dove il markup della
  textarea esiste, riusato sia dal primo caricamento (sopra, via
  th:replace locale) sia dalla risposta dell'endpoint di enhance (che
  referenzia "fragments/app/generate-form :: promptField" per intero, essendo
  una vista di risposta diretta - da li' i parametri nominati, vedi
  CLAUDE.md). enhanceError e' un attributo SEPARATO da quello usato
  sopra per gli errori di creazione ("error"): quello e' l'esito della
  vera POST /generations (spesa reale su Replicate), questo solo di una
  chiamata LLM di riscrittura testo - non vanno confusi ne' mostrati
  insieme.
-->
<div th:fragment="promptField(prompt, enhanceError)" id="prompt-field">
    <label for="prompt" th:text="#{generateForm.label.prompt}">Prompt</label>
    <div class="relative">
        <textarea id="prompt" name="prompt" rows="3" required class="w-full pr-10" th:text="${prompt}"></textarea>
        <button th:replace="~{fragments/app/button-gen :: aiEnhance(title=#{generateForm.button.enhance})}">AI enhance</button>
    </div>
    <th:block th:if="${enhanceError}">
        <p th:replace="~{fragments/core/alert :: error(text=${enhanceError})}">Errore</p>
    </th:block>
</div>

</body>
</html>
