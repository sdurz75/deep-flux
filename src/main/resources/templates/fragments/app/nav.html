<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  PUNTO DI ESTENSIONE dell'app: le voci di navigazione. fragments/core/header.html (core) include
  `fragments/app/nav :: links(inline)` sia nella barra (inline=false) sia nello slideover sotto md (inline=true); questo file
  e' di chi costruisce l'app e va riscritto per una nuova webapp. Compone i fragment generici del core
  (header :: navMenu / navLink / navSystemCore / navTheme).
-->

<!--
  Voci di primo livello, nell'ordine d'uso: le azioni piu' frequenti (Deep Chat, Galleria, Ricerca) sono link diretti, la creazione sta
  nel menu Crea, il resto (elenco completo delle generazioni, LoRA, token, eventi, tema) nel menu Gestione. Le breadcrumbs delle pagine
  (fragments/core/breadcrumbs.html) usano gli stessi nomi di gruppo (header.menu.create / header.menu.manage).
-->
<th:block th:fragment="links(inline)">
    <a th:replace="~{fragments/core/header :: navLink(path='/deep-chat', text=#{header.nav.deepChat})}">Deep Chat</a>
    <div th:replace="~{fragments/core/header :: navMenu(label=#{header.menu.create}, items=~{fragments/app/nav :: navCreate}, inline=${inline})}"></div>
    <a th:replace="~{fragments/core/header :: navLink(path='/gallery', text=#{header.nav.gallery})}">Galleria</a>
    <!-- Solo con la ricerca semantica attiva (app.search.enabled): senza, /search non esiste. -->
    <th:block th:if="${@environment.getProperty('app.search.enabled', 'true') == 'true'}">
        <a th:replace="~{fragments/core/header :: navLink(path='/search', text=#{header.nav.search})}">Ricerca</a>
    </th:block>
    <div th:replace="~{fragments/core/header :: navMenu(label=#{header.menu.manage}, items=~{fragments/app/nav :: navManage}, inline=${inline})}"></div>
</th:block>

<th:block th:fragment="navCreate">
    <a th:replace="~{fragments/core/header :: navLink(path='/generations/new', text=#{header.nav.generate})}">Genera immagine</a>
    <a th:replace="~{fragments/core/header :: navLink(path='/generations/new?kind=video', text=#{header.nav.generateVideo})}">Genera video</a>
    <a th:replace="~{fragments/core/header :: navLink(path='/generations/new?kind=edit', text=#{header.nav.editImage})}">Modifica immagine</a>
</th:block>

<th:block th:fragment="navManage">
    <a th:replace="~{fragments/core/header :: navLink(path='/generations', text=#{header.nav.generations})}">Generazioni</a>
    <a th:replace="~{fragments/core/header :: navLink(path='/loras', text=#{header.nav.loras})}">LoRA</a>
    <th:block th:replace="~{fragments/core/header :: navSystemCore}"></th:block>
    <th:block th:replace="~{fragments/core/header :: navTheme}"></th:block>
</th:block>

</body>
</html>
