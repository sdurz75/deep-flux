<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Card di una singola generazione: riusabile ovunque serva mostrare una
  generazione come thumbnail (oggi solo fragments/app/gallery.html :: grid,
  domani altre liste). Un solo parametro (generation), nessuna variabile
  di loop implicita: il chiamante fa th:each fuori da questo fragment,
  non su questo tag - th:each e th:replace sullo stesso elemento non
  funzionano insieme (l'inclusione fragment ha precedenza piu' alta
  dell'iterazione in Thymeleaf, la replace eseguirebbe una volta sola
  invece di iterare), serve un th:block th:each="..." che avvolge un
  div th:replace="..." figlio (vedi fragments/app/gallery.html).

  ATTENZIONE - riuso solo parziale: il click di zoom
  (@click="imageGalleryOpen") assume un antenato Alpine con quel metodo
  e con x-ref="gallery", e la checkbox di selezione sotto assume un
  antenato Alpine con l'array reattivo "selectedIds" - oggi sempre vero
  perche' l'unico chiamante e' fragments/app/gallery.html :: grid, che
  fornisce entrambi. Una ipotetica lista futura senza lightbox/selezione
  multipla dovrebbe copiare/adattare questo fragment omettendo
  @click/x-model, non riusarlo cosi' com'e'.

  .gallery-card resta l'hook letterale letto da imageGalleryImages() in
  fragments/app/gallery.html (querySelectorAll('.gallery-card img')) - deve
  restare su QUESTO elemento radice anche se ora vive in un file
  diverso da quello del lightbox.

  Niente prompt qui (solo nel dettaglio, vedi fragments/app/generation.html
  :: status) e niente bottone elimina (spostato anche quello nel
  dettaglio): la card mostra solo l'immagine (zoom al click) e il
  modello, con una piccola icona overlay al hover per raggiungere il
  dettaglio.

  Una generazione puo' avere piu' di un'immagine (num_outputs > 1): la
  card ne resta comunque a UNA sola (imageFilenames[0]), con un badge
  "+N" se ce ne sono altre, invece di renderizzare N <img> qui dentro -
  scelta deliberata, non solo per il layout della card (pensata per una
  singola thumbnail a aspect-ratio fisso, non per una sotto-griglia),
  ma anche perche' un'altra <img> qui corromperebbe l'indice della
  lightbox (vedi il commento sull'overlay SVG sotto). Tutte le immagini
  restano comunque raggiungibili dal dettaglio (/generations/{id}, vedi
  CLAUDE.md), che le mostra tutte.

  selectionByFile: la card e' un singolo file della galleria contestuale (checkbox "files" = "<idGenerazione>:<filename>", niente badge "+N").

  conversationId (nullable): quando la card viene dalla galleria
  contestuale di /deep-chat (vedi fragments/app/gallery.html :: grid),
  finisce come query param sul link di dettaglio, cosi'
  fragments/app/generation.html :: status sa mostrare "torna alla
  conversazione" invece di "torna alla galleria" (vedi
  GenerationController#status). Null dalla galleria globale: un
  parametro di link expression Thymeleaf con valore null viene omesso
  dalla query string, non serve un ramo condizionale qui.
-->
<div th:fragment="card(item, conversationId, selectable, selectionByFile)"
     class="gallery-card border border-line dark:border-line-dark rounded-lg overflow-hidden
            bg-surface dark:bg-surface-dark shadow-sm hover:shadow-md transition-shadow duration-200">

    <!--
      "group" solo su questo wrapper (non sull'intera card): l'icona di
      overlay deve apparire solo passando il mouse sull'immagine, non
      su tutta la card (scelta esplicita: niente "whole card link", il
      click sull'immagine resta riservato allo zoom).
    -->
    <div class="relative group">
        <!--
          onerror: se il file immagine e' mancante su disco, il browser
          disegnerebbe di suo l'icona di broken-image + il testo alt
          dentro il riquadro thumbnail, in alto a sinistra - sovrapposto
          alla checkbox di selezione sotto. visibility (non display):
          l'<img> mantiene lo spazio occupato (stesso aspect-ratio),
          niente collasso del layout della card.
        -->
        <img th:unless="${item.generation.video}"
             th:src="@{'/images/' + ${item.filename}}"
             th:alt="${item.generation.prompt}"
             class="w-full aspect-[5/6] lg:aspect-[2/3] xl:aspect-[3/4] object-cover block cursor-zoom-in"
             @click="imageGalleryOpen"
             onerror="this.style.visibility='hidden'"
             loading="lazy">

        <!--
          Video (GenerationKind.VIDEO): thumbnail = primo frame del file
          (preload="metadata", nessun poster/ffmpeg), non un <img>, quindi
          fuori dal selettore '.gallery-card img' della lightbox (non la
          corrompe). Niente zoom: il click porta al dettaglio, dove il
          video ha i controlli.
        -->
        <a th:if="${item.generation.video}" th:href="${item.generation.imported} ? @{'/import/' + ${item.generation.id}} : @{'/generations/' + ${item.generation.id}(conversationId=${conversationId})}" class="block">
            <video th:src="@{'/images/' + ${item.filename}}"
                   class="w-full aspect-[5/6] lg:aspect-[2/3] xl:aspect-[3/4] object-cover block"
                   muted playsinline preload="metadata"
                   onerror="this.style.visibility='hidden'"></video>
            <span class="absolute bottom-2 left-2 flex items-center justify-center w-7 h-7 rounded-full bg-black/60 text-white pointer-events-none">
                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </span>
        </a>

        <!-- "Anima": img2video sulla thumbnail mostrata (imageFilenames[0]), vedi fragments/core/button.html :: animateOverlay. Solo immagini. -->
        <th:block th:unless="${item.generation.video}">
            <a th:replace="~{fragments/app/button-gen :: animateOverlay(url=@{/generations/new(source=${item.generation.id}, sourceImage=${item.filename})}, title=#{generationDetail.action.animate}, extraClass='top-12 right-2')}"></a>
            <a th:replace="~{fragments/app/button-gen :: sourceOverlay(url=@{/generations/new(source=${item.generation.id}, sourceImage=${item.filename}, kind='image')}, title=#{generationDetail.action.useAsSource}, extraClass='top-[5.5rem] right-2')}"></a>
        </th:block>

        <!-- "Scarica": il file mostrato dalla card (imageFilenames[0]), immagine o video, vedi fragments/core/button.html :: downloadOverlay. Colonna sotto l'icona di dettaglio: Anima, Usa come sorgente, Scarica (subito sotto il dettaglio per i video). -->
        <a th:replace="~{fragments/app/button-gen :: downloadOverlay(url=@{'/images/' + ${item.filename}}, filename=${item.filename}, title=#{gallery.card.download}, extraClass=${item.generation.video} ? 'top-12 right-2' : 'top-32 right-2')}"></a>

        <!--
          Star (preferito) del file mostrato, vedi fragments/core/button.html :: starOverlay.
          selectable=false e' la tab "Preferiti" (niente checkbox, un item per file): li'
          togliere la star deve far sparire la card, quindi refresh=true.
        -->
        <button th:replace="~{fragments/app/button-gen :: starOverlay(generationId=${item.generation.id}, filename=${item.filename}, favourite=${item.favourite}, refresh=${!selectable}, variant=${selectable} ? 'card' : 'card-solo')}"></button>

        <span th:if="${selectable and !selectionByFile and item.generation.imageFilenames.size() > 1}"
              th:text="'+' + (${item.generation.imageFilenames.size()} - 1)"
              class="absolute bottom-2 left-2 text-xs font-semibold text-white bg-black/60 rounded-full px-2 py-0.5 pointer-events-none"></span>

        <!--
          Checkbox di selezione multipla (cancellazione in blocco, vedi
          fragments/app/gallery.html :: grid/fragments/button.html ::
          dangerSelectable): SEMPRE visibile, non solo all'hover come
          l'icona di dettaglio sotto - e' un controllo primario, deve
          restare leggibile anche su touch. name="ids" e' il campo che
          il <form> di grid(...) invia a POST /gallery/delete-selected
          (vedi GalleryController#deleteSelected); x-model="selectedIds"
          e' il binding Alpine gemello per lo stato del bottone/contatore,
          stesso <input>, nessun conflitto: sono solo due letture dello
          stesso stato nativo checked/unchecked. Nessun @click.stop
          necessario: sibling di <img>, non discendente, stesso principio
          gia' documentato sotto per l'overlay "vedi dettaglio".
        -->
        <input th:if="${selectable and !selectionByFile}" type="checkbox" name="ids" th:value="${item.generation.id}" x-model="selectedIds"
               th:aria-label="#{gallery.card.select}"
               class="absolute top-2 left-2 z-10 w-5 h-5 rounded accent-accent dark:accent-accent-dark
                      bg-canvas/80 dark:bg-canvas-dark/80 cursor-pointer">
        <!--/* Selezione per file (galleria contestuale): il valore identifica il FILE, non la generazione. */-->
        <input th:if="${selectable and selectionByFile}" type="checkbox" name="files" th:value="${item.generation.id + ':' + item.filename}" x-model="selectedIds"
               th:aria-label="#{gallery.card.select}"
               class="absolute top-2 left-2 z-10 w-5 h-5 rounded accent-accent dark:accent-accent-dark
                      bg-canvas/80 dark:bg-canvas-dark/80 cursor-pointer">

        <!--
          Overlay di navigazione al dettaglio: <a> reale (niente JS),
          sibling di <img> dentro il wrapper "relative" - non figlio di
          <img> stesso, quindi nessun @click.stop necessario (sono
          fratelli, niente bubbling dall'uno all'altro da fermare). SVG
          inline, mai <img>: imageGalleryImages() in fragments/app/gallery.html
          fa querySelectorAll('.gallery-card img') - un'altra <img> qui
          dentro corromperebbe l'indice della lightbox.
          focus-visible:opacity-100 per l'accesso da tastiera (altrimenti
          un link visibile solo al mouse-hover sarebbe un target
          invisibile e inutilizzabile da tastiera). [@media(hover:none)]:
          per il fallback touch: sintassi variante arbitraria Tailwind v3
          (il Play CDN e' fisso sulla v3, coerente con min-[861px]:/
          grid-cols-[...] gia' in uso altrove in questo repo - niente
          pointer-coarse:, quello e' solo v4).
        -->
        <a th:href="${item.generation.imported} ? @{'/import/' + ${item.generation.id}} : @{'/generations/' + ${item.generation.id}(conversationId=${conversationId})}"
           th:aria-label="#{gallery.card.viewDetail}"
           class="absolute top-2 right-2 flex items-center justify-center w-8 h-8 rounded-full
                  bg-black/50 text-white opacity-0 group-hover:opacity-100 focus-visible:opacity-100
                  [@media(hover:none)]:opacity-100 transition-opacity duration-150">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
            </svg>
        </a>
    </div>

    <!--/* Un'immagine importata non ha un modello: al suo posto l'etichetta "Importata". */-->
    <p th:text="${item.generation.imported} ? #{gallery.card.imported} : ${item.generation.model}" class="mt-2 mx-3 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark">modello</p>
    <!--/* Tag utente della generazione e di QUESTO file: link alla galleria filtrata (sola lettura, si modificano nel dettaglio). */-->
    <p th:with="cardTags=${item.generation.tagsOf(item.filename)}" th:if="${!#sets.isEmpty(item.generation.tags) or !#lists.isEmpty(cardTags)}"
       class="mt-1 mx-3 mb-0 flex flex-wrap gap-1">
        <th:block th:each="t : ${item.generation.tags}">
            <a th:replace="~{fragments/core/chip :: link(href=@{/gallery(tag=${t})}, text=${t}, textClass='text-[0.7rem]')}">tag</a>
        </th:block>
        <th:block th:each="t : ${cardTags}" th:unless="${item.generation.tags.contains(t)}">
            <a th:replace="~{fragments/core/chip :: link(href=@{/gallery(tag=${t})}, text=${t}, textClass='text-[0.7rem]')}">tag</a>
        </th:block>
    </p>
    <div class="mb-3"></div>
</div>

</body>
</html>
