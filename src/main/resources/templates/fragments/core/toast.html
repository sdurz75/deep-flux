<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Contenitore dei toast degli eventi di sistema (errori e avvisi), incluso una volta da fragments/core/layout.html. Ascolta l'evento window
  "system-toast" ({key, message}), che arriva da tre sorgenti:
  1. SSE "system-event" (GalleryPushNotifier) ri-dispatchato da fragments/core/live-events.html: errori
     nati in thread async/watcher e nella chat, su ogni pagina che include live-events;
  2. header HX-Trigger {"system-toast": {...}} (SystemEventService#addToastHeader) sulle risposte htmx dei
     controller: htmx lo trasforma in un evento "system-toast" (con detail = l'oggetto) che risale a window;
  3. listener globali htmx:responseError / htmx:sendError / htmx:timeout qui sotto (risposta 4xx/5xx, server non
     raggiungibile o richiesta scaduta: htmx.config.timeout, vedi busy-overlay.html), SOLO se la risposta non portava gia' un toast dal server (punto 2).
  Il payload ha `severity` ("ERROR" default | "WARNING": bordo warning invece di danger, es. token in scadenza).
  Il payload puo' avere `transient: true` (RemoteServiceException.Kind.TRANSIENT): si aggiunge il suggerimento di riprovare.
  Dedupe per `key`: lo stesso errore puo' arrivare da piu' sorgenti (SSE + HX-Trigger), va mostrato una volta.
  Testi client-only dal server via data-* (ponte documentato in CLAUDE.md, "Convenzione: theming").
-->
<div th:fragment="container"
     x-data="{
        toasts: [],
        seen: {},
        add(detail) {
            if (!detail || !detail.message) { return; }
            const key = detail.key || detail.message;
            if (this.seen[key]) { return; }
            this.seen[key] = true;
            this.toasts.push({ key: key, message: detail.message, transient: detail.transient === true, warning: detail.severity === 'WARNING' });
            setTimeout(() => this.dismiss(key), 10000);
        },
        dismiss(key) { this.toasts = this.toasts.filter((t) => t.key !== key); }
     }"
     x-init="
        document.body.addEventListener('htmx:responseError', (e) => {
            const header = (e.detail.xhr && e.detail.xhr.getResponseHeader('HX-Trigger')) || '';
            if (header.indexOf('system-toast') >= 0) { return; }
            add({ key: 'http-' + e.detail.xhr.status + '-' + Math.floor(Date.now() / 10000),
                  message: $el.dataset.httpError.replace('{0}', e.detail.xhr.status) });
        });
        document.body.addEventListener('htmx:sendError', () => {
            add({ key: 'send-' + Math.floor(Date.now() / 10000), message: $el.dataset.networkError });
        });
        document.body.addEventListener('htmx:timeout', () => {
            add({ key: 'send-' + Math.floor(Date.now() / 10000), message: $el.dataset.networkError });
        });
     "
     @system-toast.window="add($event.detail)"
     th:data-http-error="#{toast.error.http('{0}')}"
     th:data-network-error="#{toast.error.network}"
     th:data-transient-hint="#{toast.error.transientHint}"
     class="fixed bottom-4 right-4 z-[110] flex flex-col gap-2 w-[min(24rem,calc(100vw-2rem))] pointer-events-none">
    <template x-for="t in toasts" :key="t.key">
        <div role="alert"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-2"
             class="pointer-events-auto flex items-start gap-3 rounded-md border bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark shadow-lg px-4 py-3 text-[0.9rem]"
             :class="t.warning ? 'border-warning dark:border-warning-dark' : 'border-danger dark:border-danger-dark'">
            <div class="flex-1 break-words">
                <span x-text="t.message"></span>
                <!-- Errore transitorio (rete, timeout, 5xx: l'app ha gia' ritentato): il servizio tornera' raggiungibile, riprovare piu' tardi. -->
                <span x-show="t.transient" x-text="$root.dataset.transientHint" class="block text-ink-muted dark:text-ink-muted-dark text-[0.8rem]"></span>
            </div>
            <button th:replace="~{fragments/core/button :: toastClose(title=#{toast.close})}">&times;</button>
        </div>
    </template>
</div>

</body>
</html>
