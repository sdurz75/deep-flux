<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Elenco dei token (contenuto di #token-list, tokens.html): nome, provider, suffisso del token (mai il segreto), scadenza con
  badge di stato (token `warning`/`danger`). Con la chiave di cifratura mancante un alert spiega perche' non si puo' salvare.
-->
<th:block th:fragment="list(tokens, configured, warningDays)">
    <th:block th:unless="${configured}">
        <p th:replace="~{fragments/core/alert :: error(text=#{tokens.alert.notConfigured})}">Chiave di cifratura mancante.</p>
    </th:block>

    <p th:if="${#lists.isEmpty(tokens)}" class="mt-4" th:text="#{tokens.empty}">Nessun token salvato.</p>

    <ul th:unless="${#lists.isEmpty(tokens)}" class="list-none p-0 mt-4 flex flex-col gap-3">
        <li th:each="t : ${tokens}" th:id="'token-' + ${t.id}"
            class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark px-4 py-3">
            <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-[0.9rem]">
                <strong th:text="${t.name}">nome</strong>
                <span class="rounded-full border border-line dark:border-line-dark px-2 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark"
                      th:text="${#messages.msgOrNull('tokens.provider.' + t.provider) ?: t.provider}">HuggingFace</span>
                <code th:text="'…' + ${t.hint}">…ab12</code>
                <span th:if="${t.expiresAt == null}" class="text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{tokens.noExpiry}">Nessuna scadenza</span>
                <span th:if="${t.expiresAt != null}" class="text-[0.85rem]"
                      th:classappend="${t.status.name() == 'EXPIRED'} ? 'text-danger dark:text-danger-dark font-semibold'
                                       : (${t.status.name() == 'EXPIRING'} ? 'text-warning dark:text-warning-dark font-semibold' : 'text-ink-muted dark:text-ink-muted-dark')"
                      th:text="${t.status.name() == 'EXPIRED'} ? #{tokens.status.expired(${t.expiresAt})}
                                : (${t.status.name() == 'EXPIRING'} ? #{tokens.status.expiring(${t.expiresAt})} : #{tokens.status.expires(${t.expiresAt})})">Scade il 2026-12-31</span>
            </div>
            <div class="mt-3 flex flex-wrap gap-2">
                <button th:replace="~{fragments/core/button :: dialogOpen(text=#{tokens.button.edit}, hxGet=@{/tokens/{id}/edit(id=${t.id})},
                            hxTarget='#token-form', hxSwap='outerHTML', neutral=true, extraClass='px-3 py-1 text-[0.85rem]')}">Modifica</button>
                <button th:replace="~{fragments/core/button :: danger(type='button', text=#{tokens.button.delete}, hxPost=null, hxDelete=@{/tokens/{id}(id=${t.id})},
                            hxConfirm=#{tokens.confirm.delete}, hxSwap='innerHTML', hxTarget='#token-list', extraClass='px-3 py-1 text-[0.85rem]')}">Elimina</button>
            </div>
        </li>
    </ul>
</th:block>

<!--
  Contenuto del dialog (tokens.html), per CREAZIONE (tokenId null) e MODIFICA: sempre ri-caricato all'apertura e, con un errore di
  validazione, rimpiazzato da se' stesso (HX-Retarget/HX-Reswap dal controller). Il token e' un campo password, MAI ripopolato: in
  modifica "lascia vuoto per non cambiarlo". Il provider si sceglie solo in creazione. La risposta riuscita e' l'elenco (#token-list).
-->
<div th:fragment="tokenForm(tokenId, tokenProvider, tokenName, tokenExpires, tokenError, providers, configured)" id="token-form">
    <div class="flex items-start justify-between gap-3">
        <h2 id="token-dialog-title" class="m-0" th:text="${tokenId == null} ? #{tokens.form.newTitle} : #{tokens.form.editTitle}">Nuovo token</h2>
        <button th:replace="~{fragments/core/button :: dialogCloseIcon(title=#{tokens.form.close})}">&times;</button>
    </div>
    <form th:hx-post="${tokenId == null} ? @{/tokens} : @{/tokens/{id}(id=${tokenId})}"
          hx-target="#token-list" hx-swap="innerHTML" class="mt-3" autocomplete="off">
        <th:block th:unless="${configured}">
            <p th:replace="~{fragments/core/alert :: error(text=#{tokens.alert.notConfigured})}">Chiave di cifratura mancante.</p>
        </th:block>
        <th:block th:if="${tokenError}">
            <p th:replace="~{fragments/core/alert :: error(text=${tokenError})}">Errore</p>
        </th:block>

        <th:block th:if="${tokenId == null}">
            <label for="token-provider" th:text="#{tokens.form.provider}">Servizio</label>
            <div class="relative" x-data="pinesSelect" x-bind="root">
                <select id="token-provider" name="provider" class="sr-only" tabindex="-1" aria-hidden="true">
                    <option th:each="p : ${providers}" th:value="${p}" th:text="${#messages.msgOrNull('tokens.provider.' + p) ?: p}"
                            th:selected="${p == tokenProvider}">HuggingFace</option>
                </select>
                <div th:replace="~{fragments/core/select :: ui}"></div>
            </div>
        </th:block>

        <label for="token-name" th:text="#{tokens.form.name}">Nome</label>
        <input type="text" id="token-name" name="name" class="w-full" maxlength="60" required th:value="${tokenName}">

        <label for="token-value" th:text="${tokenId == null} ? #{tokens.form.token} : #{tokens.form.tokenKeep}">Token</label>
        <input type="password" id="token-value" name="token" class="w-full" autocomplete="off" maxlength="500"
               th:required="${tokenId == null}">

        <label for="token-expires" th:text="#{tokens.form.expires}">Scadenza (opzionale)</label>
        <input type="date" id="token-expires" name="expiresAt" class="w-full" th:value="${tokenExpires}">

        <div class="mt-4 flex flex-wrap justify-end gap-2">
            <button th:replace="~{fragments/core/button :: dialogClose(text=#{tokens.form.cancel}, extraClass=null)}">Annulla</button>
            <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{tokens.form.save}, extraClass=null)}">Salva</button>
        </div>
    </form>
</div>

</body>
</html>
