<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Bottoni-icona generici per campi di form (rimuovi chip, azzera, ripristina default, +/-, rimuovi file): kit UI, senza dominio.
  Ognuno assume un antenato/fratello preciso (descritto sopra ciascun fragment). type="button" dove il form puo' spendere denaro.
-->


<!--
  tagRemove(title): la "x" di un chip tag (fragments/app/tag-editor.html, unico chiamante). type="submit": sta nel <form> del chip (hx-post su
  removeUrl). p-0/border-0/bg-transparent: senza, il layer base darebbe al bottone sfondo e padding. hover:opacity-100 esplicito: la regola globale
  "button:hover{opacity:.9}" del layer base vincerebbe su una bare utility.
-->
<button th:fragment="tagRemove(title)" type="submit"
        th:title="${title}" th:aria-label="${title}"
        class="flex items-center justify-center w-4 h-4 p-0 border-0 bg-transparent rounded-full
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark hover:opacity-100">
    <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
</button>

<!--
  resetSeed(title): icona overlay "torna a casuale" nel campo seed (fragments/app/generation-params-seed.html, unico chiamante). Svuota
  l'input fratello precedente (`peer`) e dispatcha `input` con bubbles, come una cancellazione digitata: il listener delegato di
  generation-settings-persist.html salva lo stato (localStorage / server della conversazione). Visibile solo con un seed valorizzato
  (`peer-placeholder-shown:hidden`, CSS: segue anche i .value scritti da codice). type="button" CRITICO: sta nel form che spende su
  Replicate. hover:opacity-100 esplicito: la regola globale "button:hover{opacity:.9}" del layer base vincerebbe su una bare utility.
-->
<button th:fragment="resetSeed(title)" type="button"
        th:title="${title}" th:aria-label="${title}"
        class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center w-5 h-5 p-0 border-0 bg-transparent rounded-full
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark hover:opacity-100
               peer-placeholder-shown:hidden"
        @click="const input = $el.parentElement.querySelector('input'); input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true })); input.focus()">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
</button>

<!--
  resetNumber(title): icona overlay "ripristina il default" nei campi numerici dei form-type (fragments/app/generation-params-number.html, unico
  chiamante). Assume l'antenato x-data con `changed` (il componente del fragment) e l'<input> come fratello: visibile solo se il valore e' stato
  variato (`x-show="changed"`). Scrive `data-default` nell'input e dispatcha `input` con bubbles, come una modifica digitata: il listener delegato di
  generation-settings-persist.html salva lo stato e il componente ricalcola `changed` (il bottone sparisce). type="button" CRITICO: sta nel form
  che spende su Replicate. hover:opacity-100 esplicito: la regola globale "button:hover{opacity:.9}" del layer base vincerebbe su una bare utility. `p-0 border-0 bg-transparent`: senza, il layer base darebbe al bottone sfondo e padding e l'icona sparirebbe.
-->
<button th:fragment="resetNumber(title)" type="button" x-show="changed" x-cloak
        th:title="${title}" th:aria-label="${title}"
        class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center w-5 h-5 p-0 border-0 bg-transparent rounded-full
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark hover:opacity-100"
        @click="const input = $el.parentElement.querySelector('input'); input.value = input.dataset.default; input.dispatchEvent(new Event('input', { bubbles: true })); input.focus()">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
</button>

<!--
  stepNumber(direction, title): bottone "-"/"+" ai lati di un campo numerico (fragments/app/generation-params-number.html con spinner=true, unico
  chiamante) per i campi "intensita'" e la guidance. Assume l'<input type=number> come fratello dentro lo stesso contenitore; `direction` ("up"|"down") viaggia in
  data-direction (regola "binding Alpine via data-*"). Usa stepUp()/stepDown() nativi (rispettano step, min e max, e l'aritmetica decimale: 0,7 + 0,1 = 0,8)
  e dispatcha `input` con bubbles come una modifica digitata: salva lo stato e ricalcola il reset. type="button" CRITICO: sta nel form che spende su Replicate.
  `p-0` e colori espliciti: senza, il layer base darebbe al bottone sfondo e padding propri.
-->
<button th:fragment="stepNumber(direction, title)" type="button"
        th:title="${title}" th:aria-label="${title}" th:data-direction="${direction}"
        class="flex items-center justify-center w-8 h-8 shrink-0 p-0 rounded-md border border-line dark:border-line-dark bg-surface dark:bg-surface-dark
               text-ink dark:text-ink-dark hover:opacity-100"
        @click="const input = $el.parentElement.querySelector('input'); ($el.dataset.direction === 'up') ? input.stepUp() : input.stepDown(); input.dispatchEvent(new Event('input', { bubbles: true })); input.focus()">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path th:if="${direction == 'up'}" stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        <path th:unless="${direction == 'up'}" stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15" />
    </svg>
</button>

<!--
  removeFile(title): icona "x" sull'anteprima di un file nella dropzone di immagini (fragments/core/image-dropzone.html: /import e dataset di addestramento). Assume lo
  scope del componente Alpine `imageDropzone` (metodo `remove`) e la variabile `index` del suo x-for. type="button" CRITICO: sta in un form che
  invia file. `p-0 border-0` e colori espliciti: senza, il layer base darebbe al bottone sfondo e padding propri.
-->
<button th:fragment="removeFile(title)" type="button" th:title="${title}" th:aria-label="${title}" @click="remove(index)"
        class="absolute top-1 right-1 flex items-center justify-center w-6 h-6 p-0 border-0 rounded-full bg-black/60 text-white hover:opacity-100 hover:bg-black/80">
    <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
</button>

</body>
</html>
