<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Lightbox a schermo intero delle immagini, condivisa da fragments/app/gallery.html :: grid e fragments/app/generation-images.html. Nessun parametro:
  assume nello scope Alpine dell'antenato le variabili e i metodi imageGalleryOpened, imageGalleryActiveUrl, imageGalleryClose(), imageGalleryPrev(),
  imageGalleryNext() (definiti da chi lo include). L'apertura sta sul click di un'immagine (gallery-card.html / generation-images.html).
-->
<div th:fragment="overlay" x-show="imageGalleryOpened"
     x-transition:enter="transition ease-in-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:leave="transition ease-in-in duration-300"
     x-transition:leave-end="opacity-0"
     @click="imageGalleryClose"
     @keydown.window.escape="imageGalleryClose"
     x-trap.inert.noscroll="imageGalleryOpened"
     class="fixed inset-0 z-[99] flex items-center justify-center bg-scrim/50 select-none cursor-zoom-out"
     x-cloak>
    <div class="flex relative justify-center items-center w-11/12 xl:w-4/5 h-[91.6667%]">
        <div @click="$event.stopPropagation(); imageGalleryPrev()"
             class="flex absolute left-0 justify-center items-center w-14 h-14 text-scrim-contrast rounded-full translate-x-10 cursor-pointer xl:-translate-x-24 2xl:-translate-x-32 bg-scrim-contrast/10 hover:bg-scrim-contrast/20">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
        </div>

        <img x-show="imageGalleryOpened"
             x-transition:enter="transition ease-in-out duration-300"
             x-transition:enter-start="opacity-0 transform scale-50"
             x-transition:leave="transition ease-in-in duration-300"
             x-transition:leave-end="opacity-0 transform scale-50"
             class="object-contain object-center w-full h-full select-none cursor-zoom-out"
             :src="imageGalleryActiveUrl"
             alt="">

        <div @click="$event.stopPropagation(); imageGalleryNext()"
             class="flex absolute right-0 justify-center items-center w-14 h-14 text-scrim-contrast rounded-full -translate-x-10 cursor-pointer xl:translate-x-24 2xl:translate-x-32 bg-scrim-contrast/10 hover:bg-scrim-contrast/20">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
        </div>
    </div>
</div>

</body>
</html>
