<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Ora e commit della build in esecuzione (bean BuildInfo), incluso da fragments/core/layout.html. Fisso in basso a sinistra
  (a destra stanno i toast), z-30: sotto header, modal e lightbox. Appena percettibile finche' non ci si passa sopra; il
  testo resta selezionabile per copiare l'hash. Assente se ne' ora ne' commit sono noti.
-->
<div th:fragment="badge" th:if="${@buildInfo.available}"
     th:title="#{build.title}"
     class="fixed bottom-2 left-3 z-30 flex gap-2 font-mono text-[10px] leading-none text-ink-muted dark:text-ink-muted-dark
            opacity-50 hover:opacity-100 transition-opacity duration-150">
    <span th:if="${@buildInfo.time != null}" th:text="${@buildInfo.time}">02/10/2026 11:42</span>
    <span th:if="${@buildInfo.commit != null}" th:text="${@buildInfo.commit}">a06ee1b</span>
</div>

</body>
</html>
