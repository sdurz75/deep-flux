<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  th:block non introduce un tag wrapper: il fragment produce direttamente
  gli <li>, cosi' il chiamante puo' inserirlo dentro un <ul> mantenendo
  HTML valido, sia al primo caricamento (via th:replace) sia sulle
  risposte htmx successive (che sostituiscono solo #load-more).
-->
<th:block th:fragment="rows(items, nextPage, hasMore)">
    <li th:each="item : ${items}" th:text="${item}">Item</li>
    <li th:if="${hasMore}" id="load-more">
        <button type="button"
                th:hx-get="@{/items(page=${nextPage})}"
                hx-target="#load-more"
                hx-swap="outerHTML"
                hx-indicator="#load-more-indicator">
            Carica altri
        </button>
        <span id="load-more-indicator" class="htmx-indicator">&hellip;</span>
    </li>
</th:block>

</body>
</html>
