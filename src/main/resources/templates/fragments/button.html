<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Bottoni riusabili: le classi Tailwind di ogni variante vivono qui,
  una sola volta, non ripetute in ogni template che ne ha bisogno
  (form, galleria, deep-chat, header). Ogni fragment prende parametri
  per contenuto/comportamento (testo, type, attributi htmx opzionali,
  extraClass per aggiustamenti di layout del chiamante), mai per le
  classi di base: quelle sono fisse, un solo punto di verita' per come
  deve apparire un bottone di un certo tipo. Chiamare sempre con
  parametri nominati (frag(nome=valore)), non posizionali: permette di
  omettere quelli opzionali, Thymeleaf li valorizza a null da solo
  (vedi CLAUDE.md, "Pattern controller: quando restituire fragment vs
  pagina intera" per la stessa nota su nominati vs posizionali).
-->

<!--
  Bottone primario (accent): nessuna classe di colore/bordo/padding
  qui, arrivano gia' dalla regola generica "button" nel layer base di
  fragments/layout.html (ogni <button> nudo e' primario di default).
  extraClass e' solo per aggiustamenti di LAYOUT del chiamante (es.
  margine sopra in un form), mai per cambiare la variante.
-->
<button th:fragment="primary(type, text, extraClass)"
        th:type="${type} ?: 'button'"
        th:classappend="${extraClass}"
        th:text="${text}">Bottone</button>

<!--
  Bottone neutro (azioni secondarie: modifica, annulla, ri-embedda): bordo e superficie invece dell'accent, il resto (padding,
  radius, cursor) resta ereditato dal layer base. hxGet/hxPost/hxTarget/hxSwap opzionali (null se non usati), passati a
  parametri nominati come per gli altri; `type` default 'button'.
-->
<button th:fragment="neutral(type, text, hxGet, hxPost, hxTarget, hxSwap, extraClass)"
        th:type="${type} ?: 'button'"
        class="bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark"
        th:classappend="${extraClass}"
        th:hx-get="${hxGet}"
        th:hx-post="${hxPost}"
        th:hx-target="${hxTarget}"
        th:hx-swap="${hxSwap}"
        th:text="${text}">Bottone</button>

<!--
  Bottone pericoloso (azioni distruttive: elimina, cancella
  conversazione): sovrascrive solo bg/testo rispetto al default
  "button" del layer base (bordo/radius/padding/cursor/hover restano
  ereditati, stessa relazione di theme.css tra "button" e
  ".button-danger" di prima). hxPost/hxDelete/hxConfirm/hxSwap/hxTarget
  vanno sempre passati esplicitamente da ogni chiamante, anche `null`
  per quelli che l'azione non usa (es. solo uno tra hxPost/hxDelete e'
  valorizzato, l'altro null, a seconda del verbo dell'azione) - stesso
  principio gia' vero per hxTarget quando l'htmx non ha bisogno di un
  target diverso dal bottone stesso.
-->
<button th:fragment="danger(type, text, hxPost, hxDelete, hxConfirm, hxSwap, hxTarget, extraClass)"
        th:type="${type} ?: 'button'"
        class="bg-danger dark:bg-danger-dark text-accent-contrast dark:text-accent-contrast-dark"
        th:classappend="${extraClass}"
        th:hx-post="${hxPost}"
        th:hx-delete="${hxDelete}"
        th:hx-confirm="${hxConfirm}"
        th:hx-swap="${hxSwap}"
        th:hx-target="${hxTarget}"
        th:text="${text}">Bottone</button>

<!--
  Variante di "danger" per la cancellazione in blocco dalla griglia
  (fragments/gallery.html :: grid, checkbox multiple): disabilitato
  finche' non c'e' selezione. A differenza degli altri parametri del
  bottone (testo/attributi htmx), `selectedIds` NON e' passato da
  Thymeleaf: e' un binding Alpine puro (`:disabled`, non processabile
  da th:attr per attributi con `:`, vedi CLAUDE.md "Convenzione:
  theming") che assume SEMPRE lo stesso nome di variabile su un
  antenato x-data (oggi definito in grid(...) sopra) - stesso principio
  gia' in uso per `theme` in themeToggle sotto, qui pero' senza nemmeno
  bisogno di un ponte data-*: non e' un valore per-istanza, e'
  letteralmente la stessa espressione ovunque questo bottone compare.
  hx-swap="none" fisso (non parametrizzato come in "danger"): per
  questo bottone e' sempre vero, il refresh arriva dall'evento SSE
  "gallery-update" (vedi GenerationEventBroadcaster/GenerationService
  #deleteAll), mai da uno swap diretto della risposta.
-->
<button th:fragment="dangerSelectable(text, hxPost, hxConfirm, extraClass)"
        type="button"
        disabled
        class="bg-danger dark:bg-danger-dark text-accent-contrast dark:text-accent-contrast-dark
               disabled:opacity-40 disabled:cursor-not-allowed"
        th:classappend="${extraClass}"
        :disabled="selectedIds.length === 0"
        th:hx-post="${hxPost}"
        th:hx-confirm="${hxConfirm}"
        hx-swap="none"
        th:text="${text}">Elimina selezionate</button>

<!--
  Bottone del theme-switch nell'header (☀️/🌙/Auto): value e' il
  valore assegnato alla variabile Alpine "theme" dichiarata su <body>
  in layout.html (light/dark/auto), content il testo/icona visibile,
  title l'attributo title (gia' risolto con #{...} dal chiamante, vedi
  fragments/header.html). @click/:class restano Alpine puro, MAI
  processati da Thymeleaf (th:attr non accetta nomi con "@"/":" nella
  sua sintassi di assegnazione, verificato): "value" arriva invece via
  th:data-theme-value, letto a runtime con $el.dataset.themeValue -
  stesso ponte data-*/$el.dataset documentato in CLAUDE.md,
  "Convenzione: theming".
-->
<!--
  Bottone "reimposta ai default" del pannello impostazioni di /deep-chat
  (fragments/generation-params.html, vedi deep-chat.html): tocca DUE
  cose in un solo click, da cui il comportamento hardcoded invece di un
  parametro in piu' (stesso principio di dangerSelectable/themeToggle
  sopra - singolo chiamante, mai riusato altrove per ora). hx-params="none"
  e' cio' che rende questo un vero reset e non un refresh: senza,
  htmx includerebbe di default i valori GIA' presenti nel form
  (essendo il bottone al suo interno), rimandando al server gli stessi
  valori da azzerare invece dei suoi default puri (vedi
  GenerationController#params/populateFormTypeFields). @click riporta
  anche la <select> del modello (#image-model-input, id fisso) al
  modello di default PRIMA che la richiesta parta - defaultModel arriva
  via th:data-default-model/$el.dataset, stesso ponte di themeToggle
  sotto: un binding Alpine puro non passa mai da th:attr (nomi con
  "@"/":" non accettati dal suo parser di assegnazione, vedi CLAUDE.md).
-->
<button th:fragment="resetToDefaults(text, hxGet, defaultModel, extraClass)"
        type="button"
        th:classappend="${extraClass}"
        th:hx-get="${hxGet}"
        hx-target="#generation-params-fields" hx-swap="innerHTML" hx-params="none"
        th:data-default-model="${defaultModel}"
        @click="document.getElementById('image-model-input').value = $el.dataset.defaultModel;
                document.getElementById('image-model-input').dispatchEvent(new Event('pines-select:sync'))"
        th:text="${text}">Reimposta ai default</button>

<!--
  Icona "AI enhance" sovrapposta alla textarea del prompt in
  fragments/generate-form.html :: promptField (unico chiamante: hx-post/
  hx-target/hx-swap sono percio' hardcoded qui, non parametrizzati -
  stesso principio gia' visto in dangerSelectable/resetToDefaults sopra
  per bottoni con un solo punto di chiamata). type="button" e' CRITICO:
  questo bottone vive dentro il <form> di POST /generations (spesa reale
  su Replicate a ogni submit) - senza, un click lo sottometterebbe invece
  di limitarsi a riscrivere il prompt. hx-include="#prompt" manda solo il
  testo della textarea, non gli altri campi del form. hx-disabled-elt
  disabilita il bottone stesso durante la richiesta (stato "in corso"
  gestito da htmx, nessun Alpine coinvolto): lo swap outerHTML della
  risposta lo ripristina da solo. Nessuno standard di "opacita' a riposo"
  per un'icona esiste altrove nel progetto (il pencil di
  conversation-list.html usa un colore muted, non opacity): si estende
  qui l'idioma piu' vicino gia' adottato, read-only:opacity-60
  (fragments/generation-params-flux-lora-ff3.html), a piena opacita' su
  hover/focus - hover:opacity-100 esplicito perche' altrimenti la regola
  globale "button:hover{opacity:.9}" del layer base (fragments/layout.html)
  vincerebbe per specificita' su una bare utility opacity-60. Lo stato
  disabled riusa invece l'esatto standard gia' in uso altrove
  (disabled:opacity-40 disabled:cursor-not-allowed, vedi dangerSelectable
  sopra e generations-list.html).
-->
<button th:fragment="aiEnhance(title)"
        type="button"
        th:hx-post="@{/generations/enhance-prompt}"
        hx-include="#prompt, #image-model-input, #param-source-upload, [name=sourceGenerationId], [name=sourceImage]"
        hx-encoding="multipart/form-data"
        hx-target="#prompt-field"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        class="absolute right-2 top-2 bg-transparent border-0 p-1 leading-none cursor-pointer
               text-ink-muted dark:text-ink-muted-dark hover:text-accent dark:hover:text-accent-dark
               opacity-60 hover:opacity-100 focus-visible:opacity-100 transition-opacity
               disabled:opacity-40 disabled:cursor-not-allowed"
        th:title="${title}"
        th:aria-label="${title}">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
    </svg>
</button>

<!--
  Bottone "Interrompi" del placeholder di generazione
  (fragments/generation-placeholder.html). Stili INLINE, non Tailwind:
  lo stesso markup finisce anche dentro lo shadow DOM di <deep-chat>, che
  non vede le classi della pagina. hx-post/hx-confirm servono alla pagina
  htmx (hx-target/hx-swap sul div di polling #generation-status); in chat
  li ignora, e' la classe gen-cancel + data-cancel/-confirm/-failed a
  pilotarlo via JS (vedi deep-chat.html). `disabled` (Boolean, anche null)
  = interruzione gia' richiesta o fallita: testo disabledText, non cliccabile.
-->
<button th:fragment="stop(text, disabledText, confirmText, failedText, url, disabled)"
        type="button" class="gen-cancel"
        th:hx-post="${url}" th:hx-confirm="${confirmText}"
        hx-target="#generation-status" hx-swap="outerHTML"
        th:data-cancel-url="${url}" th:data-confirm="${confirmText}"
        th:data-failed-text="${failedText}"
        th:data-disabled-text="${disabledText}"
        th:disabled="${disabled}"
        style="padding:4px 12px;border-radius:6px;border:1px solid rgba(220,38,38,0.8);background:transparent;
               color:rgb(220,38,38);cursor:pointer;font-size:0.85rem"
        th:text="${disabled} ? ${disabledText} : ${text}">Interrompi</button>

<!-- Nascondi/mostra le immagini di un risultato in chat (shadow DOM di <deep-chat>: stili INLINE, click via htmlClassUtilities 'gen-toggle' in deep-chat.html). -->
<button th:fragment="galleryToggle(text, hideText, showText)"
        type="button" class="gen-toggle"
        th:data-hide-text="${hideText}" th:data-show-text="${showText}"
        style="align-self:flex-end;padding:4px 12px;border-radius:6px;border:1px solid rgba(128,128,128,0.6);background:transparent;
               color:inherit;cursor:pointer;font-size:0.85rem"
        th:text="${text}">Nascondi</button>

<!--
  navToggle(open, content, title): md:hidden (i due usi stanno solo sotto md). apre (open=true) o chiude (open=false) lo
  slideover di navigazione di fragments/header.html (stato Alpine navOpen sul
  <header>). Valore per-istanza via data-* letto con $el.dataset, stesso ponte
  di themeToggle qui sotto.
-->
<button th:fragment="navToggle(open, content, title)"
        type="button"
        th:data-nav-open="${open}"
        class="border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark
               rounded-md px-3 py-1 cursor-pointer text-lg leading-none md:hidden"
        @click="navOpen = $el.dataset.navOpen === 'true'"
        th:title="${title}" th:aria-label="${title}"
        th:text="${content}">☰</button>

<!--
  menuToggle(text): toggle di un menu a tendina dell'header (fragments/header.html :: navMenu). Assume la variabile Alpine
  `open` sul contenitore navMenu. Il chevron ruota da aperto.
-->
<button th:fragment="menuToggle(text)"
        type="button"
        class="inline-flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0 text-[0.95rem]
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark"
        @click="open = !open" :aria-expanded="open" aria-haspopup="true">
    <span th:text="${text}">Menu</span>
    <span aria-hidden="true" class="text-[0.7rem] transition-transform" :class="open ? 'rotate-180' : ''">&#9662;</span>
</button>

<button th:fragment="themeToggle(value, content, title)"
        type="button"
        th:data-theme-value="${value}"
        class="border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark
               rounded-md px-2 py-1 cursor-pointer text-[0.85rem] leading-none"
        @click="theme = $el.dataset.themeValue"
        :class="{ 'border-accent dark:border-accent-dark text-accent dark:text-accent-dark': theme === $el.dataset.themeValue }"
        th:title="${title}"
        th:text="${content}">Bottone</button>

<!--
  animateOverlay(url, title, extraClass): icona overlay "Anima in un video" sul
  thumbnail di UNA singola immagine (gallery-card, generation-images). E' un <a>
  (navigazione GET verso /generations/new?source=..&sourceImage=..), non un
  <button>: stesso aspetto dell'icona "vedi dettaglio" di gallery-card.html, visibile
  solo all'hover del wrapper "group" (sempre su touch / con focus da tastiera).
  extraClass posiziona l'icona (es. 'bottom-2 right-2'). Sibling dell'<img>, mai figlio
  (niente bubbling verso lo zoom), SVG inline (mai <img>, vedi selettori lightbox).
-->
<a th:fragment="animateOverlay(url, title, extraClass)"
   th:href="${url}" th:title="${title}" th:aria-label="${title}"
   th:classappend="${extraClass}"
   class="absolute z-10 flex items-center justify-center w-8 h-8 rounded-full
          bg-black/50 text-white opacity-0 group-hover:opacity-100 focus-visible:opacity-100
          [@media(hover:none)]:opacity-100 transition-opacity duration-150">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 0 1-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75 0V5.625m0 12.75v-1.5c0-.621.504-1.125 1.125-1.125m18.375 2.625V5.625m0 12.75c0 .621-.504 1.125-1.125 1.125m1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125m0 3.75h-1.5A1.125 1.125 0 0 1 18 18.375M20.625 4.5H3.375m17.25 0c.621 0 1.125.504 1.125 1.125M20.625 4.5h-1.5C18.504 4.5 18 5.004 18 5.625m3.75 0v1.5c0 .621-.504 1.125-1.125 1.125M3.375 4.5c-.621 0-1.125.504-1.125 1.125M3.375 4.5h1.5C5.496 4.5 6 5.004 6 5.625m-3.75 0v1.5c0 .621.504 1.125 1.125 1.125m0 0h1.5m-1.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125m1.5-3.75C5.496 8.25 6 7.746 6 7.125v-1.5M4.875 8.25C5.496 8.25 6 8.754 6 9.375v1.5m0-5.25v5.25m0-5.25C6 5.004 6.504 4.5 7.125 4.5h9.75c.621 0 1.125.504 1.125 1.125m1.125 2.625h1.5m-1.5 0A1.125 1.125 0 0 1 18 7.125v-1.5m1.125 2.625c-.621 0-1.125.504-1.125 1.125v1.5m2.625-2.625c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125M18 5.625v5.25M7.125 12h9.75m-9.75 0A1.125 1.125 0 0 1 6 10.875M7.125 12C6.504 12 6 12.504 6 13.125m0-2.25C6 11.496 5.496 12 4.875 12M18 10.875c0 .621-.504 1.125-1.125 1.125M18 10.875c0 .621.504 1.125 1.125 1.125m-2.25 0c.621 0 1.125.504 1.125 1.125m-12 5.25v-5.25m0 5.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125m-12 0v-1.5c0-.621-.504-1.125-1.125-1.125M18 18.375v-5.25m0 5.25v-1.5c0-.621.504-1.125 1.125-1.125M18 13.125v1.5c0 .621.504 1.125 1.125 1.125M18 13.125c0-.621.504-1.125 1.125-1.125M6 13.125v1.5c0 .621-.504 1.125-1.125 1.125M6 13.125C6 12.504 5.496 12 4.875 12m-1.5 0h1.5m-1.5 0c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125M19.125 12h1.5m0 0c.621 0 1.125.504 1.125 1.125v1.5c0 .621-.504 1.125-1.125 1.125m-17.25 0h1.5m14.25 0h1.5" />
    </svg>
</a>

<!--
  editOverlay(url, title, extraClass): icona overlay "Modifica immagine" (matita) sul
  thumbnail di UNA singola immagine: apre /generations/new?kind=edit&source=..&sourceImage=..
  col modello di modifica. Stesso aspetto/visibilita' di animateOverlay; extraClass posiziona
  l'icona. Sibling dell'<img>, SVG inline.
-->
<a th:fragment="editOverlay(url, title, extraClass)"
   th:href="${url}" th:title="${title}" th:aria-label="${title}"
   th:classappend="${extraClass}"
   class="absolute z-10 flex items-center justify-center w-8 h-8 rounded-full
          bg-black/50 text-white opacity-0 group-hover:opacity-100 focus-visible:opacity-100
          [@media(hover:none)]:opacity-100 transition-opacity duration-150">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
    </svg>
</a>

<!--
  downloadOverlay(url, filename, title, extraClass): icona overlay "Scarica" sul
  thumbnail di UN singolo file (immagine o video: gallery-card, generation-images).
  <a download> verso /images/** (same-origin, quindi l'attributo download vale),
  stesso aspetto/visibilita' di animateOverlay. extraClass posiziona l'icona.
  Sibling dell'<img>, mai figlio; SVG inline (mai <img>, vedi selettori lightbox).
-->
<a th:fragment="downloadOverlay(url, filename, title, extraClass)"
   th:href="${url}" th:attr="download=${filename}" th:title="${title}" th:aria-label="${title}"
   th:classappend="${extraClass}"
   class="absolute z-10 flex items-center justify-center w-8 h-8 rounded-full
          bg-black/50 text-white opacity-0 group-hover:opacity-100 focus-visible:opacity-100
          [@media(hover:none)]:opacity-100 transition-opacity duration-150">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
    </svg>
</a>

<!--
  starOverlay(generationId, filename, favourite, refresh, variant): icona overlay "star"
  (preferito) sul thumbnail di UN singolo file (immagine o video), rosa (token
  "favourite"). E' un <button> htmx (POST /generations/{id}/favourite, swap outerHTML
  su se' stesso: la risposta e' questo stesso fragment con lo stato invertito), non
  un <a>. hx-target="this" e' ESPLICITO: senza, htmx eredita l'hx-target degli antenati
  (es. #gallery-content dal wrapper di gallery.html) e la risposta sostituirebbe l'intera griglia. SEMPRE visibile (mai solo all'hover): lo stato si distingue dal colore
  (rosa + stella piena se favourite, bianca + stella vuota altrimenti), non dalla visibilita'. refresh=true (tab "Preferiti"):
  il server risponde anche con HX-Trigger gallery-update, cosi' la card sparisce.
  variant (posizione, classi letterali per la scansione statica della CLI Tailwind):
  card / card-solo (in basso a destra, ultima della colonna di icone a destra, allineata in basso),
  detail (immagini del dettaglio: in basso a destra), detail-video (in alto a sinistra dopo
  le altre icone: in basso a destra ci sono i controlli nativi del video). Sibling dell'<img>, SVG inline.
  Le classi bg/p/rounded esplicite sovrascrivono la regola base di "button".
-->
<button th:fragment="starOverlay(generationId, filename, favourite, refresh, variant)"
        type="button"
        th:hx-post="@{'/generations/' + ${generationId} + '/favourite'(filename=${filename}, refresh=${refresh}, variant=${variant})}"
        hx-target="this" hx-swap="outerHTML"
        th:title="${favourite} ? #{gallery.favourite.remove} : #{gallery.favourite.add}"
        th:aria-label="${favourite} ? #{gallery.favourite.remove} : #{gallery.favourite.add}"
        th:aria-pressed="${favourite}"
        class="absolute z-10 flex items-center justify-center w-8 h-8 p-0 rounded-full bg-black/50
               transition-opacity duration-150"
        th:classappend="(${variant} == 'detail-video' ? 'top-1 left-10' : (${variant} == 'detail' ? 'bottom-1 right-1' : 'bottom-2 right-2'))
                        + ' ' + (${favourite} ? 'text-favourite dark:text-favourite-dark' : 'text-white')">
    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
         th:attr="fill=${favourite} ? 'currentColor' : 'none'" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
    </svg>
</button>

<!--
  Dialog modale (Pines UI): dialogOpen/dialogClose assumono la variabile Alpine `dialogOpen` su un antenato x-data (stesso
  accoppiamento esplicito di dangerSelectable con selectedIds o toastClose con dismiss): la pagina che ospita il dialog la
  dichiara (vedi search.html). dialogClose e' la variante neutra ("Annulla"); dialogCloseIcon la "x" nell'intestazione.
-->
<!--
  dialogOpen(text, hxGet, hxTarget, hxSwap, neutral, extraClass): apre il dialog e, se hxGet e' valorizzato, carica PRIMA il suo
  contenuto (un form fresco per "Nuova nota", quello precompilato per "Modifica"): niente stato residuo di un uso precedente.
  neutral=true per la variante neutra (azioni per riga), false per il primario.
-->
<button th:fragment="dialogOpen(text, hxGet, hxTarget, hxSwap, neutral, extraClass)" type="button" @click="dialogOpen = true"
        th:hx-get="${hxGet}" th:hx-target="${hxTarget}" th:hx-swap="${hxSwap}"
        th:classappend="${(neutral ? 'bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark' : '') + ' ' + (extraClass ?: '')}"
        th:text="${text}">Apri</button>

<button th:fragment="dialogClose(text, extraClass)" type="button" @click="dialogOpen = false"
        class="bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark"
        th:classappend="${extraClass}" th:text="${text}">Annulla</button>

<button th:fragment="dialogCloseIcon(title)" type="button" @click="dialogOpen = false"
        th:title="${title}" th:aria-label="${title}"
        class="shrink-0 w-8 h-8 p-0 rounded-full bg-transparent border-0 text-ink-muted dark:text-ink-muted-dark hover:bg-canvas dark:hover:bg-canvas-dark text-xl leading-none">&times;</button>

<!--
  toastClose(title): bottone "x" di un toast (fragments/toast.html). L'@click assume l'antenato Alpine del
  container dei toast (funzione dismiss e variabile di loop `t` di x-for): stesso accoppiamento esplicito di
  dangerSelectable con selectedIds. Classi esplicite sovrascrivono la regola base di "button".
-->
<button th:fragment="toastClose(title)" type="button"
        th:title="${title}" th:aria-label="${title}"
        @click="dismiss(t.key)"
        class="shrink-0 w-6 h-6 p-0 rounded-full bg-transparent text-ink-muted dark:text-ink-muted-dark hover:bg-canvas dark:hover:bg-canvas-dark leading-none">&times;</button>

<!--
  bell(count, hasError, title): bottone della campanella della toolbar (fragments/notification-bell.html). Assume la variabile
  Alpine `open` sul contenitore. Senza non letti (count 0) l'icona e' neutra e senza badge ("spenta"); con non letti il badge
  mostra il conteggio (9+ oltre 9): rosso (danger) se fra i non letti c'e' un ERROR, altrimenti warning. Il testo del
  badge usa il colore di contrasto dei token (il badge e' sempre una tinta piena). title/aria-label: conteggio gia' tradotto.
-->
<button th:fragment="bell(count, hasError, title)" type="button"
        @click="open = !open" :aria-expanded="open" aria-haspopup="true"
        th:title="${title}" th:aria-label="${title}"
        class="relative inline-flex items-center rounded-md border-0 bg-transparent p-1.5 hover:opacity-100
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </svg>
    <span th:if="${count > 0}"
          class="absolute -right-1 -top-1 h-4 min-w-4 rounded-full px-1 text-center text-[0.65rem] font-semibold leading-4
                 text-accent-contrast dark:text-accent-contrast-dark"
          th:classappend="${hasError} ? 'bg-danger dark:bg-danger-dark' : 'bg-warning dark:bg-warning-dark'"
          th:text="${count > 9} ? '9+' : ${count}">3</span>
</button>

</body>
</html>
