<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Guscio condiviso tra fragments/generate-form.html (dentro il <form>
  gia' esistente) e deep-chat.html (dentro un <form> non-submitting
  dedicato, per poter leggere i valori con FormData): stesso identico
  markup in entrambe le pagine (CLAUDE.md, "nessuna duplicazione di
  markup"). Parametro-meno (a differenza della vecchia versione): legge
  direttamente dal Model del controller (models, model, formFragment, +
  gli attributi dei singoli campi che il fragment del form-type corrente
  si aspetta), cosi' un domani un nuovo form-type non richiede ri-filare
  N parametri attraverso questo fragment e i suoi due chiamanti — vedi
  GenerationController/DeepChatController.

  I modelli sono censiti in DB (REPLICATE_MODEL, vedi migrazione V6): un
  insieme chiuso, non piu' testo libero come nella vecchia versione, da
  cui la <select> nativa al posto del vecchio combobox Alpine con
  ricerca/JSON bridge (quel bridge esisteva solo per due motivi ormai
  spariti: testo libero arbitrario, e ReplicateModelSummary non avendo
  getter JavaBean non era leggibile da un semplice th:each — ReplicateModel
  e' una vera entity JPA, li' ha).

  Cambiare modello scatena GET /generations/params (vedi
  GenerationController#params), che ri-renderizza SOLO
  #generation-params-fields col fragment del form-type di quel modello:
  hx-target/hx-swap sono dichiarati esplicitamente sulla <select> perche'
  su /generations/new sta dentro un <form th:hx-post="@{/generations}"
  hx-target="#generation-panel">, che altrimenti li erediterebbe
  dirottando la risposta li' invece che nel contenitore dei campi.
  hx-include="#generation-params-fields" manda insieme i valori gia'
  compilati nei campi attuali (preservati per i campi che il nuovo
  form-type condivide col precedente), non solo il valore della select.
-->
<th:block th:fragment="fields">
    <div class="relative">
        <label class="mt-0" for="image-model-input" th:text="#{generationParams.label.model}">Modello</label>
        <select id="image-model-input" name="model" required
                th:hx-get="@{/generations/params}"
                hx-target="#generation-params-fields" hx-swap="innerHTML"
                hx-trigger="change" hx-include="#generation-params-fields">
            <option th:each="m : ${models}" th:value="${m.identifier}" th:text="${m.identifier}"
                    th:title="${m.description}" th:selected="${m.identifier == model}"></option>
        </select>
        <th:block th:if="${models.isEmpty()}">
            <p th:replace="~{fragments/alert :: error(text=#{generationParams.error.noModels})}">
                Nessun modello Replicate censito nel catalogo.
            </p>
        </th:block>
    </div>

    <div id="generation-params-fields" hx-on:htmx:after-swap="this.dispatchEvent(new Event('input', { bubbles: true }))">
        <!--
          th:switch esplicito su formType (nome dell'enum GenerationFormType
          come stringa), non una risoluzione dinamica del nome del
          fragment via ${...}: Thymeleaf valuta un th:replace/th:insert
          dinamico SOLO come "templateName", non come "templateName ::
          selettore" gia' composto in un'unica stringa/variabile (provato
          dal vivo: 500 in parsing, "template might not exist"). Un
          th:case esplicito per form-type e' anche piu' coerente con la
          filosofia del progetto (niente motore di schema dinamico):
          aggiungerne uno nuovo significa aggiungere un altro th:case qui.
        -->
        <th:block th:switch="${formType}">
            <div th:case="'FLUX_LORA_FF3'" th:replace="~{fragments/generation-params-flux-lora-ff3 :: fields}"></div>
            <div th:case="'FLUX_2_KLEIN_9B'" th:replace="~{fragments/generation-params-flux-2-klein-9b :: fields}"></div>
        </th:block>
    </div>
</th:block>

</body>
</html>
