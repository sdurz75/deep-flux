<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Riga di una generazione nel listato /generations: NON un riuso di
  fragments/gallery-card.html (il suo stesso javadoc dice di copiarlo/
  adattarlo per un altro listato, non di riusarlo cosi' com'e' - assume
  un antenato Alpine con lightbox che qui non serve). A differenza della
  card di galleria, la riga deve reggere QUALUNQUE stato (non solo
  SUCCEEDED): niente thumbnail per una generazione ancora senza immagini
  (PENDING/PROCESSING) o mai arrivata ad averne (FAILED), un badge di
  stato colorato al suo posto.

  checkbox: name="ids" (letto da POST /generations/delete-selected,
  incluso automaticamente dal <form> antenato) + x-model="selectedIds"
  (click semplice) + @click="onCheckboxClick($event)" (attiva SOLO se
  shiftKey, vedi fragments/generations.html :: list) - stesso schema
  gemello di fragments/gallery-card.html, con l'aggiunta del gestore
  shift-click.

  currentPage: propagato al link di dettaglio come generationsPage, cosi'
  il "torna indietro"/il redirect post-cancellazione di
  fragments/generation.html :: status tornano a QUESTA pagina del
  listato invece che al default /gallery.
-->
<div th:fragment="row(generation, currentPage)"
     class="flex items-center gap-3 border border-line dark:border-line-dark rounded-lg px-3 py-2
            bg-surface dark:bg-surface-dark">

    <input type="checkbox" name="ids" th:value="${generation.id}" x-model="selectedIds"
           @click="onCheckboxClick($event)"
           th:aria-label="#{generations.row.select}"
           class="w-5 h-5 rounded accent-accent dark:accent-accent-dark cursor-pointer shrink-0">

    <a th:href="@{'/generations/' + ${generation.id}(generationsPage=${currentPage})}" class="shrink-0">
        <img th:if="${not #lists.isEmpty(generation.imageFilenames)}"
             th:src="@{'/images/' + ${generation.imageFilenames[0]}}"
             th:alt="${generation.prompt}"
             onerror="this.style.visibility='hidden'"
             class="w-14 h-14 rounded-md object-cover block">
        <span th:unless="${not #lists.isEmpty(generation.imageFilenames)}"
              th:switch="${generation.status.name()}"
              class="w-14 h-14 rounded-md flex items-center justify-center text-[0.7rem] font-semibold text-center px-1">
            <span th:case="'PENDING'" class="text-ink-muted dark:text-ink-muted-dark" th:text="#{generations.status.pending}">In attesa</span>
            <span th:case="'PROCESSING'" class="text-accent dark:text-accent-dark" th:text="#{generations.status.processing}">In corso</span>
            <span th:case="*" class="text-danger dark:text-danger-dark" th:text="#{generations.status.failed}">Fallita</span>
        </span>
    </a>

    <a th:href="@{'/generations/' + ${generation.id}(generationsPage=${currentPage})}" class="flex-1 min-w-0 no-underline text-ink dark:text-ink-dark">
        <p class="truncate" th:text="${generation.prompt}">prompt</p>
        <p class="text-[0.8rem] text-ink-muted dark:text-ink-muted-dark" th:text="${generation.model} + ' · ' + ${generation.createdAt}">modello · data</p>
    </a>

    <button th:replace="~{fragments/button :: danger(type='button', text=#{gallery.button.delete}, hxPost=@{'/generations/' + ${generation.id} + '/delete'},
                hxDelete=null, hxConfirm=#{generations.confirm.delete}, hxSwap='none', hxTarget=null,
                extraClass='shrink-0 px-3 py-1.5 text-[0.85rem]')}">Elimina</button>
</div>

</body>
</html>
