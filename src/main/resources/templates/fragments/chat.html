<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment riusabile sia dal primo caricamento di /chat/{id} (via
  th:replace) sia dalla risposta di POST /chat/{id}/messages, restituita
  cosi' com'e' a htmx (hx-target="#chat-messages" hx-swap="innerHTML").
  Nessun parametro dichiarato: legge messages/conversationId/error dal
  model, come fragments/generation.html :: status.
-->
<th:block th:fragment="messages">
    <p th:if="${error}" class="form-error" th:text="${error}">Errore</p>

    <ul class="chat-messages" th:unless="${#lists.isEmpty(messages)}">
        <li th:each="message : ${messages}"
            th:class="${message.role.name() == 'USER'} ? 'chat-message chat-message-user' : 'chat-message chat-message-assistant'">
            <p class="chat-message-content" th:text="${message.content}">messaggio</p>
            <a th:if="${message.role.name() == 'ASSISTANT'}"
               th:href="@{/generations/new(prompt=${message.content})}">Usa come prompt &rarr;</a>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(messages)}" class="hint">Scrivi il primo messaggio per iniziare.</p>
</th:block>

</body>
</html>
