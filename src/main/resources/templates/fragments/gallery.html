<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  content(...) e' il collante specifico della galleria: compone la
  griglia (grid, sotto) con la paginazione generica
  (fragments/pagination.html), passandole basePath="/gallery" e
  hxTarget="#gallery-content" - i due soli dettagli davvero specifici
  di QUESTA lista, che un futuro listato diverso passerebbe diversi
  senza toccare fragments/pagination.html. Stessi 6 parametri nominati
  di sempre: il contratto verso GalleryController non cambia (vedi
  CLAUDE.md, "Pattern controller: quando restituire fragment vs pagina
  intera" - una vista fragment risolta direttamente dal controller
  richiede parametri nominati).
-->
<th:block th:fragment="content(generations, currentPage, totalPages, hasPrevious, hasNext, pageNumbers)">
    <div th:replace="~{fragments/gallery :: grid(${generations})}"></div>
    <div th:replace="~{fragments/pagination :: nav('/gallery', '#gallery-content', ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, null)}"></div>
</th:block>

<!--
  gridOrEmpty(...) e' grid(...) con un messaggio al posto della griglia
  quando la lista e' vuota: usata dalla galleria contestuale di
  /deep-chat (deep-chat.html E DeepChatController#gallery, l'endpoint
  htmx richiamato ad ogni "new-message" - stesso identico markup in
  entrambi i punti, un solo posto da cui deriva). th:if/th:unless non
  possono stare sullo STESSO tag di th:replace (th:insert/th:replace ha
  precedenza piu' alta, scatterebbe comunque a prescindere dalla
  condizione, verificato dal vivo): serve il th:block che avvolge il
  th:replace condizionale, stesso principio gia' documentato sopra per
  th:each+th:replace in grid(...).
-->
<th:block th:fragment="gridOrEmpty(generations, emptyMessage)">
    <p th:if="${#lists.isEmpty(generations)}" th:text="${emptyMessage}"
       class="text-ink-muted dark:text-ink-muted-dark">Nessuna immagine.</p>
    <th:block th:unless="${#lists.isEmpty(generations)}">
        <div th:replace="~{fragments/gallery :: grid(${generations})}"></div>
    </th:block>
</th:block>

<!--
  Griglia + lightbox: adattamento del componente "Image Gallery" di
  Pines UI (https://devdojo.com/pines/docs/image-gallery), con tre
  scostamenti deliberati dallo snippet originale:
  1. Niente array JS "imageGallery" duplicato con photo/alt, ne'
     un conteggio/indice cachato: i dati sono gia' nel DOM (th:each
     sotto), qui il wraparound di next/prev ricalcola ogni volta la
     lista live delle <img> (imageGalleryImages()), cosi' resta
     corretto anche dopo che una generazione viene eliminata (dal
     dettaglio, non piu' da qui, vedi gallery-detail.html) e la card
     sparisce dalla griglia al prossimo caricamento.
  2. Niente x-teleport="body" sul modal: il fragment viene sostituito
     per intero dalle risposte htmx di paginazione
     (hx-target="#gallery-content" hx-swap="innerHTML"); un nodo
     teletrasportato fuori da quel contenitore resterebbe orfano nel
     <body> ad ogni cambio pagina. position:fixed funziona lo stesso
     senza teleport (nessun antenato usa transform/filter).
  3. Grid/card restano <div>, non <ul>/<li>: niente reset list-style
     da preoccuparsi. .gallery-card (in fragments/gallery-card.html,
     non piu' in questo file) e' l'unica classe non-Tailwind rimasta
     su questi elementi, ed e' un hook di selezione cross-file (letto
     da imageGalleryImages() qui sotto), non una classe di stile - il
     suo aspetto visivo e' Tailwind inline nella card.
  x-trap.inert.noscroll sul modal richiede il plugin @alpinejs/focus
  caricato in fragments/layout.html prima del core Alpine.

  th:each su fragments/gallery-card :: card non puo' stare sullo stesso
  tag di th:replace (Thymeleaf processa l'inclusione fragment PRIMA
  dell'iterazione: la replace scatterebbe una volta sola, non per ogni
  elemento) - serve il th:block th:each sotto che avvolge un div
  th:replace figlio.
-->
<th:block th:fragment="grid(generations)">
    <div class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-4"
         x-ref="gallery"
         x-data="{
            imageGalleryOpened: false,
            imageGalleryActiveUrl: null,
            imageGalleryImageIndex: null,
            imageGalleryImages() {
                return Array.from(this.$refs.gallery.querySelectorAll('.gallery-card img'));
            },
            imageGalleryOpen(event) {
                this.imageGalleryImageIndex = this.imageGalleryImages().indexOf(event.target);
                this.imageGalleryActiveUrl = event.target.src;
                this.imageGalleryOpened = true;
            },
            imageGalleryClose() {
                this.imageGalleryOpened = false;
                setTimeout(() => this.imageGalleryActiveUrl = null, 300);
            },
            imageGalleryNext() {
                const images = this.imageGalleryImages();
                if (images.length === 0) { this.imageGalleryClose(); return; }
                this.imageGalleryImageIndex = (this.imageGalleryImageIndex + 1) % images.length;
                this.imageGalleryActiveUrl = images[this.imageGalleryImageIndex].src;
            },
            imageGalleryPrev() {
                const images = this.imageGalleryImages();
                if (images.length === 0) { this.imageGalleryClose(); return; }
                this.imageGalleryImageIndex = (this.imageGalleryImageIndex - 1 + images.length) % images.length;
                this.imageGalleryActiveUrl = images[this.imageGalleryImageIndex].src;
            }
         }"
         @image-gallery-next.window="imageGalleryNext()"
         @image-gallery-prev.window="imageGalleryPrev()"
         @keyup.right.window="imageGalleryNext()"
         @keyup.left.window="imageGalleryPrev()">

        <th:block th:each="g : ${generations}">
            <div th:replace="~{fragments/gallery-card :: card(${g})}"></div>
        </th:block>

        <!-- Lightbox fullscreen: apertura via imageGalleryOpen sul click di un'immagine (in fragments/gallery-card.html). -->
        <div x-show="imageGalleryOpened"
             x-transition:enter="transition ease-in-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:leave="transition ease-in-in duration-300"
             x-transition:leave-end="opacity-0"
             @click="imageGalleryClose"
             @keydown.window.escape="imageGalleryClose"
             x-trap.inert.noscroll="imageGalleryOpened"
             class="fixed inset-0 z-[99] flex items-center justify-center bg-black/50 select-none cursor-zoom-out"
             x-cloak>
            <div class="flex relative justify-center items-center w-11/12 xl:w-4/5 h-11/12">
                <div @click="$event.stopPropagation(); $dispatch('image-gallery-prev')"
                     class="flex absolute left-0 justify-center items-center w-14 h-14 text-white rounded-full translate-x-10 cursor-pointer xl:-translate-x-24 2xl:-translate-x-32 bg-white/10 hover:bg-white/20">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </div>

                <img x-show="imageGalleryOpened"
                     x-transition:enter="transition ease-in-out duration-300"
                     x-transition:enter-start="opacity-0 transform scale-50"
                     x-transition:leave="transition ease-in-in duration-300"
                     x-transition:leave-end="opacity-0 transform scale-50"
                     class="object-contain object-center w-full h-full select-none cursor-zoom-out"
                     :src="imageGalleryActiveUrl"
                     alt="">

                <div @click="$event.stopPropagation(); $dispatch('image-gallery-next')"
                     class="flex absolute right-0 justify-center items-center w-14 h-14 text-white rounded-full -translate-x-10 cursor-pointer xl:translate-x-24 2xl:translate-x-32 bg-white/10 hover:bg-white/20">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </div>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
