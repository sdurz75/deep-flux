<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment riusabile sia dal primo caricamento di /generations/new (via
  th:replace) sia dalla risposta di POST /generations quando la
  creazione fallisce e htmx deve solo ri-sostituire il form con
  l'errore inline (nessuna pagina di errore generica).
-->
<th:block th:fragment="form">
    <div>
        <th:block th:if="${error}">
            <p th:replace="~{fragments/alert :: error(text=${error})}">Errore</p>
        </th:block>

        <form th:hx-post="@{/generations}" hx-target="#generation-panel" hx-swap="innerHTML">
            <div th:replace="~{fragments/generation-params :: fields}"></div>

            <label for="version" th:text="#{generateForm.label.version}">Version (opzionale, hash pinnato)</label>
            <input type="text" id="version" name="version" th:value="${version}"
                   th:placeholder="#{generateForm.placeholder.version}" placeholder="lascia vuoto per usare l'ultima versione pubblicata">

            <label for="prompt" th:text="#{generateForm.label.prompt}">Prompt</label>
            <textarea id="prompt" name="prompt" rows="3" required th:text="${prompt}"></textarea>

            <button th:replace="~{fragments/button :: primary(type='submit', text=#{generateForm.button.submit}, extraClass='mt-4')}">Genera</button>
        </form>
    </div>
</th:block>

</body>
</html>
