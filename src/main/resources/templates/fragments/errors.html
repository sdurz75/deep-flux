<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  content(...) del registro errori (/errors): mirror di fragments/generations.html :: content. Il wrapper
  con hx-trigger vive QUI dentro (non su #errors-content) per tenere currentPage allineato a cio' che il
  server ha appena servito; "error-toast from:body" (CustomEvent di fragments/live-events.html, arriva a
  ogni NUOVA serie di errori) ricarica la lista, "every 15s" copre le ripetizioni di una serie esistente
  (che aggiornano il contatore ma non producono un nuovo evento).
  Ogni riga e' un <details> nativo (nessun JS): la sintesi sempre visibile, lo stack trace a richiesta.
-->
<th:block th:fragment="content(errors, currentPage, totalPages, hasPrevious, hasNext, pageNumbers)">
    <div style="display:contents" th:hx-get="@{/errors(page=${currentPage})}"
         hx-trigger="error-toast from:body, every 15s" hx-target="#errors-content" hx-swap="innerHTML">
        <p th:if="${#lists.isEmpty(errors)}" th:text="#{errors.empty}" class="mt-4">Nessun errore registrato.</p>

        <ul th:unless="${#lists.isEmpty(errors)}" class="list-none p-0 mt-4 flex flex-col gap-3">
            <li th:each="e : ${errors}"
                class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark px-4 py-3">
                <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-[0.85rem]">
                    <span class="font-semibold text-danger dark:text-danger-dark" th:text="#{'errors.source.' + ${e.source.name()}}">Replicate</span>
                    <span class="font-mono" th:text="${e.operation}">operazione</span>
                    <span th:if="${e.occurrences > 1}" class="rounded-full px-2 bg-canvas dark:bg-canvas-dark border border-line dark:border-line-dark"
                          th:text="'×' + ${e.occurrences}">×3</span>
                    <span class="text-ink-muted dark:text-ink-muted-dark" th:text="${e.lastSeenAt}">data</span>
                    <a th:if="${e.generationId != null}" th:href="@{'/generations/' + ${e.generationId}}"
                       th:text="#{errors.link.generation(${e.generationId})}">Generazione #1</a>
                    <a th:if="${e.conversationId != null}" th:href="@{'/deep-chat/' + ${e.conversationId}}"
                       th:text="#{errors.link.conversation}">Conversazione</a>
                </div>
                <p class="mt-2 mb-0 break-words" th:text="${e.message}">messaggio</p>
                <details th:if="${e.details != null}" class="mt-2">
                    <summary class="cursor-pointer text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{errors.details}">Dettagli</summary>
                    <pre class="mt-2 p-3 overflow-x-auto text-[0.75rem] rounded-md bg-canvas dark:bg-canvas-dark border border-line dark:border-line-dark" th:text="${e.details}">stack</pre>
                </details>
            </li>
        </ul>

        <div th:replace="~{fragments/pagination :: nav('/errors', '#errors-content', ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, null)}"></div>
    </div>
</th:block>

</body>
</html>
