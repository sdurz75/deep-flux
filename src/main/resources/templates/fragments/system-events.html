<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  content(...) del registro eventi di sistema (/system/events): mirror di fragments/generations.html :: content. Il wrapper
  con hx-trigger vive QUI dentro (non su #events-content) per tenere currentPage allineato a cio' che il
  server ha appena servito; "system-event from:body" (CustomEvent di fragments/live-events.html, arriva a
  ogni NUOVA serie di errori) ricarica la lista, "every 15s" copre le ripetizioni di una serie esistente
  (che aggiornano il contatore ma non producono un nuovo evento).
  Ogni riga e' un <details> nativo (nessun JS): la sintesi sempre visibile, lo stack trace a richiesta.
-->
<th:block th:fragment="content(events, eventLinks, currentPage, totalPages, hasPrevious, hasNext, pageNumbers, severity, highlightId, unseenCount)">
    <div style="display:contents" th:hx-get="@{/system/events(page=${currentPage}, severity=${severity})}"
         th:with="basePath=(${severity == null} ? '/system/events' : '/system/events?severity=' + ${severity})"
         hx-trigger="system-event from:body, every 15s" hx-target="#events-content" hx-swap="innerHTML">

        <!--/* Filtro per severita' (link veri: funzionano anche senza JS) + "segna tutti come letti" quando ce ne sono di non letti. */-->
        <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
            <nav class="inline-flex overflow-hidden rounded-md border border-line dark:border-line-dark text-[0.9rem]" th:aria-label="#{events.filter.label}">
                <a th:href="@{/system/events}" th:hx-get="@{/system/events}" hx-target="#events-content" hx-swap="innerHTML"
                   th:text="#{events.filter.all}"
                   class="px-3 py-1.5 no-underline"
                   th:classappend="${severity == null} ? 'bg-surface dark:bg-surface-dark font-semibold text-accent dark:text-accent-dark' : 'text-ink dark:text-ink-dark'">Tutti</a>
                <a th:href="@{/system/events(severity='ERROR')}" th:hx-get="@{/system/events(severity='ERROR')}" hx-target="#events-content" hx-swap="innerHTML"
                   th:text="#{events.filter.errors}"
                   class="border-l border-line dark:border-line-dark px-3 py-1.5 no-underline"
                   th:classappend="${severity == 'ERROR'} ? 'bg-surface dark:bg-surface-dark font-semibold text-accent dark:text-accent-dark' : 'text-ink dark:text-ink-dark'">Errori</a>
                <a th:href="@{/system/events(severity='WARNING')}" th:hx-get="@{/system/events(severity='WARNING')}" hx-target="#events-content" hx-swap="innerHTML"
                   th:text="#{events.filter.warnings}"
                   class="border-l border-line dark:border-line-dark px-3 py-1.5 no-underline"
                   th:classappend="${severity == 'WARNING'} ? 'bg-surface dark:bg-surface-dark font-semibold text-accent dark:text-accent-dark' : 'text-ink dark:text-ink-dark'">Avvisi</a>
            </nav>
            <th:block th:if="${unseenCount > 0}">
                <button th:replace="~{fragments/button :: neutral(type='button', text=#{events.button.markSeen}, hxGet=null,
                                    hxPost=@{/system/events/seen}, hxTarget='#notification-bell', hxSwap='innerHTML',
                                    extraClass='px-3 py-1.5 text-[0.85rem]')}">Segna tutti come letti</button>
            </th:block>
        </div>

        <p th:if="${#lists.isEmpty(events)}" th:text="#{events.empty}" class="mt-4">Nessun evento registrato.</p>

        <ul th:unless="${#lists.isEmpty(events)}" class="list-none p-0 mt-4 flex flex-col gap-3">
            <li th:each="e : ${events}" th:id="'event-' + ${e.id}"
                class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark px-4 py-3"
                th:classappend="${highlightId != null and highlightId == e.id} ? 'ring-2 ring-accent dark:ring-accent-dark'">
                <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-[0.85rem]">
                    <span th:if="${e.acknowledgedAt == null}" th:title="#{events.unseen}" th:aria-label="#{events.unseen}"
                          class="inline-block h-2 w-2 self-center rounded-full bg-accent dark:bg-accent-dark"></span>
                    <span class="font-semibold"
                          th:classappend="${e.severity.name() == 'WARNING'} ? 'text-warning dark:text-warning-dark' : 'text-danger dark:text-danger-dark'"
                          th:text="#{'events.severity.' + ${e.severity.name()}}">Errore</span>
                    <span class="font-semibold" th:text="#{'events.source.' + ${e.source}}">Replicate</span>
                    <span class="font-mono" th:text="${e.operation}">operazione</span>
                    <span th:if="${e.occurrences > 1}" class="rounded-full px-2 bg-canvas dark:bg-canvas-dark border border-line dark:border-line-dark"
                          th:text="'×' + ${e.occurrences}">×3</span>
                    <span class="text-ink-muted dark:text-ink-muted-dark" th:text="${e.lastSeenAt}">data</span>
                    <a th:each="link : ${eventLinks.get(e.id)}" th:href="@{${link.path}}" th:text="${link.label}">Generazione #1</a>
                    <a th:if="${e.source == 'TOKENS'}" th:href="@{/tokens}" th:text="#{events.link.tokens}">Token</a>
                </div>
                <p class="mt-2 mb-0 break-words" th:text="${e.message}">messaggio</p>
                <details th:if="${e.details != null}" class="mt-2">
                    <summary class="cursor-pointer text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{events.details}">Dettagli</summary>
                    <pre class="mt-2 p-3 overflow-x-auto text-[0.75rem] rounded-md bg-canvas dark:bg-canvas-dark border border-line dark:border-line-dark" th:text="${e.details}">stack</pre>
                </details>
            </li>
        </ul>

        <!--/* basePath con il filtro nella query: la paginazione generica appende "&page=N". */-->
        <div th:replace="~{fragments/pagination :: nav(${basePath}, '#events-content', ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, null)}"></div>
    </div>
</th:block>

</body>
</html>
