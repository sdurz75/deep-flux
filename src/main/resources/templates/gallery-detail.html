<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="#{galleryDetail.title(${generation.id})}">Immagine</title>
</head>
<body>
<div layout:fragment="content">
    <p><a th:href="@{/gallery}">&larr; <span th:text="#{galleryDetail.backLink}">Torna alla galleria</span></a></p>

    <!--
      Unico punto dove una generazione si puo' eliminare (rimosso dalla
      card della griglia, vedi fragments/gallery-card.html): pattern a
      livello di FORM (vera action/method HTML), non a livello di
      bottone isolato, perche' questo form deve degradare correttamente
      senza JavaScript (th:hx-post/hx-swap inerti, il browser fa un POST
      normale gestito dal ramo non-htmx di GalleryController#delete).
      hx-swap="none": la risposta htmx porta solo l'header HX-Redirect
      (la pagina corrente non esiste piu' dopo la cancellazione), nessun
      contenuto da inserire.
    -->
    <form class="flex justify-end mb-2" th:action="@{'/gallery/' + ${generation.id} + '/delete'}" method="post"
          th:hx-post="@{'/gallery/' + ${generation.id} + '/delete'}"
          hx-swap="none"
          th:hx-confirm="#{gallery.confirm.delete}">
        <button th:replace="~{fragments/button :: danger(type='submit', text=#{gallery.button.delete}, hxPost=null, hxConfirm=null, hxSwap=null, hxTarget=null, extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina</button>
    </form>

    <!-- Una generazione puo' avere piu' di un'immagine (num_outputs > 1, vedi CLAUDE.md): a differenza della card di griglia (una sola thumbnail + badge conteggio), qui il dettaglio le mostra tutte. -->
    <div class="flex flex-wrap gap-4 my-4">
        <img th:each="filename : ${generation.imageFilenames}"
             th:src="@{'/images/' + ${filename}}"
             th:alt="${generation.prompt}"
             class="max-w-full rounded-md border border-line dark:border-line-dark block">
    </div>

    <dl>
        <dt class="mt-4 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{galleryDetail.label.prompt}">Prompt</dt>
        <dd class="ms-0 mt-1" th:text="${generation.prompt}">prompt</dd>

        <dt class="mt-4 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{galleryDetail.label.model}">Modello</dt>
        <dd class="ms-0 mt-1" th:text="${generation.model}">modello</dd>

        <dt th:if="${generation.version}" class="mt-4 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{galleryDetail.label.version}">Version</dt>
        <dd th:if="${generation.version}" class="ms-0 mt-1" th:text="${generation.version}">version</dd>

        <dt th:if="${generation.parametersJson}" class="mt-4 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{galleryDetail.label.parameters}">Parametri</dt>
        <dd th:if="${generation.parametersJson}" class="ms-0 mt-1"><pre th:text="${generation.parametersJson}"
            class="bg-surface dark:bg-surface-dark border border-line dark:border-line-dark rounded-md p-3 overflow-x-auto font-mono text-[0.85rem]">{}</pre></dd>

        <dt class="mt-4 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{galleryDetail.label.completedAt}">Generata il</dt>
        <dd class="ms-0 mt-1" th:text="${generation.completedAt}">timestamp</dd>
    </dl>
</div>
</body>
</html>
