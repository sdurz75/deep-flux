<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="#{generationStatus.title}">Generazione in corso</title>
    <!--
      Fallback per navigazione senza JS: dentro <noscript> non compete
      mai col polling htmx del fragment (hx-trigger="every 2s"), che
      resta il meccanismo primario quando JS e' disponibile.
    -->
    <noscript th:if="${generation.status.name() == 'PENDING' or generation.status.name() == 'PROCESSING'}">
        <meta http-equiv="refresh" content="3">
    </noscript>
</head>
<body>
<div layout:fragment="content">
    <h1 th:text="#{generationStatus.heading(${generation.id})}">Generazione #1</h1>
    <p><em th:text="${generation.prompt}">prompt</em></p>

    <div th:replace="~{fragments/generation :: status}"></div>
</div>
</body>
</html>
