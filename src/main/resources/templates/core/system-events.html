<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{events.title}">Eventi di sistema</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.manage}, parentPath=null, parentText=null, current=#{events.title})}"></nav>
</div>
<div layout:fragment="content">
    <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
        <h1 th:text="#{events.title}">Eventi di sistema</h1>
        <button th:replace="~{fragments/core/button :: danger(type='button', text=#{events.button.clear},
                    hxPost=@{/system/events/clear}, hxDelete=null, hxConfirm=#{events.confirm.clear},
                    hxSwap='innerHTML', hxTarget='#events-content',
                    extraClass='px-3 py-1.5 text-[0.85rem]')}">Svuota</button>
    </div>

    <p class="text-ink-muted dark:text-ink-muted-dark" th:text="#{events.intro}">Eventi di sistema.</p>

    <div id="events-content">
        <div th:replace="~{fragments/core/system-events :: content(${events}, ${eventLinks}, ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, ${severity}, ${highlightId}, ${unseenCount})}"></div>
    </div>

    <div th:replace="~{fragments/core/live-events :: connect}"></div>
</div>
</body>
</html>
