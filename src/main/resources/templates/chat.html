<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Chat</title>
</head>
<body>
<main class="container">
    <p><a th:href="@{/chat}">&larr; Tutte le conversazioni</a></p>
    <h1>Chat</h1>

    <div id="chat-messages">
        <div th:replace="~{fragments/chat :: messages}"></div>
    </div>

    <form th:action="@{'/chat/' + ${conversationId} + '/messages'}"
          th:hx-post="@{'/chat/' + ${conversationId} + '/messages'}"
          hx-target="#chat-messages" hx-swap="innerHTML"
          method="post">
        <label for="message">Messaggio</label>
        <textarea id="message" name="message" rows="3" required></textarea>
        <button type="submit">Invia</button>
    </form>
</main>
</body>
</html>
