# ============================================================
# Bundle di default (italiano) - vedi CLAUDE.md, sezione
# "Convenzione: internazionalizzazione (i18n)". Nomi chiave punto-
# separati, <pagina-o-componente>.<categoria>.<elemento>: il namespace
# e' solo convenzionale, il bundle resta un unico file piatto sia per
# le stringhe di template sia per i messaggi d'errore Java (vedi
# org.dual.replicate.core.kernel.i18n.Messages).
#
# Regola apostrofi: Spring passa un messaggio per MessageFormat SOLO
# quando la chiamata ha argomenti (#{key(${arg})} in Thymeleaf,
# Messages.get(code, args...) in Java). Chiavi SENZA parametri: gli
# apostrofi restano non-escaped (l'app, puo', d'ambiente...). Chiavi
# CON parametri: un apostrofo letterale va raddoppiato (''), altrimenti
# scompare silenziosamente - vedi imagestorage.error.saveImage/
# deleteImage e deepchat.error.contactAssistant, gli unici 3 casi reali
# in questo bundle.
#
# Argomenti numerici (id, minuti) passano per NumberFormat, che
# inserisce separatori di migliaia locale-dependent: {0,number,#}
# invece di {0} per gli id/durate (generation.error.notFound,
# generation.error.timeout, generationStatus.heading).
# ============================================================

