# --- index.html (home) ---
index.title=Home
index.intro=Generate images with the help of an assistant, find them again in the gallery. Navigation via server-rendered HTML (Spring MVC + Thymeleaf), local interactivity with Alpine.js, partial updates via htmx. No frontend build step.
index.link.deepChat.suffix=describe the image you want, the assistant can search the web and generate it on Replicate.
index.link.generate.suffix=direct form: model, prompt and parameters, no chatbot.
index.link.gallery.suffix=all generated images, with prompt and model used.

# --- generate.html (direct form) ---
generate.title=Generate image
generate.intro=Pick a registered model, write a prompt and adjust width, height, format and the other generation parameters in the dedicated fields.
generate.video.title=Generate video
generate.video.intro=Pick a video model, upload a starting image (optional), write a prompt and adjust duration, resolution and the other parameters.
generate.edit.title=Edit image
generate.edit.intro=Upload an image (or start from a generation), describe what to change and adjust the parameters: the editing model returns a new image.

