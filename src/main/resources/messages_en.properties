# --- index.html (home) ---
index.title=Home
index.intro=Generate images with the help of an assistant, find them again in the gallery. Navigation via server-rendered HTML (Spring MVC + Thymeleaf), local interactivity with Alpine.js, partial updates via htmx. No frontend build step.
index.link.deepChat.suffix=describe the image you want, the assistant can search the web and generate it on Replicate.
index.link.generate.suffix=direct form: model, prompt and parameters, no chatbot.
index.link.gallery.suffix=all generated images, with prompt and model used.

