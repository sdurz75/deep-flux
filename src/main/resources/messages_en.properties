# --- Java errors: Replicate (ReplicateClient) ---
replicate.error.invalidModelFormat=The model must be in the form "owner/name" (e.g. black-forest-labs/flux-schnell)
replicate.error.httpError=Replicate responded with an error ({0}): {1}
replicate.error.connectionFailed=Could not contact Replicate: {0}
replicate.error.tokenMissing=REPLICATE_API_TOKEN is not set: export the environment variable before starting the app.

# --- Java errors: SearXNG (SearxngClient) ---
searxng.error.httpError=SearXNG responded with an error ({0}): {1}
searxng.error.connectionFailed=Could not contact SearXNG: {0}
searxng.error.credentialsMissing=SEARXNG_USERNAME/SEARXNG_PASSWORD are not set: export the environment variables before starting the app.

# --- Java errors: generation (GenerationService) ---
generation.error.notFound=Generation not found: {0,number,#}
generation.error.invalidParameters=The parameters must be a valid JSON object: {0}
generation.error.contactFailed=Error contacting Replicate: {0}
generation.error.noOutput=Prediction completed but with no usable output.
generation.error.failedGeneric=Generation failed on Replicate.
generation.error.timeout=Timeout: no response from Replicate after {0,number,#} minutes.
generation.error.tooManyInProgress=Too many generations already in progress on Replicate ({0,number,#}): try again shortly.

# --- async push of a generation's completion (DeepChatGenerationWatcher) ---
deepchat.push.succeeded=Image generated successfully.
deepchat.push.failed=Generation failed: {0}

# --- Java errors: image storage (ImageStorageService) ---
imagestorage.error.createDir=Could not create the images directory {0}
imagestorage.error.saveImage=Could not save image {0}
imagestorage.error.deleteImage=Could not delete image {0}

# --- Java errors: gallery (GalleryController) ---
gallery.error.notFound=Generation not found

# --- Java errors: deep chat (DeepChatService/DeepChatApiController) ---
