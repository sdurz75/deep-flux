# --- deep-chat.html ---
deepChat.intro.prefix=Generate images with the assistant's help: describe what you want, the assistant can search the web to inform itself and generate the image on Replicate with the model and parameters chosen in the panel on the left (or a different model, if you ask for it explicitly in chat). Generated images also end up in
