server:
  port: 8080
  # Senza questo, dietro un reverse proxy (nginx, Traefik, ...) che
  # termina TLS e/o inoltra su un path diverso, l'app vede scheme/host
  # "interni" (es. http://127.0.0.1:8080) invece di quelli pubblici: i
  # redirect generati con "redirect:..." (vedi GenerationController,
  # GalleryController) verrebbero assolutizzati dal container Servlet
  # con l'host sbagliato, mandando il browser fuori strada. "framework"
  # attiva Spring's ForwardedHeaderFilter, che legge X-Forwarded-Proto/
  # Host/Port/Prefix e corregge scheme/host/contextPath visti
  # dall'applicazione (Thymeleaf incluso) di conseguenza. Presuppone che
  # il proxy sia l'unico punto d'ingresso e sovrascriva/rimuova questi
  # header se un client li invia direttamente: non esporre mai la porta
  # 8080 dell'app stessa a Internet.
  forward-headers-strategy: framework

spring:
  config:
    # Carica .env (nella working directory, tipicamente la root del
    # progetto) come fosse un file .properties: le righe KEY=VALUE
    # finiscono tra le proprieta' lette sotto (${REPLICATE_API_TOKEN},
    # ecc.), senza bisogno di "sourcizzarlo" a mano nella shell prima di
    # ogni avvio. "optional:" evita che l'app fallisca ad avviarsi se
    # .env non esiste (es. in CI, dove i token arrivano da vere
    # variabili d'ambiente). prompts.properties (nessun "optional:": e'
    # nel jar, deve sempre esistere) porta il testo dei system prompt,
    # vedi DeepChatService.
    import: optional:file:.env[.properties],classpath:prompts.properties
  application:
    name: deep-flux
  thymeleaf:
    # In produzione: true (o meglio, usare un profilo 'prod' dedicato)
    cache: false
  web:
    # Fallback quando Accept-Language manca o non e' parsabile:
    # altrimenti LocaleContextHolder.getLocale() userebbe
    # Locale.getDefault(), dipendente dall'ambiente di esecuzione. Il
    # resolver resta AcceptHeaderLocaleResolver (default Boot, non
    # sovrascritto): legge Accept-Language a ogni richiesta.
    locale: it
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:h2:file:./data/db/app;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # Lo schema e' governato da Flyway (vedi resources/db/migration/),
      # non da Hibernate: "validate" verifica solo che le entity JPA
      # corrispondano alle tabelle create dalle migrazioni, non le crea
      # ne' le altera. Ogni modifica al DB va fatta con una nuova
      # migrazione, mai lasciando che Hibernate la dedurrebbe da solo.
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  # i18n nativo Spring/Thymeleaf (vedi CLAUDE.md, sezione dedicata):
  # messages.properties (italiano, bundle di default/fallback) +
  # messages_en.properties. Nessun LocaleResolver/WebMvcConfigurer da
  # scrivere: AcceptHeaderLocaleResolver e' gia' il default di Spring
  # Boot MVC (vedi spring.web.locale sopra), legge Accept-Language a
  # ogni richiesta (incluse le richieste htmx e il polling di
  # /generations/{id}).
  messages:
    basename: messages
    encoding: UTF-8
    # Una locale non mappata (es. "de") ricade sul bundle di base
    # (italiano), non sul default della JVM che ospita il processo.
    fallback-to-system-locale: false
  # Token generato su https://openrouter.ai/settings/keys. OpenRouter espone
  # un'API OpenAI-compatibile (https://openrouter.ai/docs): basta puntare lo
  # starter Spring AI per OpenAI sul suo base-url, nessun client custom.
  # Da esportare come variabile d'ambiente, mai committato:
  #   export OPENROUTER_API_TOKEN=sk-or-...
  ai:
    openai:
      api-key: ${OPENROUTER_API_TOKEN:}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:deepseek/deepseek-v4.1-flash}

# Token generato su https://replicate.com/account/api-tokens.
# Da esportare come variabile d'ambiente, mai committato:
#   export REPLICATE_API_TOKEN=r8_...
replicate:
  api-token: ${REPLICATE_API_TOKEN:}
  api-base-url: https://api.replicate.com/v1
  # Collection curata da Replicate usata per precaricare, all'avvio, i
  # modelli proposti nella dropdown di /deep-chat (vedi ReplicateModelCatalog).
  model-collection: text-to-image
  # Modelli personali (account sdurz75) affiancati alla collection curata
  # nella stessa dropdown. Manutenuta a mano: l'API Replicate non offre
  # un modo per elencare i modelli di un owner (GET /v1/models ignora un
  # parametro "owner", vedi ReplicateModelCatalog) — aggiornare questa
  # lista quando si pubblica un nuovo modello personale. L'ORDINE conta:
  # il primo della lista e' il default preselezionato in /deep-chat
  # (vedi init() in deep-chat.html, personal[0] || catalog[0]).
  personal-models: ${REPLICATE_PERSONAL_MODELS:sdurz75/flux-lora-ff3,sdurz75/flux-lora-teresa,sdurz75/flux-lora-ff2,sdurz75/flux-lora-ff,sdurz75/lora-ff,sdurz75/sks-whole,sdurz75/sks-face-2}

# Istanza SearXNG usata dal tool di web search del modello su /deep-chat
# (vedi WebSearchTool/SearxngClient). Richiede che il formato JSON sia
# abilitato lato server (settings.yml: search.formats: [html, json]),
# altrimenti risponde 403. Credenziali Basic Auth da esportare come
# variabili d'ambiente, mai committate:
#   export SEARXNG_USERNAME=...
#   export SEARXNG_PASSWORD=...
searxng:
  base-url: ${SEARXNG_BASE_URL:https://sdurz.me/xng/}
  username: ${SEARXNG_USERNAME:}
  password: ${SEARXNG_PASSWORD:}

storage:
  # Directory locale dove vengono salvate le immagini scaricate da
  # Replicate, servite poi via /images/** (vedi StorageConfig).
  images-dir: ./data/images

logging:
  level:
    org.springframework.web: INFO
