# Override di config per `mvn test` (profilo "test", attivato per ogni esecuzione di Surefire da <systemPropertyVariables> in
# pom.xml, non da un'annotazione da ricordarsi su ogni classe di test - un nuovo test @SpringBootTest lo eredita gratis). Layer
# ADDITIVO su src/main/resources/application.yml (application-<profilo>.yml non lo sostituisce, ne sovrascrive solo le chiavi).
# Il datasource NON e' qui: lo imposta PostgresTestContainerInitializer (container pgvector usa-e-getta, registrato in
# META-INF/spring.factories), cosi' i test non toccano mai il database di sviluppo.
spring:
  ai:
    model:
      # Nessun EmbeddingModel nei test (il locale scaricherebbe ~120 MB): la ricerca semantica e' spenta (app.search.enabled).
      embedding: none
app:
  recovery:
    # Niente recupero all'avvio / sweep nei @SpringBootTest: chiamerebbe il ReplicateClient reale
    # sulle righe di prova inserite dai test.
    enabled: false
  search:
    enabled: false
  tokens:
    # Niente controllo di scadenza periodico/all'avvio nei @SpringBootTest: i test chiamano TokenExpiryScheduler direttamente.
    expiry-check-enabled: false
