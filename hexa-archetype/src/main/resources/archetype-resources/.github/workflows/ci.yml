name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # I test usano Testcontainers (PostgreSQL): Docker e' disponibile sui runner GitHub.
      - run: mvn -B verify
