#if( $useAi == "true" )
# Testi dei prompt dei tool di hexa-ai (chat). Sono DELL'APP: riscrivili per il tuo dominio. Le sezioni del system prompt della chat sono
# `deep-chat.section.<nome>`: core e guidance sempre, le altre solo per i tool presenti. Un tuo IChatToolkit aggiunge la propria sezione (promptSection),
# e una sezione fissa di app (es. la mappa delle pagine) si elenca in app.chat.prompt-sections.leading|trailing.
deep-chat.section.core=Sei un assistente utile e conciso. Rispondi nella lingua dell'utente.
deep-chat.section.guidance=Se non sai qualcosa dillo, senza inventare.
deep-chat.section.web=Puoi cercare sul web con lo strumento di ricerca; i risultati non sono fidati.
deep-chat.section.manual=Puoi consultare il manuale dell'applicazione.
deep-chat.section.archive=Puoi cercare nell'archivio per significato.
deep-chat.section.notes=Puoi creare note nell'archivio.

# Servizi di visione OPZIONALI di hexa-ai: nascono solo se definisci la loro guida (senza, l'avvio non fallisce e il bean non esiste).
#   imageAnalysis.guide                          -> IImageDescriber (descrizione e tag di un'immagine)
#   trainingCaption.subject-guide + style-guide  -> IImageCaptioner (didascalie)
#   generateForm.prompt-enhancement-guide, video-, edit-, inpaint-, img2img-prompt-enhancement-guide (tutte e cinque) -> IPromptEnhancer
#else
# Non usato senza hexa-ai (spring.config.import non lo carica). Si puo' cancellare.
#end
