#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
# Config dell'APP. Il resto, riusabile, e' nei file importati qui sotto (una chiave di un file importato vince su questa: si cambia da
# env/.env, da un profilo o da -D). Carica .env (working directory) come file .properties: HX_DB_*, HX_STORAGE_*, ...
spring:
  config:
#if( $useAi == "true" )
    import: optional:file:.env[.properties],classpath:core.yml,classpath:ai.yml,classpath:prompts.properties
#else
    import: optional:file:.env[.properties],classpath:core.yml
#end
  application:
    name: ${artifactId}

app:
  layout:
    # Navigazione: sidebar (menu laterale, selettore tema chiaro/scuro/auto in fondo) oppure top (barra in alto).
    nav: sidebar
#if( $useAi == "true" )

# Ricerca web del bot (WebSearchTool): l'URL della TUA istanza SearXNG (formato JSON abilitato); credenziali in .env. Senza, la ricerca web non funziona.
searxng:
  base-url: ${symbol_dollar}{SEARXNG_BASE_URL:}
#end

example:
  remote:
    # Servizio esterno di esempio (ExampleRemoteClient): l'URL base di un endpoint GET /status. Vuoto = il controllo risponde con un avviso di configurazione.
    base-url: ${symbol_dollar}{EXAMPLE_REMOTE_BASE_URL:}
