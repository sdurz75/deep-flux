<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campo "seed" condiviso da TUTTI i form-type (un solo posto per il markup: un form-type nuovo con seed lo include, non lo copia).
  Vuoto = casuale (il default: gli handler omettono il seed). Il bottone di reset (core/clear-field :: wrap) compare solo con un seed
  valorizzato; segue anche i .value scritti dallo script di persistenza (restore, "Usa seed", "Usa configurazione") grazie
  all'evento `generation-settings:restored`.
-->
<div th:fragment="field">
    <label for="param-seed" th:text="#{generationParams.label.seed}">Seed</label>
    <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#param-seed}, clearable=true, title=#{generationParams.button.resetSeed})}">
        <input type="number" id="param-seed" name="seed" class="[appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none" th:placeholder="#{generationParams.placeholder.seed}" placeholder="casuale" th:value="${seed}">
    </th:block>
</div>

</body>
</html>
