<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  L'host di /search per l'app (app.search.host-fragment): i punti di innesto che core/search.html e fragments/core/search.html chiamano per
  nome. Qui vive cio' che conosce le generazioni: il filtro media e "solo preferiti" della form, i badge, i link "Apri" e le miniature dei
  documenti di tipo generation/imported (la ricerca non conosce generation: legge i metadata).
-->

<!--/* Filtro per media nella griglia dei filtri. */-->
<div th:fragment="filterMedia">
                    <div>
                        <label for="search-media" class="mt-0 mb-1.5 font-medium" th:text="#{search.query.media}" th:title="#{search.query.mediaHelp}">Media</label>
                        <div class="relative" x-data="pinesSelect" x-bind="root">
                            <select id="search-media" name="media" class="sr-only" tabindex="-1" aria-hidden="true" th:title="#{search.query.mediaHelp}">
                                <option th:each="m : ${mediaOptions}" th:value="${m}" th:selected="${m == media}" th:text="#{'search.media.' + ${m}}">Tutti</option>
                            </select>
                            <div th:replace="~{fragments/core/select :: ui}"></div>
                        </div>
                    </div>
</div>

<!--/* Interruttore "solo preferiti". */-->
<th:block th:fragment="filterFavourites">
                <label for="search-favourites" class="m-0 flex cursor-pointer items-center gap-3 text-ink dark:text-ink-dark" th:title="#{search.query.mediaHelp}">
                    <input type="checkbox" id="search-favourites" name="favourites" value="true" class="peer sr-only" th:checked="${favourites}">
                    <span class="relative h-6 w-11 shrink-0 rounded-full bg-line dark:bg-line-dark transition-colors duration-150
                                 after:absolute after:left-0.5 after:top-0.5 after:h-5 after:w-5 after:rounded-full after:bg-canvas dark:after:bg-canvas-dark
                                 after:shadow after:transition-transform after:duration-150 after:content-['']
                                 peer-checked:bg-accent dark:peer-checked:bg-accent-dark peer-checked:after:translate-x-5
                                 peer-focus-visible:ring-2 peer-focus-visible:ring-accent dark:peer-focus-visible:ring-accent-dark"></span>
                    <span class="text-sm" th:text="#{search.query.favourites}">Solo preferiti</span>
                </label>
</th:block>

<!--/* Badge accanto al tipo: genere (foto/video) e modello. */-->
<th:block th:fragment="rowBadges(d)">
    <th:block th:if="${(d.type == 'generation' || d.type == 'imported') && d.metadata['kind'] != null}">
        <span th:replace="~{fragments/core/chip :: neutral(text=#{'search.kind.' + ${#strings.toLowerCase(d.metadata['kind'])}}, textClass=null)}">Foto</span>
    </th:block>
    <span th:if="${d.type == 'generation' && d.metadata['model'] != null}" class="text-ink-muted dark:text-ink-muted-dark" th:text="${d.metadata['model']}">modello</span>
</th:block>

<!--/* Link "Apri" dei tipi dell'app. */-->
<th:block th:fragment="rowLinks(d)">
    <a th:if="${d.type == 'generation'}" th:href="@{/generations/{id}(id=${d.refId})}" th:text="#{search.row.openGeneration}">Apri</a>
    <a th:if="${d.type == 'imported'}" th:href="@{/import/{id}(id=${d.refId})}" th:text="#{search.row.openImported}">Apri</a>
</th:block>

<!--/* Miniature dei file. */-->
<th:block th:fragment="rowMedia(d)">
    <!--/* Artefatti della generazione: miniature dai metadata (search non conosce generation). Un file appena cancellato si nasconde (onerror) fino alla riconciliazione. */-->
    <div th:if="${(d.type == 'generation' || d.type == 'imported') && d.metadata['files'] != null && !#lists.isEmpty(d.metadata['files'])}" class="mt-2 flex flex-wrap gap-2">
        <a th:each="f : ${d.metadata['files']}" th:href="${d.type == 'imported'} ? @{/import/{id}(id=${d.refId})} : @{/generations/{id}(id=${d.refId})}"
           class="relative block w-24 h-24 overflow-hidden rounded-md border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark">
            <!--/* Video: la src si assegna solo quando la miniatura entra nel viewport (x-intersect.once), cosi' una pagina di 20 risultati non apre decine di Range request insieme. */-->
            <video th:if="${d.metadata['kind'] == 'VIDEO'}" th:data-src="@{'/images/' + ${f}}" class="w-full h-full object-cover block"
                   x-data x-intersect.once="$el.src = $el.dataset.src"
                   muted playsinline preload="metadata" onerror="this.style.visibility='hidden'"></video>
            <img th:unless="${d.metadata['kind'] == 'VIDEO'}" th:src="@{'/images/' + ${f}}" th:alt="${#strings.abbreviate(d.visibleContent, 80)}"
                 loading="lazy" class="w-full h-full object-cover block" onerror="this.style.visibility='hidden'">
            <span th:if="${d.metadata['favouriteFiles'] != null && #lists.contains(d.metadata['favouriteFiles'], f)}"
                  class="absolute top-1 right-1 flex items-center justify-center w-6 h-6 rounded-full bg-black/50 text-favourite dark:text-favourite-dark pointer-events-none"
                  th:title="#{gallery.favourite.remove}">
                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                </svg>
            </span>
        </a>
    </div>
</th:block>
</body>
</html>
