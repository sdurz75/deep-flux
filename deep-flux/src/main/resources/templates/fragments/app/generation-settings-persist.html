<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Persistenza lato client della form dei parametri di generazione (modello + campi del form-type), condivisa da
  /deep-chat (templates/app/deep-chat.html) e /generations/new (fragments/app/generate-form.html): include UNA volta,
  DOPO il markup del <form>. Si attiva su ogni `form[data-persist-key]`; configurazione via attributi data-* (convenzione
  "binding via data-*", vedi CLAUDE.md "Convenzione: theming"):
    - data-persist-key        chiave localStorage (chat: deepChat.generationSettings, form: generate.image|video|edit);
    - data-persist-no-restore campi (separati da spazio) NON ripristinati all'avvio ma comunque scritti: sono quelli che il
                              server ha valorizzato da un link esplicito (il prompt di "Anima"), che vince sullo stato salvato e
                              sullo slot globale e diventa lo stato corrente, SOLO arrivandoci (non su reload/Back) e anche se il
                              restore deve cambiare modello (il fetch sostituisce i campi: i valori del link si ricatturano);
    - data-persist-fresh      il server ha riempito TUTTO il form da un link esplicito ("Usa configurazione", /generations/new?config=):
                              arrivandoci (non su reload/Back) non si ripristina nulla (ne' modello, ne' campi, ne' slot globale) ma
                              si scrive subito lo stato, cosi' un reload tiene la configurazione spinta;
    - data-persist-server-state  stato SALVATO SUL SERVER della conversazione (solo /deep-chat, JSON-oggetto): se presente e' la fonte del
                              restore AL POSTO di localStorage ("{}" = nessuna configurazione propria: il form resta sui default del
                              catalogo); assente = conversazione precedente alla persistenza lato server, che adotta localStorage e lo
                              salva SUBITO sul server. Vale `data-persist-ignore` (e `data-persist-no-restore`) come per localStorage;
    - data-persist-save-url   dove salvare lo snapshot (POST JSON, fetch keepalive, debounce 800 ms, flush su pagehide). I salvataggi partono
                              SOLO dopo il termine del restore (evento `generation-settings:restored`): lo stato intermedio (modello gia'
                              cambiato, campi non ancora applicati) non deve sovrascrivere quello della conversazione. Senza: niente salvataggi;
    - data-shared-accept      chiavi dello slot globale prompt/seed che il form prende (default: tutte; la pagina "edit" solo `seed`);
    - data-persist-ignore     campi (separati da spazio) MAI scritti in localStorage (es. `version`, un hash pinnato che
                              ripristinato di nascosto farebbe partire una prediction a pagamento col modello sbagliato).
  Ad ogni sync il <form> riceve l'evento `generation-settings:sync` con detail = TUTTI i campi (hidden inclusi, valori sempre
  stringa) quindi chi deve inoltrarli (la chat: window.setDeepChatSettings) si registra PRIMA di questo include, perche' il
  primo sync e' sincrono.

  SLOT GLOBALE prompt/seed (localStorage['generation.shared'], scritto da generation-shared-slot.html :: pusher, "Usa prompt"/
  "Usa seed" nel dettaglio di una generazione; LA CHIAVE E' DUPLICATA nei due script): applySharedSlot() lo applica a ogni
  form all'avvio (dopo lo stato salvato: un push esplicito vince), alla `storage` di un'altra tab e al ritorno da bfcache, e CONSUMA
  ogni chiave applicata. Una chiave resta nello slot se il form non la accetta (data-shared-accept), se il campo non c'e' (il prompt
  in Deep Chat, un modello senza seed) o se il server l'ha gia' valorizzata da un link esplicito (data-persist-no-restore).

  /generations/new: il contenuto della form e' stato lato client, una preferenza dell'ultima sessione di chi usa il browser (stesso
  principio del tema chiaro/scuro, fragments/core/layout.html, e dello stato degli accordion, fragments/core/accordion.html), per tipo di
  pagina. /deep-chat: ogni CONVERSAZIONE ha il suo form, salvato sul server (colonna chat_conversation.generation_settings_json) e
  ripristinato scegliendola; localStorage della chat resta scritto e fa da fonte solo per le
  conversazioni precedenti alla migrazione. Una conversazione nuova parte dai default del catalogo.

  Listener `input` DELEGATO su document, non sul form: quello di /generations/new viene ri-renderizzato (swap di
  #generation-panel dopo un create rifiutato) e perderebbe i listener propri. Funziona per la digitazione nei campi
  (input nativi), per il cambio modello (evento nativo "input" della select, ignorato qui: scatta PRIMA che htmx sostituisca i
  campi e salverebbe il nuovo modello coi campi del form-type precedente; si sincronizza dopo lo swap, quando
  hx-on:htmx:after-swap su #generation-params-fields ridispatcha "input") e per il bottone "Reimposta ai default"
  (button-gen :: resetToDefaults, stesso target). Il solo swap che non emette "input" e' l'AI enhance, che sostituisce
  #prompt-field in outerHTML: lo copre `htmx:load` ristretto a quell'elemento (NON ogni htmx:load: dopo un create rifiutato la
  form ri-renderizzata puo' avere campi svuotati dal server e verrebbero salvati cosi').

  Il RESTORE (all'avvio, se c'e' qualcosa di persistito) e' l'unica parte non banale: se il modello persistito e' diverso da
  quello di default gia' renderizzato dal server, i campi ATTUALMENTE nel DOM sono quelli del form-type del modello di
  DEFAULT, con nomi diversi: vanno prima rifetchati. fetch() diretto invece di un evento "change" sintetico sulla <select>
  (che pure ha hx-get/hx-trigger="change" dichiarativi, vedi fragments/app/generation-params.html): questo script gira PRIMA
  che lo script defer di htmx.org abbia processato la pagina (un defer gira sempre dopo ogni script classico incontrato
  durante il parsing), quindi un evento sintetico qui non troverebbe ancora nessun listener htmx. L'URL riusa l'hx-get gia'
  risolto (subpath-aware, vedi CLAUDE.md "Convenzione: attributi che portano un URL dell'app) della select. Il bottone di
  reset non ha questo problema (un click reale arriva a pagina caricata): resta htmx dichiarativo.

  applyStoredFields non dispatcha eventi "change" per campo (andrebbero in conflitto handler accoppiati come flux_model/
  num_inference_steps in generation-params-flux-lora-finetune.html, pensati per un'interazione reale): imposta solo i
  .value/.checked grezzi. Lo stato Alpine accoppiato (fluxModel, readonly dei passi) si inizializza DOPO, leggendo il valore
  gia' scritto nel DOM: per questo i fragment dei form-type non devono inizializzare Alpine da attributi del server ma dal DOM
  (verificato dal vivo: un x-model inizializzato dal server riscriveva "dev" sopra il "schnell" ripristinato).
-->
<th:block th:fragment="script">
    <script>
        (function () {
            var SELECTOR = 'form[data-persist-key]';

            function names(form, attribute) {
                return (form.getAttribute(attribute) || '').split(/\s+/).filter(Boolean);
            }

            // Il link esplicito vince solo ARRIVANDOCI (navigate): su reload/Back lo stato salvato contiene gia' i valori del
            // link piu' le modifiche dell'utente, e l'URL (che ha ancora ?prompt=..) le sovrascriverebbe.
            function noRestoreNames(form) {
                var entries = performance.getEntriesByType ? performance.getEntriesByType('navigation') : [];
                var type = entries.length ? entries[0].type : 'navigate';
                return type === 'reload' || type === 'back_forward' ? [] : names(form, 'data-persist-no-restore');
            }

            // Form riempito per intero dal server da un link esplicito: vince su tutto lo stato salvato, ma solo arrivandoci.
            function isFreshArrival(form) {
                if (!form.hasAttribute('data-persist-fresh')) {
                    return false;
                }
                var entries = performance.getEntriesByType ? performance.getEntriesByType('navigation') : [];
                var type = entries.length ? entries[0].type : 'navigate';
                return type !== 'reload' && type !== 'back_forward';
            }

            function readStored(key) {
                try {
                    var raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) {
                    return null;
                }
            }

            // Fonte dello stato da ripristinare: quello del server della conversazione se la pagina lo porta (anche "{}"), altrimenti
            // localStorage. Il server-state passa dagli stessi filtri di localStorage: `data-persist-ignore` non si applica MAI
            // (un `version` finito per errore nello stato salvato farebbe girare e fatturare il modello sbagliato).
            function readState(form) {
                var serverState = form.getAttribute('data-persist-server-state');
                if (serverState !== null) {
                    var parsed = null;
                    try {
                        parsed = JSON.parse(serverState);
                    } catch (e) {
                        parsed = null;
                    }
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                        names(form, 'data-persist-ignore').forEach(function (name) { delete parsed[name]; });
                        return { stored: parsed, source: 'server' };
                    }
                }
                return { stored: readStored(form.getAttribute('data-persist-key')), source: 'local' };
            }

            // Salvataggio sul server (solo con data-persist-save-url, dopo il restore): ultimo snapshot in attesa per form,
            // debounce, e lo snapshot gia' salvato (nessuna richiesta se non e' cambiato nulla).
            var ready = new WeakSet();
            var pending = new Map();
            var timers = new Map();
            var lastSaved = new WeakMap();

            // Stessa serializzazione a prescindere dall'ordine delle chiavi: due snapshot uguali non producono una richiesta.
            function canon(snapshot) {
                var sorted = {};
                Object.keys(snapshot).sort().forEach(function (key) { sorted[key] = snapshot[key]; });
                return JSON.stringify(sorted);
            }

            function save(form) {
                clearTimeout(timers.get(form));
                timers.delete(form);
                var body = pending.get(form);
                var url = form.getAttribute('data-persist-save-url');
                pending.delete(form);
                if (body === undefined || !url || body === lastSaved.get(form)) {
                    return;
                }
                lastSaved.set(form, body);
                fetch(url, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: body })
                    .then(function (response) {
                        if (!response.ok) { lastSaved.delete(form); }
                    })
                    .catch(function () {
                        // Best effort (rete assente, pagina in chiusura): il prossimo sync riprova.
                        lastSaved.delete(form);
                    });
            }

            function scheduleSave(form, persisted) {
                if (!ready.has(form) || !form.hasAttribute('data-persist-save-url')) {
                    return;
                }
                pending.set(form, canon(persisted));
                clearTimeout(timers.get(form));
                timers.set(form, setTimeout(function () { save(form); }, 800));
            }

            function flushAll() {
                document.querySelectorAll(SELECTOR).forEach(save);
            }

            // Il restore e' finito (qualunque percorso): da qui lo stato del form e' quello vero e si puo' salvare. Un form che ha
            // adottato localStorage (conversazione precedente alla migrazione) si salva SUBITO, non alla prima modifica: senza,
            // aprirla senza toccare nulla e modificare un'altra conversazione le farebbe riadottare lo stato dell'altra.
            function finishRestore(form, source, serverSnapshot) {
                ready.add(form);
                if (source === 'server' && serverSnapshot) {
                    lastSaved.set(form, canon(serverSnapshot));
                }
                form.dispatchEvent(new CustomEvent('generation-settings:restored', { bubbles: true, detail: { source: source } }));
                sync(form);
            }

            // La sorgente "Modifica"/"Anima" (hidden FUORI dai campi del form-type) deve accompagnare la richiesta dei campi, come fa la select
            // modello (hx-include): senza, il server ripresenterebbe l'upload obbligatorio pur avendo gia' la sorgente.
            function sourceQuery(form) {
                var query = '';
                ['sourceGenerationId', 'sourceImage'].forEach(function (name) {
                    var field = form.elements.namedItem(name);
                    if (field && field.value) {
                        query += '&' + name + '=' + encodeURIComponent(field.value);
                    }
                });
                return query;
            }

            function hasModelOption(select, value) {
                for (var i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === value) {
                        return true;
                    }
                }
                return false;
            }

            function applyStoredFields(form, stored) {
                var skip = noRestoreNames(form);
                Object.keys(stored).forEach(function (name) {
                    if (skip.indexOf(name) >= 0) {
                        return;
                    }
                    var field = form.elements.namedItem(name);
                    if (!field || field.type === 'hidden' || field.readOnly) {
                        return;
                    }
                    if (field.type === 'checkbox') {
                        field.checked = stored[name] === 'true' || stored[name] === true;
                    } else if (field.tagName === 'SELECT') {
                        // Un valore che non e' fra le opzioni (residuo di un altro form-type)
                        // lascerebbe la select senza selezione: si tiene il default.
                        if (Array.prototype.some.call(field.options, function (o) { return o.value === stored[name]; })) {
                            field.value = stored[name];
                            // La UI Pines sopra la select nativa si rilegge solo su evento (vedi fragments/core/select.html).
                            field.dispatchEvent(new Event('pines-select:sync'));
                        }
                    } else {
                        field.value = stored[name];
                    }
                });
            }

            var SHARED_KEY = 'generation.shared';

            function writeShared(slot) {
                try {
                    if (Object.keys(slot).length) {
                        localStorage.setItem(SHARED_KEY, JSON.stringify(slot));
                    } else {
                        localStorage.removeItem(SHARED_KEY);
                    }
                } catch (e) {
                    // localStorage non disponibile: lo slot resta com'e'.
                }
            }

            // Applica (e consuma) le chiavi dello slot globale che questo form accetta e puo' ricevere. Ritorna true se ha
            // cambiato qualche campo: il chiamante fa sync(form) (non qui: nel restore con fetch il sync arriva a fine catena).
            function applySharedSlot(form) {
                var slot = readStored(SHARED_KEY);
                if (!slot) {
                    return false;
                }
                var accept = names(form, 'data-shared-accept');
                var skip = noRestoreNames(form);
                var changed = false;
                Object.keys(slot).forEach(function (name) {
                    var field = form.elements.namedItem(name);
                    if ((accept.length && accept.indexOf(name) < 0) || skip.indexOf(name) >= 0
                            || !field || field.type === 'hidden' || field.readOnly || field.value === undefined) {
                        return;
                    }
                    field.value = slot[name];
                    delete slot[name];
                    changed = true;
                });
                if (changed) {
                    writeShared(slot);
                }
                return changed;
            }

            // Valori dei campi `data-persist-no-restore` GIA' nel DOM (messi dal server da un link esplicito): il restore con
            // fetch sostituisce i campi del form-type e li cancellerebbe, senza che lo stato salvato possa rimetterli perche'
            // proprio questi non si ripristinano.
            function captureKept(form) {
                var kept = {};
                noRestoreNames(form).forEach(function (name) {
                    var field = form.elements.namedItem(name);
                    if (field && field.value !== undefined) {
                        kept[name] = field.value;
                    }
                });
                return kept;
            }

            function applyKept(form, kept) {
                Object.keys(kept).forEach(function (name) {
                    var field = form.elements.namedItem(name);
                    if (field && field.type !== 'hidden' && !field.readOnly) {
                        field.value = kept[name];
                    }
                });
            }

            function sync(form) {
                var settings = {};
                new FormData(form).forEach(function (value, key) {
                    // Un <input type=file> (upload sorgente, nascosto nel pannello della chat) da' un File: non e' un
                    // parametro e, salvato, romperebbe il restore (field.value su un input file lancia).
                    if (typeof value === 'string') {
                        settings[key] = value;
                    }
                });
                form.dispatchEvent(new CustomEvent('generation-settings:sync', { detail: settings }));
                var ignore = names(form, 'data-persist-ignore');
                var persisted = {};
                Object.keys(settings).forEach(function (key) {
                    if (ignore.indexOf(key) < 0) {
                        persisted[key] = settings[key];
                    }
                });
                try {
                    localStorage.setItem(form.getAttribute('data-persist-key'), JSON.stringify(persisted));
                } catch (e) {
                    // localStorage non disponibile (privata/quota piena): la
                    // sessione corrente resta comunque funzionante, solo non persiste.
                }
                scheduleSave(form, persisted);
            }

            function restore(form) {
                if (isFreshArrival(form)) {
                    sync(form);
                    return;
                }
                var select = form.querySelector('#image-model-input');
                var fieldsContainer = form.querySelector('#generation-params-fields');
                var state = readState(form);
                var stored = state.stored;
                if (stored && select && fieldsContainer && stored.model && stored.model !== select.value
                        && hasModelOption(select, stored.model)) {
                    var kept = captureKept(form);
                    select.value = stored.model;
                    select.dispatchEvent(new Event('pines-select:sync'));
                    fetch(select.getAttribute('hx-get') + '?model=' + encodeURIComponent(stored.model) + sourceQuery(form))
                        .then(function (response) {
                            if (!response.ok) { throw new Error('HTTP ' + response.status); }
                            return response.text();
                        })
                        .then(function (html) {
                            fieldsContainer.innerHTML = html;
                            applyStoredFields(form, stored);
                            applyKept(form, kept);
                            applySharedSlot(form);
                            finishRestore(form, state.source, stored);
                        })
                        .catch(function () {
                            // Modello salvato non piu' disponibile / server non raggiungibile: si resta sui campi del
                            // modello di default (gia' renderizzati), senza scrivere un corpo d'errore nel pannello.
                            select.value = select.options[0] ? select.options[0].value : select.value;
                            select.dispatchEvent(new Event('pines-select:sync'));
                            finishRestore(form, state.source, null);
                        });
                } else {
                    if (stored) {
                        applyStoredFields(form, stored);
                    }
                    applySharedSlot(form);
                    finishRestore(form, state.source, stored);
                }
            }

            function applySharedToAll() {
                document.querySelectorAll(SELECTOR).forEach(function (form) {
                    if (applySharedSlot(form)) {
                        sync(form);
                    }
                });
            }

            // Un push da un'altra tab (dettaglio di una generazione) arriva a un form gia' aperto; il ritorno da bfcache non
            // rilancia lo script, quindi lo slot si rilegge anche li.
            window.addEventListener('storage', function (event) {
                if (event.key === SHARED_KEY) {
                    applySharedToAll();
                }
            });
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    applySharedToAll();
                }
            });

            // Cambiando conversazione/chiudendo la scheda subito dopo una modifica, il salvataggio in attesa parte comunque (keepalive).
            window.addEventListener('pagehide', flushAll);
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') {
                    flushAll();
                }
            });

            document.addEventListener('input', function (event) {
                var form = event.target.closest && event.target.closest(SELECTOR);
                if (form && !event.target.matches('#image-model-input')) {
                    sync(form);
                }
            });

            document.addEventListener('htmx:load', function (event) {
                var form = event.target.id === 'prompt-field' && event.target.closest(SELECTOR);
                if (form) {
                    sync(form);
                }
            });

            document.querySelectorAll(SELECTOR).forEach(restore);
        })();
    </script>
</th:block>

</body>
</html>
