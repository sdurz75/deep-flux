<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Elenco dei LoRA anagrafati (contenuto di #lora-list, loras.html): nome, sorgente, intensita' predefinita, trigger words e nota.
-->
<th:block th:fragment="list(loras)">
    <p th:if="${#lists.isEmpty(loras)}" class="mt-4" th:text="#{loras.empty}">Nessun LoRA salvato.</p>

    <ul th:unless="${#lists.isEmpty(loras)}" class="list-none p-0 mt-4 flex flex-col gap-3">
        <li th:each="l : ${loras}" th:id="'lora-' + ${l.id}"
            class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark px-4 py-3">
            <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-[0.9rem]">
                <strong th:text="${l.name}">nome</strong>
                <span th:replace="~{fragments/core/chip :: neutral(text=#{loras.scale(${l.scale})}, textClass='text-[0.8rem]')}">intensita' 1</span>
                <code class="break-all" th:text="${l.source}">owner/nome</code>
                <th:block th:if="${l.defaultSecretId}">
                    <span th:replace="~{fragments/core/chip :: neutral(text=#{loras.token(${l.defaultSecretName + ' ••••' + l.defaultSecretHint})}, textClass='text-[0.8rem]')}">token HuggingFace</span>
                </th:block>
            </div>
            <p th:if="${l.triggerWords}" class="mt-2 mb-0 text-[0.85rem]">
                <span class="text-ink-muted dark:text-ink-muted-dark" th:text="#{loras.triggerWords}">Trigger words</span>:
                <span th:text="${l.triggerWords}">parole</span>
            </p>
            <p th:if="${l.note}" class="mt-1 mb-0 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="${l.note}">nota</p>
            <div class="mt-3 flex flex-wrap gap-2">
                <button th:replace="~{fragments/core/button :: dialogOpen(text=#{loras.button.edit}, hxGet=@{/loras/{id}/edit(id=${l.id})},
                            hxTarget='#lora-form', hxSwap='outerHTML', neutral=true, extraClass='px-3 py-1 text-[0.85rem]')}">Modifica</button>
                <button th:replace="~{fragments/core/button :: danger(type='button', text=#{loras.button.delete}, hxPost=null, hxDelete=@{/loras/{id}(id=${l.id})},
                            hxConfirm=#{loras.confirm.delete}, hxSwap='innerHTML', hxTarget='#lora-list', extraClass='px-3 py-1 text-[0.85rem]')}">Elimina</button>
            </div>
        </li>
    </ul>
</th:block>

<!--
  Contenuto del dialog (loras.html), per CREAZIONE (loraId null) e MODIFICA: sempre ri-caricato all'apertura e, con un errore di
  validazione, rimpiazzato da se' stesso (HX-Retarget/HX-Reswap dal controller). La risposta riuscita e' l'elenco (#lora-list).
-->
<div th:fragment="loraForm(loraId, loraName, loraSource, loraScale, loraTriggerWords, loraNote, loraError, loraSecretId, loraSecrets)" id="lora-form">
    <div class="flex items-start justify-between gap-3">
        <h2 id="lora-dialog-title" class="m-0" th:text="${loraId == null} ? #{loras.form.newTitle} : #{loras.form.editTitle}">Nuovo LoRA</h2>
        <button th:replace="~{fragments/core/button :: dialogCloseIcon(title=#{loras.form.close})}">&times;</button>
    </div>
    <form th:hx-post="${loraId == null} ? @{/loras} : @{/loras/{id}(id=${loraId})}"
          hx-target="#lora-list" hx-swap="innerHTML" class="mt-3" autocomplete="off">
        <th:block th:if="${loraError}">
            <p th:replace="~{fragments/core/alert :: error(text=${loraError})}">Errore</p>
        </th:block>

        <label for="lora-name" th:text="#{loras.form.name}">Nome</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#lora-name}, clearable=true, title=null)}">
            <input type="text" id="lora-name" name="name" class="w-full" maxlength="60" required th:value="${loraName}">
        </th:block>

        <label for="lora-source" th:text="#{loras.form.source}">Sorgente</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#lora-source}, clearable=true, title=null)}">
            <input type="text" id="lora-source" name="source" class="w-full" maxlength="500" required th:value="${loraSource}">
        </th:block>
        <ul class="mt-1 mb-0 list-disc pl-5 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark">
            <li th:text="#{loras.form.sourceHelp.replicate}">Replicate</li>
            <li th:text="#{loras.form.sourceHelp.huggingface}">HuggingFace</li>
            <li th:text="#{loras.form.sourceHelp.civitai}">CivitAI</li>
            <li th:text="#{loras.form.sourceHelp.url}">URL</li>
        </ul>

        <label for="lora-scale" th:text="#{loras.form.scale}">Intensita' predefinita</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#lora-scale}, clearable=true, title=null)}">
            <input type="number" id="lora-scale" name="scale" class="w-full" min="-1" max="3" step="0.1" th:value="${loraScale}">
        </th:block>

        <label for="lora-trigger-words" th:text="#{loras.form.triggerWords}">Trigger words (opzionali)</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#lora-trigger-words}, clearable=true, title=null)}">
            <input type="text" id="lora-trigger-words" name="triggerWords" class="w-full" maxlength="500" th:value="${loraTriggerWords}">
        </th:block>

        <label for="lora-token" th:text="#{loras.form.token}">Token predefinito (opzionale)</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="lora-token" name="secretId" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="" th:text="#{generationParams.option.noToken}">— nessuno —</option>
                <option th:each="t : ${loraSecrets}" th:value="${t.id}"
                        th:disabled="${t.status.name() == 'EXPIRED'}"
                        th:selected="${#strings.toString(loraSecretId) == #strings.toString(t.id)}"
                        th:text="|#{${'secrets.type.' + t.type}}: ${t.name} ••••${t.hint}|">nome</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
        <p class="mt-1 mb-0 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark">
            <span th:text="#{loras.form.tokenHelp}">Preselezionato nella form di generazione.</span>
            <a th:href="@{/secrets}" th:text="#{generationParams.link.manageTokens}">Gestisci i token</a>
        </p>

        <label for="lora-note" th:text="#{loras.form.note}">Nota (opzionale)</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#lora-note}, clearable=true, title=null)}">
            <input type="text" id="lora-note" name="note" class="w-full" maxlength="500" th:value="${loraNote}">
        </th:block>

        <div class="mt-4 flex flex-wrap justify-end gap-2">
            <button th:replace="~{fragments/core/button :: dialogClose(text=#{loras.form.cancel}, extraClass=null)}">Annulla</button>
            <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{loras.form.save}, extraClass=null)}">Salva</button>
        </div>
    </form>
</div>

</body>
</html>
