<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Placeholder di una generazione in corso: riquadri dummy con spinner +
  bottone "Interrompi" (UNO, in una riga sotto i riquadri, centrato). Usato in DUE contesti, da un solo markup:
  - fragments/app/generation.html :: status (generate.html/generation-status.html,
    htmx: il bottone e' il fragment fragments/app/button-gen :: stop con i suoi hx-*;
    il blocco e' CENTRATO nella pagina dal wrapper #generation-status, `flex justify-center`:
    il placeholder e' un inline-flex e da solo resterebbe a sinistra);
  - /deep-chat (deep-chat.html): renderizzato una volta in un <template> con
    generationId='GENID' (non '__ID__': in Thymeleaf e' preprocessing e sparisce), clonato dal client dentro un messaggio "html" di
    <deep-chat>, il cui shadow DOM NON vede le classi Tailwind della pagina:
    per questo qui SOLO stili inline (grigi semi-trasparenti, validi in
    light/dark) e uno spinner SMIL (niente @keyframes). In chat il bottone e'
    gestito via JS (classe gen-cancel, data-cancel-url, vedi deep-chat.html),
    gli attributi hx-* sono semplicemente ignorati li'.
  count: file attesi (Generation#getRequestedOutputs): un riquadro ciascuno, UN solo bottone (in chat 1, il template non conosce il numero).
  cancelDisabled: l'interruzione e' gia' stata richiesta o e' fallita, il
  bottone resta ma non e' piu' cliccabile finche' la generazione non termina.
-->
<div th:fragment="placeholder(generationId, conversationId, generationsPage, cancelDisabled, count)"
     data-generation-placeholder th:attr="data-generation-id=${generationId}"
     style="display:inline-flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:100%">
    <!-- Un riquadro per file atteso, poi UN solo bottone "Interrompi" in una riga propria sotto, centrato sui riquadri. -->
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%">
        <th:block th:each="n : ${#numbers.sequence(1, count < 1 ? 1 : count)}">
            <div th:replace="~{fragments/app/generation-placeholder :: tile}"></div>
        </th:block>
    </div>
    <div style="align-self:stretch;display:flex;justify-content:center">
        <button th:replace="~{fragments/app/button-gen :: stop(text=#{generationPlaceholder.button.cancel}, disabledText=#{generationPlaceholder.button.canceling},
                    confirmText=#{generationPlaceholder.confirm.cancel}, failedText=#{generationPlaceholder.cancelFailed},
                    url=@{/generations/{id}/cancel(id=${generationId}, conversationId=${conversationId}, generationsPage=${generationsPage})},
                    disabled=${cancelDisabled})}">Interrompi</button>
    </div>
</div>

<!-- Un riquadro di attesa (icona + spinner). -->
<div th:fragment="tile"
     style="width:256px;max-width:100%;aspect-ratio:1/1;border-radius:8px;background:rgba(128,128,128,0.2);
            border:1px dashed rgba(128,128,128,0.5);display:flex;flex-direction:column;align-items:center;
            justify-content:center;gap:8px;color:rgba(128,128,128,0.9)">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M3.75 21h16.5A1.5 1.5 0 0 0 21.75 19.5v-15A1.5 1.5 0 0 0 20.25 3H3.75A1.5 1.5 0 0 0 2.25 4.5v15A1.5 1.5 0 0 0 3.75 21Zm10.5-11.25h.008v.008h-.008V9.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
    </svg>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:0.85rem">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.3" stroke-width="3"/>
            <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
            </path>
        </svg>
        <span th:text="#{generationPlaceholder.generating}">Generazione in corso&hellip;</span>
    </span>
</div>

</body>
</html>
