<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Select dei LoRA anagrafati (CRUD /loras, `loraPresets` nel Model) sopra uno slot LoRA (sorgente + intensita') dei form-type che prendono un
  LoRA (flux-dev-lora: due slot, flux-fill-dev: uno). Solo un aiuto di compilazione lato client: la select NON ha name (non viaggia col form ne'
  finisce in localStorage / nello stato salvato della conversazione), al server arrivano sempre testo e scala.
  Parametri nominati: selectId (id della select), sourceId / scaleId (id dei campi del suo slot; letti da data-*, vedi CLAUDE.md "Binding Alpine").
-->
<div th:fragment="field(selectId, sourceId, scaleId)" class="md:col-span-2" x-data="{ words: '' }"
     th:data-source-field="${sourceId}" th:data-scale-field="${scaleId}"
     x-init="const src = document.getElementById($el.dataset.sourceField);
             const sel = $el.querySelector('select');
             const match = src && Array.from(sel.options).find(o => o.value && o.dataset.source === src.value.trim());
             if (match) { sel.value = match.value; sel.dispatchEvent(new Event('pines-select:sync')); words = match.dataset.triggerWords || '' }"
     @change="const o = $event.target.selectedOptions[0]; if (o && o.value) { const f = document.getElementById($el.dataset.sourceField); f.value = o.dataset.source; f.dispatchEvent(new Event('input', { bubbles: true })); const s = document.getElementById($el.dataset.scaleField); s.value = o.dataset.scale; s.dispatchEvent(new Event('input', { bubbles: true })) }; if (o && o.dataset.secretId) { const t = document.getElementById(o.dataset.secretType === 'CIVITAI' ? 'param-civitai-token' : 'param-hf-token'); const opt = t && Array.from(t.options).find(x => x.value === o.dataset.secretId && !x.disabled); if (opt) { t.value = opt.value; t.dispatchEvent(new Event('pines-select:sync')); t.dispatchEvent(new Event('change', { bubbles: true })) } }; words = o ? (o.dataset.triggerWords || '') : ''">
    <!--/* Il restore dello stato salvato (generation-settings-persist.html) e "Usa configurazione" scrivono i campi PRIMA che Alpine inizializzi questo
         fragment: l'x-init deriva la selezione dal campo sorgente (primo preset con la stessa sorgente, altrimenti "testo libero"), come fluxModel in
         generation-params-flux-lora-finetune.html. Niente "change" sintetico: ricopierebbe la scala sopra il valore ripristinato. */-->
    <label th:for="${selectId}" th:text="#{generationParams.label.loraPreset}">LoRA predefinito</label>
    <div class="relative" x-data="pinesSelect" x-bind="root">
        <select th:id="${selectId}" class="sr-only" tabindex="-1" aria-hidden="true">
            <option value="" th:text="#{generationParams.option.freeText}">— testo libero —</option>
            <option th:each="p : ${loraPresets}" th:value="${p.id}" th:text="${p.name}"
                    th:data-source="${p.source}" th:data-scale="${p.scale}" th:data-trigger-words="${p.triggerWords}"
                    th:data-secret-id="${p.defaultSecretId}" th:data-secret-type="${p.defaultSecretType}">nome</option>
        </select>
        <div th:replace="~{fragments/core/select :: ui}"></div>
    </div>
    <p x-show="words" x-cloak class="mt-1 mb-0 flex flex-wrap items-center gap-2 text-[0.8rem]">
        <span class="text-ink-muted dark:text-ink-muted-dark" th:text="#{generationParams.label.triggerWords}">Trigger words</span>
        <code x-text="words"></code>
        <button th:replace="~{fragments/app/button-gen :: addToPrompt(text=#{generationParams.button.addTriggerWords})}">Aggiungi al prompt</button>
    </p>
</div>

</body>
</html>
