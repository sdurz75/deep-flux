<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Stato di una generazione. Finche' non e' terminale il div si
  ripolla da solo (hx-trigger="every 2s"), chiamando sempre lo stesso
  GET /generations/{id} che fa avanzare lo stato lato server -
  coerente col pattern "stessa URL, due risposte" usato altrove.

  A stato terminale questo E' anche il dettaglio della generazione
  (niente pagina separata, vedi CLAUDE.md): prompt/modello/seed/
  parametri, immagini cancellabili singolarmente (con cascade
  sull'ultima, vedi fragments/app/generation-images.html) e bottone elimina
  l'intera generazione. conversationId/generationsPage (entrambi
  nullable, valorizzati da GenerationController#status nel Model)
  decidono sia il link "indietro" nella pagina intera (vedi
  generation-status.html) sia la provenienza da propagare al bottone
  elimina/alle immagini, cosi' la cancellazione da qui torna al punto
  giusto (deep-chat/listato /generations/galleria globale) invece di
  assumere sempre quest'ultima.
-->
<th:block th:fragment="status">
    <div id="generation-status" class="flex justify-center"
         th:if="${generation.status.name() == 'PENDING' or generation.status.name() == 'PROCESSING'}"
         th:hx-get="@{'/generations/' + ${generation.id}(conversationId=${conversationId}, generationsPage=${generationsPage}, cancelDisabled=${cancelDisabled})}"
         hx-trigger="every 2s"
         hx-swap="outerHTML">
        <div th:replace="~{fragments/app/generation-placeholder :: placeholder(generationId=${generation.id}, conversationId=${conversationId},
                    generationsPage=${generationsPage}, cancelDisabled=${cancelDisabled}, count=${generation.requestedOutputs})}"></div>
    </div>

    <div id="generation-status" th:if="${generation.status.name() == 'SUCCEEDED'}">
        <div class="flex justify-end mb-2">
            <button th:replace="~{fragments/core/button :: danger(type='button', text=#{gallery.button.deleteGeneration}, hxPost=null,
                        hxDelete=@{'/generations/' + ${generation.id}(conversationId=${conversationId}, generationsPage=${generationsPage})},
                        hxConfirm=#{gallery.confirm.delete}, hxSwap='none', hxTarget=null,
                        extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina</button>
        </div>

        <div th:replace="~{fragments/app/generation-images :: grid(${generation}, ${conversationId}, ${generationsPage})}"></div>

        <dl>
            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.prompt})}">Prompt</dt>
            <!--/* Il prompt e' uno per generazione; il seed e' per file (generation-images.html). "Usa ..." spinge nello slot globale (generation-shared-slot.html), non apre nulla. */-->
            <dd class="ms-0 mt-1 flex flex-wrap items-start gap-2">
                <span th:text="${generation.prompt}">prompt</span>
                <!--/* Copia negli appunti (Pines): il prompt da incollare in un altro LLM; th:if su un th:block perche' non convive con th:replace. */-->
                <th:block th:if="${!#strings.isEmpty(generation.prompt)}">
                    <button th:replace="~{fragments/core/copy-to-clipboard :: copy(text=${generation.prompt}, label=#{clipboard.copy}, copiedLabel=#{clipboard.copied}, extraClass=null)}">Copia</button>
                </th:block>
                <button th:replace="~{fragments/app/button-gen :: pushShared(text=#{generationDetail.shared.usePrompt}, doneText=#{generationDetail.shared.done},
                            prompt=${generation.prompt}, seed=null, extraClass=null)}">Usa prompt</button>
                <!--/* Configurazione completa (modello, LoRA, parametri, prompt, seed): link, il server compila il form. Senza `file`: num_outputs resta com'era e il seed e' quello della prima immagine (la rigenerazione per file e' della chat). */-->
                <a th:replace="~{fragments/app/button-gen :: reuseConfig(
                        url=@{/generations/new(config=${generation.id})},
                        text=#{generationDetail.button.reuseConfig})}">Usa configurazione</a>
            </dd>

            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.tags})}">Tag</dt>
            <dd class="ms-0 mt-1"><th:block th:replace="~{fragments/app/tag-editor :: generationEditor(generation=${generation}, filename=null, suggestions=true)}"></th:block></dd>

            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.model})}">Modello</dt>
            <dd class="ms-0 mt-1" th:text="${generation.model}">modello</dd>

            <!--/* Costo stimato (ReplicatePricing, salvato al completamento): assente per righe vecchie/modelli senza regola. */-->
            <th:block th:if="${generation.costUsd != null}">
                <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.cost})}">Costo stimato</dt>
                <dd class="ms-0 mt-1" th:text="#{generationDetail.value.cost(${generation.costUsd})}">≈ 0.0600 USD</dd>
            </th:block>

            <th:block th:if="${generation.sourceGenerationId != null}">
                <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.source})}">Generazione sorgente</dt>
                <dd class="ms-0 mt-1">
                    <a th:href="@{'/generations/' + ${generation.sourceGenerationId}}"
                       th:text="#{generationDetail.value.generationNumber(${generation.sourceGenerationId})}">n. 1</a>
                </dd>
            </th:block>

            <th:block th:if="${generation.sourceUploadFilename != null}">
                <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.source})}">Sorgente</dt>
                <dd class="ms-0 mt-1">
                    <img th:src="@{'/images/' + ${generation.sourceUploadFilename}}" alt="" class="h-24 w-auto rounded-md">
                </dd>
            </th:block>

            <!--/* Maschera di inpainting: SOPRA l'immagine su cui e' stata dipinta (upload, altrimenti il file scelto dalla generazione sorgente), 50%
                 e trasparente fuori area (mask-overlay.html). Senza sapere quale sia la sorgente (righe precedenti) non c'e' nulla da sovrapporre. */-->
            <th:block th:if="${generation.maskUploadFilename != null and (generation.sourceUploadFilename != null or generation.sourceImageFilename != null)}">
                <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.mask})}">Maschera</dt>
                <dd class="ms-0 mt-1">
                    <div class="relative inline-block">
                        <img th:src="@{'/images/' + ${generation.sourceUploadFilename != null ? generation.sourceUploadFilename : generation.sourceImageFilename}}" alt=""
                             class="block h-24 w-auto rounded-md" onerror="this.parentElement.style.visibility='hidden'">
                        <span th:replace="~{fragments/app/mask-overlay :: layer(maskSrc=@{'/images/' + ${generation.maskUploadFilename}})}"></span>
                    </div>
                </dd>
            </th:block>

            <th:block th:if="${generation.version}">
                <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.version})}">Version</dt>
                <dd class="ms-0 mt-1" th:text="${generation.version}">version</dd>
            </th:block>

            <th:block th:if="${generation.parametersJson}">
                <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.parameters})}">Parametri</dt>
                <dd class="ms-0 mt-1"><pre th:text="${generation.parametersJson}"
                    class="bg-surface dark:bg-surface-dark border border-line dark:border-line-dark rounded-md p-3 overflow-x-auto font-mono text-[0.85rem]">{}</pre></dd>
            </th:block>

            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.completedAt})}">Generata il</dt>
            <dd class="ms-0 mt-1" th:text="${generation.completedAt}">timestamp</dd>
        </dl>
    </div>

    <div id="generation-status" th:if="${generation.status.name() == 'FAILED'}">
        <p th:replace="~{fragments/core/alert :: error(text=${generation.errorMessage})}">Errore</p>
        <div class="flex justify-end mt-2">
            <button th:replace="~{fragments/core/button :: danger(type='button', text=#{gallery.button.deleteGeneration}, hxPost=null,
                        hxDelete=@{'/generations/' + ${generation.id}(conversationId=${conversationId}, generationsPage=${generationsPage})},
                        hxConfirm=#{gallery.confirm.delete}, hxSwap='none', hxTarget=null,
                        extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina</button>
        </div>
    </div>
</th:block>

</body>
</html>
