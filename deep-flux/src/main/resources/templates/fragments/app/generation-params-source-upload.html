<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campo "immagine sorgente" condiviso dai form-type che prendono un'immagine
  (P_VIDEO: opzionale, FLUX_KONTEXT_DEV: obbligatoria) - un solo posto per il
  markup e il controllo di dimensione lato client. Va nel multipart della POST
  /generations (form con hx-encoding=multipart). Assente se la sorgente e' una
  generazione esistente ("Anima"/"Modifica": sourceGeneration nel Model).
  Parametri nominati (vedi CLAUDE.md, pattern controller/fragment).
-->
<div th:fragment="field(label, required)" th:unless="${sourceGeneration}" x-data="{ preview: null, mask: null }" @mask-changed.window="mask = $event.detail">
    <label for="param-source-upload" th:text="${label}">Immagine di partenza (opzionale)</label>
    <!--/* Controllo dimensione anche lato client (setCustomValidity blocca il submit del form htmx): il limite e il messaggio arrivano dal server via data-*, il controllo vero resta IImageStorageService#storeUpload. */-->
    <input type="file" id="param-source-upload" class="block w-full max-w-full min-w-0 text-sm" name="sourceUpload" accept="image/png,image/jpeg,image/webp"
           th:required="${required}"
           th:data-max-bytes="${maxUploadBytes}"
           th:data-too-large="#{imagestorage.error.uploadTooLarge(${maxUploadBytes / (1024 * 1024)})}"
           @change="const f = $el.files[0];
                    $el.setCustomValidity(f && f.size > Number($el.dataset.maxBytes) ? $el.dataset.tooLarge : '');
                    $el.reportValidity();
                    preview = f ? URL.createObjectURL(f) : null">
    <!--/* Alternativa all'upload: scegliere un'immagine gia' nell'archivio (generata o importata). kind = tipo di pagina, per tornarci con la sorgente. */-->
    <div th:replace="~{fragments/app/archive-picker :: picker(kind=${videoPage} ? null : 'image')}"></div>
    <!--/* La maschera dell'inpainting (mask-editor.html, evento `mask-changed`) si sovrappone a questa anteprima. */-->
    <div x-show="preview" x-cloak class="relative mt-2 inline-block">
        <img :src="preview" alt="" class="block h-32 w-auto rounded-md">
        <span th:replace="~{fragments/app/mask-overlay :: layerBound(show='preview && mask')}"></span>
    </div>
</div>

</body>
</html>
