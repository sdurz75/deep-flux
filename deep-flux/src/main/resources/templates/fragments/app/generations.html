<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  content(...) e' il collante specifico del listato /generations: compone
  list(...) sotto con la paginazione generica (fragments/core/pagination.html),
  passandole basePath="/generations" e hxTarget="#generations-content" -
  mirror di fragments/app/gallery.html :: content, stessa ragione per il
  wrapper hx-trigger="gallery-update from:body" QUI dentro (non sul div
  #generations-content in generations-list.html): deve ri-renderizzarsi a
  ogni swap per tenere currentPage sempre allineato a quanto appena
  servito da GenerationController#list, altrimenti un refresh SSE
  ricaricherebbe sempre la pagina del primo caricamento.
-->
<th:block th:fragment="content(generations, currentPage, totalPages, hasPrevious, hasNext, pageNumbers)">
    <div style="display:contents" th:hx-get="@{/generations(page=${currentPage})}"
         hx-trigger="gallery-update from:body" hx-target="#generations-content" hx-swap="innerHTML">
        <p th:if="${#lists.isEmpty(generations)}">
            <span th:text="#{generations.empty.prefix}">Nessuna generazione ancora.</span>
            <a th:href="@{/generations/new}" th:text="#{generations.empty.link}">Generane una</a>.
        </p>
        <!-- th:unless su un th:block separato, non th:if sullo stesso tag di th:replace: stesso principio di fragments/app/gallery.html (th:replace ha precedenza piu' alta, scatterebbe comunque). -->
        <th:block th:unless="${#lists.isEmpty(generations)}">
            <div th:replace="~{fragments/app/generations :: list(${generations}, ${currentPage})}"></div>
        </th:block>
        <div th:replace="~{fragments/core/pagination :: nav('/generations', '#generations-content', ${currentPage}, ${totalPages}, ${hasPrevious}, ${hasNext}, ${pageNumbers}, null, ${totalElements}, ${pageSize})}"></div>
    </div>
</th:block>

<!--
  Lista selezionabile: stesso principio del <form x-data="{selectedIds...}">
  di fragments/app/gallery.html :: grid (un elemento htmx dentro un <form>
  include di default tutti i valori del form piu' vicino - le checkbox di
  ogni riga, name="ids", bastano da sole per il bulk-delete, nessun
  hx-include esplicito), esteso con:
  - "seleziona tutte" (SOLO la pagina corrente: attraversare le pagine
    non serve, la cancellazione dell'INTERO archivio ha gia' il suo
    controllo dedicato, "Elimina tutto" in generations-list.html);
  - selezione di un range via shift-click, che non esiste altrove in
    questo codebase (verificato via grep): lastCheckedIndex traccia
    l'ultima checkbox di riga cliccata (mai quella "seleziona tutte",
    esclusa da rowCheckboxes() perche' priva di name="ids"), onCheckboxClick
    estende manualmente checked/selectedIds su tutto l'intervallo quando
    shiftKey e' premuto - un click semplice passa gia' da x-model, qui si
    aggiunge solo il comportamento IN PIU' del range.
-->
<th:block th:fragment="list(generations, currentPage)">
    <form x-data="{
            selectedIds: [],
            lastCheckedIndex: null,
            rowCheckboxes() {
                return Array.from(this.$refs.rows.querySelectorAll('input[type=checkbox][name=ids]'));
            },
            onCheckboxClick(event) {
                const boxes = this.rowCheckboxes();
                const index = boxes.indexOf(event.target);
                const checked = event.target.checked;
                if (event.shiftKey && this.lastCheckedIndex !== null) {
                    const from = Math.min(this.lastCheckedIndex, index);
                    const to = Math.max(this.lastCheckedIndex, index);
                    for (let i = from; i <= to; i++) {
                        const box = boxes[i];
                        box.checked = checked;
                        const val = box.value;
                        if (checked && !this.selectedIds.includes(val)) this.selectedIds.push(val);
                        if (!checked) this.selectedIds = this.selectedIds.filter(v => v !== val);
                    }
                }
                this.lastCheckedIndex = index;
            },
            allSelected() {
                const boxes = this.rowCheckboxes();
                return boxes.length > 0 && boxes.every(box => this.selectedIds.includes(box.value));
            },
            toggleSelectAll(event) {
                const boxes = this.rowCheckboxes();
                if (event.target.checked) {
                    boxes.forEach(box => { if (!this.selectedIds.includes(box.value)) this.selectedIds.push(box.value); });
                } else {
                    const pageIds = boxes.map(box => box.value);
                    this.selectedIds = this.selectedIds.filter(v => !pageIds.includes(v));
                }
                this.lastCheckedIndex = null;
            }
         }">

        <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
            <label class="flex items-center gap-2 text-[0.85rem] text-ink-muted dark:text-ink-muted-dark cursor-pointer">
                <input type="checkbox" :checked="allSelected()" @click="toggleSelectAll($event)"
                       class="w-4 h-4 rounded accent-accent dark:accent-accent-dark cursor-pointer">
                <span th:text="#{generations.selectAll.label}">Seleziona tutte</span>
            </label>
            <span class="text-[0.85rem] text-ink-muted dark:text-ink-muted-dark">
                <span x-text="selectedIds.length"></span> <span th:text="#{generations.selection.label}">selezionate</span>
            </span>
            <button th:replace="~{fragments/core/button :: dangerSelectable(text=#{generations.button.deleteSelected}, hxPost=@{/generations/delete-selected}, hxConfirm=#{generations.confirm.deleteSelected}, extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina selezionate</button>
        </div>

        <div class="flex flex-col gap-2" x-ref="rows">
            <th:block th:each="g : ${generations}">
                <div th:replace="~{fragments/app/generation-row :: row(${g}, ${currentPage})}"></div>
            </th:block>
        </div>
    </form>
</th:block>

</body>
</html>
