<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Campi del form-type FLUX_KONTEXT_DEV (vedi GenerationFormType/
  FluxKontextDevParameterHandler): schema reale di
  black-forest-labs/flux-kontext-dev. "input_image" e' obbligatorio: o e'
  l'immagine caricata qui (sourceUpload) o una generazione esistente
  (sourceGeneration nel Model, hidden in generate-form.html), aggiunto poi da
  GenerationService. "disable_safety_checker" forzato dal service.
-->
<th:block th:fragment="fields">

    <div th:replace="~{fragments/app/generation-params-source-upload :: field(label=#{generationParams.label.editSourceUpload}, required=true)}"></div>

    <div>
        <label for="param-aspect-ratio" th:text="#{generationParams.label.aspectRatio}">Aspect ratio</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-aspect-ratio" name="aspect_ratio" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="match_input_image" th:selected="${aspect_ratio == 'match_input_image'}" th:text="#{generationParams.option.matchInputImage}">Come l'immagine originale</option>
                <option value="1:1" th:selected="${aspect_ratio == '1:1'}">1:1</option>
                <option value="16:9" th:selected="${aspect_ratio == '16:9'}">16:9</option>
                <option value="9:16" th:selected="${aspect_ratio == '9:16'}">9:16</option>
                <option value="3:2" th:selected="${aspect_ratio == '3:2'}">3:2</option>
                <option value="2:3" th:selected="${aspect_ratio == '2:3'}">2:3</option>
                <option value="4:3" th:selected="${aspect_ratio == '4:3'}">4:3</option>
                <option value="3:4" th:selected="${aspect_ratio == '3:4'}">3:4</option>
                <option value="5:4" th:selected="${aspect_ratio == '5:4'}">5:4</option>
                <option value="4:5" th:selected="${aspect_ratio == '4:5'}">4:5</option>
                <option value="21:9" th:selected="${aspect_ratio == '21:9'}">21:9</option>
                <option value="9:21" th:selected="${aspect_ratio == '9:21'}">9:21</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div>
        <label for="param-steps" th:text="#{generationParams.label.steps}">Passi di inferenza</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-steps', name='num_inference_steps', value=${num_inference_steps}, defaultValue=${fieldDefaults['num_inference_steps']}, min='4', max='50', step=null, extraClass=null, spinner=false)}"></div>
    </div>

    <div>
        <label for="param-guidance" th:text="#{generationParams.label.guidance}">Guidance scale</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-guidance', name='guidance', value=${guidance}, defaultValue=${fieldDefaults['guidance']}, min='0', max='10', step='0.1', extraClass=null, spinner=true)}"></div>
    </div>

    <div>
        <label for="param-output-format" th:text="#{generationParams.label.format}">Formato</label>
        <div class="relative" x-data="pinesSelect" x-bind="root">
            <select id="param-output-format" name="output_format" class="sr-only" tabindex="-1" aria-hidden="true">
                <option value="webp" th:selected="${output_format == 'webp'}">webp</option>
                <option value="jpg" th:selected="${output_format == 'jpg'}">jpg</option>
                <option value="png" th:selected="${output_format == 'png'}">png</option>
            </select>
            <div th:replace="~{fragments/core/select :: ui}"></div>
        </div>
    </div>

    <div>
        <label for="param-output-quality" th:text="#{generationParams.label.quality}">Qualita'</label>
        <div th:replace="~{fragments/app/generation-params-number :: field(id='param-output-quality', name='output_quality', value=${output_quality}, defaultValue=${fieldDefaults['output_quality']}, min='0', max='100', step=null, extraClass=null, spinner=false)}"></div>
    </div>

    <div th:replace="~{fragments/app/generation-params-seed :: field}"></div>

    <div th:replace="~{fragments/core/switch :: toggle(id='param-go-fast', name='go_fast', text=#{generationParams.label.goFast},
                    checked=${go_fast == true or go_fast == 'true'}, model=null, title=null)}">Go fast</div>

</th:block>

</body>
</html>
