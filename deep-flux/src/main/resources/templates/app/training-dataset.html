<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="${dataset.name}">Dataset</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.create}, parentPath='/trainings', parentText=#{training.title}, current=${dataset.name})}"></nav>
</div>
<div layout:fragment="content">
    <!--/* Il componente Alpine `imageDropzone` si registra una volta (alpine:init) da questo script; il markup e' in :: field. */-->
    <div th:replace="~{fragments/core/image-dropzone :: script}"></div>
    <!--/* Come maskEditor: il componente `cropEditor` si registra una volta da :: script, il dialog sta FUORI da #training-images (che si rimpiazza a ogni modifica). */-->
    <th:block th:unless="${dataset.frozen}">
        <div th:replace="~{fragments/app/crop-editor :: script}"></div>
    </th:block>

    <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
        <h1 class="m-0" th:text="${dataset.name}">Dataset</h1>
        <div class="flex flex-wrap gap-2">
            <button th:replace="~{fragments/core/button :: neutral(type='button', text=#{training.dataset.row.duplicate},
                        hxGet=null, hxPost=@{/trainings/datasets/{id}/duplicate(id=${dataset.id})}, hxTarget=null, hxSwap='none',
                        extraClass='px-3 py-1.5 text-[0.85rem]')}">Clona</button>
            <th:block th:unless="${dataset.frozen}">
                <button th:replace="~{fragments/core/button :: danger(type='button', text=#{training.dataset.row.delete},
                            hxPost=@{/trainings/datasets/{id}/delete(id=${dataset.id})}, hxDelete=null, hxConfirm=#{training.dataset.confirmDelete},
                            hxSwap='none', hxTarget=null, extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina</button>
            </th:block>
        </div>
    </div>

    <p th:if="${dataset.frozen}" class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.dataset.frozen}">Snapshot di un training.</p>

    <h2 th:text="#{training.dataset.edit.title}">Configurazione</h2>
    <!-- Un form NATIVO (POST + redirect): la bozza si salva a ogni invio, niente stato solo nel browser. -->
    <form th:unless="${dataset.frozen}" th:action="@{/trainings/datasets/{id}(id=${dataset.id})}" method="post" autocomplete="off"
          class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark p-4 max-w-xl">
        <th:block th:if="${error}">
            <p th:replace="~{fragments/core/alert :: error(text=${error})}">Errore</p>
        </th:block>

        <label for="training-name" th:text="#{training.form.name}">Nome</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#training-name}, clearable=true, title=null)}">
            <input type="text" id="training-name" name="name" class="w-full" maxlength="80" required th:value="${formName}">
        </th:block>

        <label for="training-trigger-word" th:text="#{training.form.triggerWord}">Trigger word</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#training-trigger-word}, clearable=true, title=null)}">
            <input type="text" id="training-trigger-word" name="triggerWord" class="w-full" maxlength="40" required th:value="${formTriggerWord}">
        </th:block>
        <p class="mt-1 mb-0 text-[0.8rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{training.form.triggerWordHelp}">Una parola che non esiste.</p>

        <fieldset class="mt-3 border-0 p-0">
            <legend class="p-0" th:text="#{training.form.type}">Che cosa insegna</legend>
            <label class="flex items-center gap-2">
                <input type="radio" name="loraType" value="subject" class="accent-accent dark:accent-accent-dark" th:checked="${formType != 'style'}">
                <span th:text="#{training.type.subject.long}">Un soggetto</span>
            </label>
            <label class="flex items-center gap-2">
                <input type="radio" name="loraType" value="style" class="accent-accent dark:accent-accent-dark" th:checked="${formType == 'style'}">
                <span th:text="#{training.type.style.long}">Uno stile</span>
            </label>
        </fieldset>

        <label for="training-note" th:text="#{training.form.note}">Nota (opzionale)</label>
        <textarea id="training-note" name="note" rows="2" maxlength="500" class="w-full" th:text="${formNote}"></textarea>

        <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{training.form.save}, extraClass='mt-4')}">Salva</button>
    </form>

    <dl th:if="${dataset.frozen}" class="m-0 grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1">
        <dt class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.form.triggerWord}">Trigger word</dt>
        <dd class="m-0"><code th:text="${dataset.triggerWord}">TOK</code></dd>
        <dt class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.form.type}">Che cosa insegna</dt>
        <dd class="m-0" th:text="${dataset.loraType.name() == 'STYLE'} ? #{training.type.style} : #{training.type.subject}">Soggetto</dd>
        <dt th:if="${dataset.note}" class="text-ink-muted dark:text-ink-muted-dark" th:text="#{training.form.note}">Nota</dt>
        <dd th:if="${dataset.note}" class="m-0" th:text="${dataset.note}">nota</dd>
    </dl>

    <h2 class="mt-8" th:text="#{training.images.title}">Immagini</h2>
    <!-- Il contenuto e' il target di caricamento e rimozione (htmx): lo ri-rende lo stesso fragment che risponde alle due azioni. -->
    <div id="training-images">
        <th:block th:replace="~{fragments/app/training-dataset :: images(dataset=${dataset}, report=${report}, maxImages=${maxImages}, maxBytes=${maxBytes})}"></th:block>
    </div>
    <th:block th:unless="${dataset.frozen}">
        <div th:replace="~{fragments/app/crop-editor :: dialog(datasetId=${dataset.id}, maxSide=${maxImageSide})}"></div>

        <!--/* Lancio: le impostazioni si salvano con la bozza; i controlli (e il bottone "Avvia") si ricaricano da soli. Dopo la griglia: l'ordine del lavoro. */-->
        <h2 class="mt-8" th:text="#{training.launch.title}">Avvia il training</h2>
        <p class="text-ink-muted dark:text-ink-muted-dark max-w-xl" th:text="#{training.launch.intro}">A pagamento su Replicate.</p>
        <div th:replace="~{fragments/app/training-launch :: settings(dataset=${dataset}, hfTokens=${hfTokens}, minSteps=${minSteps}, maxSteps=${maxSteps})}"></div>
        <div th:replace="~{fragments/app/training-launch :: check(datasetId=${dataset.id}, check=${launchCheck})}"></div>
    </th:block>
    <p th:if="${dataset.frozen and snapshotTraining != null}" class="mt-6">
        <a th:href="@{/trainings/{id}(id=${snapshotTraining.id})}" th:text="#{training.snapshot.link(${snapshotTraining.id})}">Apri il training</a>
    </p>
</div>
</body>
</html>
