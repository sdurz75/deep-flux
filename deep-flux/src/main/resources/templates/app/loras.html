<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{loras.title}">LoRA</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.manage}, parentPath=null, parentText=null, current=#{loras.title})}"></nav>
</div>
<div layout:fragment="content">
    <!--
      Dialog Pines UI per creare E modificare un LoRA anagrafato (stessa meccanica di tokens.html): `dialogOpen` e' lo stato
      Alpine letto da button :: dialogOpen/dialogClose. Il contenuto (#lora-form) si ri-carica a ogni apertura; al salvataggio
      riuscito il server emette `lora-saved` (HX-Trigger) che chiude il dialog, con un errore il form si rimpiazza da se'
      (HX-Retarget) e il dialog resta aperto col messaggio.
    -->
    <div x-data="{ dialogOpen: false }" @keydown.escape.window="dialogOpen = false" @lora-saved.window="dialogOpen = false">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <h1 class="m-0" th:text="#{loras.title}">LoRA</h1>
            <button th:replace="~{fragments/core/button :: dialogOpen(text=#{loras.button.new}, hxGet=@{/loras/new},
                        hxTarget='#lora-form', hxSwap='outerHTML', neutral=false, extraClass='px-3 py-1.5 text-[0.85rem]')}">Nuovo LoRA</button>
        </div>

        <p class="text-ink-muted dark:text-ink-muted-dark" th:text="#{loras.intro}">LoRA anagrafati.</p>

        <th:block th:replace="~{fragments/core/modal :: dialog(titleId='lora-dialog-title', maxWidth='max-w-lg', body=~{::#lora-dialog-body})}">
            <div id="lora-dialog-body">
                <div th:replace="~{fragments/app/loras :: loraForm(loraId=${loraId}, loraName=${loraName}, loraSource=${loraSource}, loraScale=${loraScale}, loraTriggerWords=${loraTriggerWords}, loraNote=${loraNote}, loraError=${loraError}, loraTokenId=${loraTokenId}, loraTokens=${loraTokens})}"></div>
            </div>
        </th:block>

        <div id="lora-list">
            <div th:replace="~{fragments/app/loras :: list(loras=${loras})}"></div>
        </div>
    </div>
</div>
</body>
</html>
