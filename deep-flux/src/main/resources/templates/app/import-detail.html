<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{import.detail.heading(${generation.id})}">Immagine importata #1</title>
</head>
<body>
<!--
  Dettaglio di un'immagine IMPORTATA (ImportController#detail), pagina distinta da quella di una generazione: niente prompt, modello, costo,
  seed ne' "Usa configurazione" (non c'e' stata una prediction). Mostra l'immagine (stessa griglia/lightbox/star/overlay "Anima", "Modifica", "Usa come
  sorgente" di fragments/app/generation-images.html), lo stato e il risultato dell'analisi di contenuto (descrizione + tag, "Riprova") e la data.
-->
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.create}, parentPath='/import', parentText=#{import.title}, current=#{import.detail.heading(${generation.id})})}"></nav>
</div>
<div layout:fragment="content">
    <h1 th:text="#{import.detail.heading(${generation.id})}">Immagine importata #1</h1>

    <div id="generation-status">
        <div class="flex justify-end mb-2">
            <button th:replace="~{fragments/core/button :: danger(type='button', text=#{import.detail.delete}, hxPost=null,
                        hxDelete=@{'/generations/' + ${generation.id}},
                        hxConfirm=#{gallery.confirm.delete}, hxSwap='none', hxTarget=null,
                        extraClass='px-3 py-1.5 text-[0.85rem]')}">Elimina</button>
        </div>

        <div th:replace="~{fragments/app/generation-images :: grid(${generation}, null)}"></div>

        <dl>
            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.analysis})}">Analisi del contenuto</dt>
            <dd class="ms-0 mt-1">
                <div th:replace="~{fragments/app/import-analysis :: box(generation=${generation})}"></div>
                <th:block th:if="${generation.analysisStatus != null and generation.analysisStatus.name() == 'DONE'}">
                    <button th:replace="~{fragments/app/button-gen :: pushShared(text=#{import.detail.usePrompt}, doneText=#{generationDetail.shared.done},
                                prompt=${generation.prompt}, seed=null, extraClass='mt-1')}">Usa la descrizione come prompt</button>
                </th:block>
            </dd>

            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.tags})}">Tag</dt>
            <dd class="ms-0 mt-1"><th:block th:replace="~{fragments/app/tag-editor :: generationEditor(generation=${generation}, filename=null, suggestions=true)}"></th:block></dd>

            <dt th:replace="~{fragments/core/description-list :: term(text=#{generationDetail.label.importedAt})}">Importata il</dt>
            <dd class="ms-0 mt-1" th:text="${generation.completedAt}">timestamp</dd>
        </dl>
    </div>

    <!-- Lato scrittura dello slot globale prompt/seed ("Usa la descrizione come prompt"), vedi il fragment. -->
    <th:block th:replace="~{fragments/app/generation-shared-slot :: pusher}"></th:block>
</div>
</body>
</html>
