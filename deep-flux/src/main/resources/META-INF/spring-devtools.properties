# hexa-core e hexa-ai sono jar a parte: senza queste righe devtools li carica nel classloader di base e i repository Spring Data package-private
# non si vedono ("non-public interface is not defined by the given loader"); inoltre le classi di hexa-ai (es. OpenRouterCreditsClient) vedrebbero
# un `Messages` del classloader di base diverso da quello del bean ("required a bean of type Messages that could not be found").
# Solo sviluppo (spring-boot:run / IDE).
restart.include.hexa-core=/hexa-core-[\\w\\d.\\-]+\\.jar
restart.include.hexa-ai=/hexa-ai-[\\w\\d.\\-]+\\.jar
