# hexa-core, hexa-ai e hexa-pwa sono jar a parte: senza queste righe devtools li carica nel classloader di base e i repository Spring Data package-private
# non si vedono ("non-public interface is not defined by the given loader"); inoltre le classi di hexa-ai e hexa-pwa (es. OpenRouterCreditsClient,
# PwaService) vedrebbero un `Messages` del classloader di base diverso da quello del bean ("required a bean of type Messages that could not be found").
# Solo sviluppo (spring-boot:run / IDE).
restart.include.hexa-core=/hexa-core-[\\w\\d.\\-]+\\.jar
restart.include.hexa-ai=/hexa-ai-[\\w\\d.\\-]+\\.jar
restart.include.hexa-pwa=/hexa-pwa-[\\w\\d.\\-]+\\.jar
