<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/core/tabs :: list(extraClass='mb-4', body=~{::#t})}">
    <th:block id="t" th:each="n : ${#strings.arraySplit('a,b', ',')}">
        <a th:replace="~{fragments/core/tabs :: tab(text=${n}, href=${'/x?tab=' + n}, hxTarget=${target}, selected=${n == 'a'}, compact=false)}">x</a>
    </th:block>
</th:block>
</body>
</html>
