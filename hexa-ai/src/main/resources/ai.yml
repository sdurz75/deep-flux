# Config di hexa-ai (chat, ricerca semantica, crediti OpenRouter, AI): l'host la importa con spring.config.import (classpath:ai.yml), come core.yml.
# ATTENZIONE: un file importato vince sull'application.yml che lo importa (solo i file di profilo, application-<profilo>.yml, vincono su di lui):
# le chiavi definite qui NON si cambiano dall'application.yml dell'host, ma da env, da un profilo o da -D. Per questo qui stanno solo i default
# stabili (spring.ai.*, openrouter.*, enhancer.*) e le chiavi con un default nel codice restano fuori.
# I testi dei prompt NON sono qui: sono dell'host (prompts.properties). Le sezioni del system prompt dei tool di hexa-ai (deep-chat.section.web|notes|manual|archive,
# piu' core e guidance) servono alla chat; i servizi di visione sono OPZIONALI e nascono solo se l'host ne definisce la guida: imageAnalysis.guide (IImageDescriber),
# trainingCaption.subject-guide + style-guide (IImageCaptioner), generateForm.*-guide (cinque, IPromptEnhancer). Senza la guida il bean non esiste.
spring:
  ai:
    openai:
      # Token generato su https://openrouter.ai/settings/keys. OpenRouter espone un'API OpenAI-compatibile
      # (https://openrouter.ai/docs): basta puntare lo starter Spring AI per OpenAI sul suo base-url, nessun client custom.
      # Da esportare come variabile d'ambiente, mai committato:  export HX_OPENROUTER_API_TOKEN=sk-or-...
      api-key: ${HX_OPENROUTER_API_TOKEN:}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: ${HX_OPENROUTER_CHAT_MODEL:deepseek/deepseek-v4.1-flash}
    # Ricerca semantica (PgVectorStore): embedding LOCALI, nessuna chiamata di rete a runtime. Il modello ONNX
    # (multilingual-e5-small quantizzato, ~120 MB, italiano/inglese) e il tokenizer si scaricano UNA volta al primo avvio in
    # ./data/models. Cambiare l'URI del modello => ArchiveIndexService reindicizza tutto (l'URI e' l'id del modello).
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ./data/models
        onnx:
          model-uri: https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx
          model-output-name: last_hidden_state
        tokenizer:
          uri: https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/tokenizer.json

# Modelli di visione (descrizione immagini, didascalie, "AI enhance" con immagine): scelti per permissivita' oltre che per prezzo: niente modelli
# "moderated" di OpenRouter (OpenAI/Anthropic/Amazon) ne' Gemini, che rifiutano spesso il nudo non esplicito. Il fallback e' usato UNA volta se il primo rifiuta.
enhancer:
  vision-model: ${HX_OPENROUTER_VISION_MODEL:qwen/qwen3-vl-32b-instruct}
  vision-fallback-model: ${HX_OPENROUTER_VISION_FALLBACK_MODEL:mistralai/mistral-small-3.2-24b-instruct}

# Credito residuo OpenRouter (ai.credits): serve una MANAGEMENT key (https://openrouter.ai/settings/management-keys), diversa dal token della chat.
# Senza, il credito OpenRouter non compare. Da esportare come variabile d'ambiente, mai committato:  export HX_OPENROUTER_MANAGEMENT_KEY=sk-or-...
openrouter:
  base-url: https://openrouter.ai/api/v1
  management-key: ${HX_OPENROUTER_MANAGEMENT_KEY:}

# Istanza SearXNG usata dal tool di web search del modello (WebSearchTool/SearxngClient). Richiede il formato JSON abilitato lato server
# (settings.yml: search.formats: [html, json]), altrimenti risponde 403. Credenziali Basic Auth da variabili d'ambiente, mai committate.
# searxng.base-url NON e' qui: e' dell'host (facoltativo: senza, la ricerca web del bot risponde che non e' configurata). Idem i tetti della chat e dell'indice (app.chat.history-*, app.search.*):
# hanno un default nel codice (@Value) e si cambiano nell'application.yml dell'host.
searxng:
  username: ${HX_SEARXNG_USERNAME:}
  password: ${HX_SEARXNG_PASSWORD:}

---
# Profilo backup (export/import del jar): nessun modello di embedding (il locale scaricherebbe ~120 MB), ricerca spenta (default del codice: attiva).
spring:
  config:
    activate:
      on-profile: backup
  ai:
    model:
      embedding: none
app:
  search:
    enabled: false
