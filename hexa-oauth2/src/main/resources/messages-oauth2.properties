# Bundle di hexa-oauth2 (italiano, di default e di riserva). Chiavi DISGIUNTE da messages-core, messages-ai, messages-pwa e dall'app; identiche in messages-oauth2_en.properties.
oauth2.gate.title=Cancello di accesso
oauth2.gate.on=Il cancello e'' acceso: per usare l''app serve accedere con un provider, ed entrano solo gli utenti ammessi.
oauth2.gate.off=Il cancello e'' spento: l''app e'' aperta a chi la raggiunge. Prima di accenderlo configura un provider e gli utenti ammessi, poi fai un accesso di prova.
oauth2.gate.resetActive=HX_OAUTH2_RESET e'' impostata: il cancello e'' spento. Togli la variabile dopo l''uso.
oauth2.gate.requestedByEnv=Il cancello e'' acceso da HX_OAUTH2_ENABLED: per spegnerlo togli la variabile.
oauth2.gate.logout=Esci
oauth2.gate.check.provider.ok=Fatto: c''e'' almeno un provider.
oauth2.gate.check.provider.missing=Da fare: aggiungi un provider (o imposta le variabili HX_OAUTH2_*).
oauth2.gate.check.allowed.ok=Fatto: c''e'' almeno un utente ammesso.
oauth2.gate.check.allowed.missing=Da fare: aggiungi almeno un utente ammesso.
oauth2.gate.check.login.ok=Fatto: un accesso di prova e'' riuscito.
oauth2.gate.check.login.missing=Da fare: fai un accesso di prova con ''Prova accesso'' (con un utente ammesso).
oauth2.providers.title=Provider
oauth2.providers.empty=Nessun provider configurato.
oauth2.providers.fromEnv=da ambiente
oauth2.providers.test=Prova accesso
oauth2.providers.redirectUri=Indirizzo di ritorno da registrare presso il provider
oauth2.login.title=Accesso
oauth2.login.intro=Accedi per continuare.
oauth2.login.button=Accedi con {0}
oauth2.login.noProviders=Nessun provider configurato: apri l''app dal server e controlla le variabili HX_OAUTH2_* (o usa HX_OAUTH2_RESET per spegnere il cancello).
oauth2.login.error.denied=Questo account non e'' ammesso.
oauth2.login.error.failed=Accesso non riuscito. Riprova; se continua, controlla gli eventi di sistema.
oauth2.login.error.provider=Il provider non e'' raggiungibile o non e'' configurato bene. Controlla gli eventi di sistema.
oauth2.error.noProvider=Aggiungi prima almeno un provider.
oauth2.error.noAllowed=Aggiungi prima almeno un utente ammesso.
oauth2.error.noVerifiedLogin=Fai prima un accesso di prova con un utente ammesso (''Prova accesso'' nell''elenco dei provider).
oauth2.error.lastProvider=Il cancello e'' acceso: non puoi eliminare l''ultimo provider.
oauth2.error.lastAllowed=Il cancello e'' acceso: non puoi togliere l''ultimo utente ammesso.
oauth2.error.slugFormat=L''identificativo deve avere da 2 a 30 caratteri: lettere minuscole, cifre e trattino, iniziando da una lettera.
oauth2.error.slugTaken=L''identificativo ''{0}'' e'' gia'' in uso.
oauth2.error.issuerFormat=L''issuer deve essere un indirizzo https (http solo per localhost), senza parametri.
oauth2.error.secretRequired=Scegli il segreto del client fra i token OAuth2 (non scaduti).
oauth2.error.emailFormat=L''email non e'' valida.
oauth2.error.domainFormat=Il dominio non e'' valido (es. example.com).
oauth2.event.denied=Accesso negato a {0} ({1}).
oauth2.event.reset=Il cancello di accesso OAuth2 e'' stato spento all''avvio (HX_OAUTH2_RESET): togli la variabile dopo l''uso.
oauth2.event.envIncomplete=HX_OAUTH2_ENABLED e'' attiva ma manca un provider o un utente ammesso: nessuno puo'' entrare. Completa HX_OAUTH2_* oppure usa HX_OAUTH2_RESET=true.
oauth2.remote.error.httpError=Il provider OIDC ha risposto con un errore ({0}): {1}
oauth2.remote.error.connectionFailed=Impossibile contattare il provider OIDC: {0}
oauth2.remote.error.metadata=Il provider {0} non ha restituito la configurazione OIDC.
oauth2.remote.error.metadataKey=La configurazione OIDC di {1} non contiene ''{0}''.
oauth2.remote.error.issuerMismatch=L''issuer dichiarato dal provider ({1}) non coincide con quello configurato ({0}).
