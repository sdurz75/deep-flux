oauth2.settings.title=Accesso OAuth2
oauth2.field.enabled=Cancello di accesso acceso
oauth2.field.enabled.help=Acceso, entra solo chi accede con un provider ed e'' nella lista. Per accenderlo servono un provider, un utente ammesso e un accesso di prova riuscito (''Prova accesso'' qui sotto).
oauth2.field.providers=Provider aggiunti qui
oauth2.field.providers.help=Registra presso il provider l''indirizzo di ritorno mostrato sotto (dipende dall''indirizzo con cui apri l''app). Il segreto del client si salva cifrato e si vede in Segreti.
oauth2.column.slug=Identificativo (minuscole, cifre e trattino, 2-20 caratteri)
oauth2.column.title=Nome mostrato
oauth2.column.issuer=Issuer OIDC (https://...)
oauth2.column.clientId=Client ID
oauth2.column.clientSecret=Segreto del client
oauth2.field.allowedEmails=Email ammesse
oauth2.field.allowedEmails.help=Solo chi e'' in questa lista entra, anche se il provider lo autentica. Un''email vale solo se il provider la dichiara verificata. Si sommano a HX_OAUTH2_ALLOWED_EMAILS.
oauth2.field.allowedDomains=Domini ammessi
oauth2.field.allowedDomains.help=Un dominio vale solo se uguale a quello dell''email (es. example.com). Si sommano a HX_OAUTH2_ALLOWED_DOMAINS.
oauth2.error.enabledByEnv=Il cancello e'' acceso da HX_OAUTH2_ENABLED: per spegnerlo togli la variabile.
