# hexa-oauth2 bundle (English). Same keys as messages-oauth2.properties.
oauth2.menu.title=Sign-in
oauth2.title=Sign-in
oauth2.intro=Sign in with an OAuth2/OIDC provider (Google, Microsoft, Keycloak...) and a list of allowed users. The essentials can also be given with the HX_OAUTH2_* variables: the rest is managed here.
oauth2.saved=Saved.
oauth2.button.delete=Delete

oauth2.gate.title=Sign-in gate
oauth2.gate.on=The gate is on: using the app requires signing in with a provider, and only allowed users get in.
oauth2.gate.off=The gate is off: the app is open to anyone who can reach it. Before turning it on, configure a provider and the allowed users, then do a test sign-in.
oauth2.gate.resetActive=HX_OAUTH2_RESET is set: the gate is off. Remove the variable after use.
oauth2.gate.requestedByEnv=The gate is turned on by HX_OAUTH2_ENABLED: remove the variable to turn it off.
oauth2.gate.enable=Turn the gate on
oauth2.gate.disable=Turn the gate off
oauth2.gate.logout=Sign out
oauth2.gate.cannotEnable=Complete the steps above to be able to turn the gate on.
oauth2.gate.check.provider.ok=Done: there is at least one provider.
oauth2.gate.check.provider.missing=To do: add a provider (or set the HX_OAUTH2_* variables).
oauth2.gate.check.allowed.ok=Done: there is at least one allowed user.
oauth2.gate.check.allowed.missing=To do: add at least one allowed user.
oauth2.gate.check.login.ok=Done: a test sign-in succeeded.
oauth2.gate.check.login.missing=To do: do a test sign-in with ''Test sign-in'' (with an allowed user).

oauth2.providers.title=Providers
oauth2.providers.empty=No provider configured.
oauth2.providers.fromEnv=from environment
oauth2.providers.test=Test sign-in
oauth2.providers.redirectUri=Redirect URI to register with the provider
oauth2.providers.confirmDelete=Delete this provider?
oauth2.providers.add=Add a provider
oauth2.providers.addHelp=Register the redirect URI shown in the list with the provider (it depends on the address you open the app from) and copy the client ID and issuer here.

oauth2.form.slug=Identifier (lowercase letters, digits and hyphen)
oauth2.form.title=Display name
oauth2.form.issuer=OIDC issuer (https://...)
oauth2.form.clientId=Client ID
oauth2.form.secret=Client secret
oauth2.form.secretHelp=The secret is not typed here: save it in Tokens with the OAuth2 service and pick it from this list.
oauth2.form.secretLink=Open Tokens
oauth2.form.save=Save the provider

oauth2.allowed.title=Allowed users
oauth2.allowed.intro=Only people on this list get in, even if the provider authenticates them. An email counts only if the provider reports it as verified; a domain counts only if it equals the email''s domain.
oauth2.allowed.empty=No allowed users.
oauth2.allowed.kind=Type
oauth2.allowed.kind.email=Email
oauth2.allowed.kind.domain=Domain
oauth2.allowed.bound=bound to identity
oauth2.allowed.lastLogin=last sign-in {0}
oauth2.allowed.confirmDelete=Remove this user from the list?
oauth2.allowed.add=Add to the list
oauth2.allowed.value=Email or domain (e.g. name@example.com, example.com)
oauth2.allowed.addButton=Add

oauth2.login.title=Sign-in
oauth2.login.intro=Sign in to continue.
oauth2.login.button=Sign in with {0}
oauth2.login.noProviders=No provider configured: check the HX_OAUTH2_* variables on the server (or use HX_OAUTH2_RESET to turn the gate off).
oauth2.login.error.denied=This account is not allowed.
oauth2.login.error.failed=Sign-in failed. Try again; if it persists, check the system events.
oauth2.login.error.provider=The provider is unreachable or badly configured. Check the system events.

oauth2.error.noProvider=Add at least one provider first.
oauth2.error.noAllowed=Add at least one allowed user first.
oauth2.error.noVerifiedLogin=Do a test sign-in with an allowed user first (''Test sign-in'' in the provider list).
oauth2.error.lastProvider=The gate is on: you cannot delete the last provider.
oauth2.error.lastAllowed=The gate is on: you cannot remove the last allowed user.
oauth2.error.slugFormat=The identifier must be 2 to 30 characters: lowercase letters, digits and hyphen, starting with a letter.
oauth2.error.slugTaken=The identifier ''{0}'' is already in use.
oauth2.error.titleRequired=The name is required (at most {0} characters).
oauth2.error.issuerFormat=The issuer must be an https address (http only for localhost), without parameters.
oauth2.error.clientIdRequired=The client ID is required.
oauth2.error.secretRequired=Pick the client secret from the (unexpired) OAuth2 tokens.
oauth2.error.kindRequired=Choose whether to add an email or a domain.
oauth2.error.emailFormat=The email is not valid.
oauth2.error.domainFormat=The domain is not valid (e.g. example.com).
oauth2.error.entryDuplicate=''{0}'' is already on the list.
oauth2.error.notFound=No such entry.

oauth2.event.denied=Sign-in denied for {0} ({1}).
oauth2.event.reset=The OAuth2 sign-in gate was turned off at startup (HX_OAUTH2_RESET): remove the variable after use.
oauth2.event.envIncomplete=HX_OAUTH2_ENABLED is set but a provider or an allowed user is missing: nobody can get in. Complete HX_OAUTH2_* or use HX_OAUTH2_RESET=true.

oauth2.remote.error.httpError=The OIDC provider answered with an error ({0}): {1}
oauth2.remote.error.connectionFailed=Cannot reach the OIDC provider: {0}
oauth2.remote.error.metadata=Provider {0} returned no OIDC configuration.
oauth2.remote.error.metadataKey=The OIDC configuration of {1} has no ''{0}''.
oauth2.remote.error.issuerMismatch=The issuer declared by the provider ({1}) does not match the configured one ({0}).

events.source.OAUTH2=OAuth2 sign-in
tokens.provider.OAUTH2=OAuth2 client secret
