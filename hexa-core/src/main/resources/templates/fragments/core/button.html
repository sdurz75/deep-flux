<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Bottoni riusabili: le classi Tailwind di ogni variante vivono qui,
  una sola volta, non ripetute in ogni template che ne ha bisogno
  (form, galleria, deep-chat, header). Ogni fragment prende parametri
  per contenuto/comportamento (testo, type, attributi htmx opzionali,
  extraClass per aggiustamenti di layout del chiamante), mai per le
  classi di base: quelle sono fisse, un solo punto di verita' per come
  deve apparire un bottone di un certo tipo. Chiamare sempre con
  parametri nominati (frag(nome=valore)), non posizionali: permette di
  omettere quelli opzionali, Thymeleaf li valorizza a null da solo
  (vedi CLAUDE.md, "Pattern controller: quando restituire fragment vs
  pagina intera" per la stessa nota su nominati vs posizionali).
-->

<!--
  Bottone primario (accent): nessuna classe di colore/bordo/padding
  qui, arrivano gia' dalla regola generica "button" nel layer base di
  fragments/core/layout.html (ogni <button> nudo e' primario di default).
  extraClass e' solo per aggiustamenti di LAYOUT del chiamante (es.
  margine sopra in un form), mai per cambiare la variante.
-->
<button th:fragment="primary(type, text, extraClass)"
        th:type="${type} ?: 'button'"
        th:classappend="${extraClass}"
        th:text="${text}">Bottone</button>

<!--
  Bottone neutro (azioni secondarie: modifica, annulla, ri-embedda): bordo e superficie invece dell'accent, il resto (padding,
  radius, cursor) resta ereditato dal layer base. hxGet/hxPost/hxTarget/hxSwap opzionali (null se non usati), passati a
  parametri nominati come per gli altri; `type` default 'button'.
-->
<button th:fragment="neutral(type, text, hxGet, hxPost, hxTarget, hxSwap, extraClass)"
        th:type="${type} ?: 'button'"
        class="bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark"
        th:classappend="${extraClass}"
        th:hx-get="${hxGet}"
        th:hx-post="${hxPost}"
        th:hx-target="${hxTarget}"
        th:hx-swap="${hxSwap}"
        th:text="${text}">Bottone</button>

<!--
  Bottone pericoloso (azioni distruttive: elimina, cancella
  conversazione): sovrascrive solo bg/testo rispetto al default
  "button" del layer base (bordo/radius/padding/cursor/hover restano
  ereditati, stessa relazione di theme.css tra "button" e
  ".button-danger" di prima). hxPost/hxDelete/hxConfirm/hxSwap/hxTarget
  vanno sempre passati esplicitamente da ogni chiamante, anche `null`
  per quelli che l'azione non usa (es. solo uno tra hxPost/hxDelete e'
  valorizzato, l'altro null, a seconda del verbo dell'azione) - stesso
  principio gia' vero per hxTarget quando l'htmx non ha bisogno di un
  target diverso dal bottone stesso.
-->
<button th:fragment="danger(type, text, hxPost, hxDelete, hxConfirm, hxSwap, hxTarget, extraClass)"
        th:type="${type} ?: 'button'"
        class="bg-danger dark:bg-danger-dark text-accent-contrast dark:text-accent-contrast-dark"
        th:classappend="${extraClass}"
        th:hx-post="${hxPost}"
        th:hx-delete="${hxDelete}"
        th:hx-confirm="${hxConfirm}"
        th:hx-swap="${hxSwap}"
        th:hx-target="${hxTarget}"
        th:text="${text}">Bottone</button>

<!--
  Variante di "danger" per la cancellazione in blocco dalla griglia
  (fragments/app/gallery.html :: grid, checkbox multiple): disabilitato
  finche' non c'e' selezione. A differenza degli altri parametri del
  bottone (testo/attributi htmx), `selectedIds` NON e' passato da
  Thymeleaf: e' un binding Alpine puro (`:disabled`, non processabile
  da th:attr per attributi con `:`, vedi CLAUDE.md "Convenzione:
  theming") che assume SEMPRE lo stesso nome di variabile su un
  antenato x-data (oggi definito in grid(...) sopra) - stesso principio
  gia' in uso per `theme` in themeToggle sotto, qui pero' senza nemmeno
  bisogno di un ponte data-*: non e' un valore per-istanza, e'
  letteralmente la stessa espressione ovunque questo bottone compare.
  hx-swap="none" fisso (non parametrizzato come in "danger"): per
  questo bottone e' sempre vero, il refresh arriva dall'evento SSE
  "gallery-update" (vedi GalleryPushNotifier/GenerationService
  #deleteAll), mai da uno swap diretto della risposta.
-->
<button th:fragment="dangerSelectable(text, hxPost, hxConfirm, extraClass)"
        type="button"
        disabled
        class="bg-danger dark:bg-danger-dark text-accent-contrast dark:text-accent-contrast-dark
               disabled:opacity-40 disabled:cursor-not-allowed"
        th:classappend="${extraClass}"
        :disabled="selectedIds.length === 0"
        th:hx-post="${hxPost}"
        th:hx-confirm="${hxConfirm}"
        hx-swap="none"
        th:text="${text}">Elimina selezionate</button>

<!--
  Dialog modale (Pines UI): dialogOpen/dialogClose assumono la variabile Alpine `dialogOpen` su un antenato x-data (stesso
  accoppiamento esplicito di dangerSelectable con selectedIds o toastClose con dismiss): la pagina che ospita il dialog la
  dichiara (vedi search.html); lo scheletro del dialog e' in fragments/core/modal :: dialog. dialogClose e' la variante neutra ("Annulla"); dialogCloseIcon la "x" nell'intestazione.
-->
<!--
  dialogOpen(text, hxGet, hxTarget, hxSwap, neutral, extraClass): apre il dialog e, se hxGet e' valorizzato, carica PRIMA il suo
  contenuto (un form fresco per "Nuova nota", quello precompilato per "Modifica"): niente stato residuo di un uso precedente.
  neutral=true per la variante neutra (azioni per riga), false per il primario.
-->
<button th:fragment="dialogOpen(text, hxGet, hxTarget, hxSwap, neutral, extraClass)" type="button" @click="dialogOpen = true"
        th:hx-get="${hxGet}" th:hx-target="${hxTarget}" th:hx-swap="${hxSwap}"
        th:classappend="${(neutral ? 'bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark' : '') + ' ' + (extraClass ?: '')}"
        th:text="${text}">Apri</button>

<button th:fragment="dialogClose(text, extraClass)" type="button" @click="dialogOpen = false"
        class="bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark border border-line dark:border-line-dark"
        th:classappend="${extraClass}" th:text="${text}">Annulla</button>

<!--
  dialogConfirm(text, extraClass): "Conferma" del dialog di conferma (fragments/core/confirm-dialog.html). Assume il componente Alpine
  `confirmDialog` (answer) sull'antenato; e' il primario di default del tema.
-->
<button th:fragment="dialogConfirm(text, extraClass)" type="button" @click="answer(true)"
        th:classappend="${extraClass}" th:text="${text}">Conferma</button>

<button th:fragment="dialogCloseIcon(title)" type="button" @click="dialogOpen = false"
        th:title="${title}" th:aria-label="${title}"
        class="shrink-0 w-8 h-8 p-0 rounded-full bg-transparent border-0 text-ink-muted dark:text-ink-muted-dark hover:bg-canvas dark:hover:bg-canvas-dark text-xl leading-none">&times;</button>

<!--
  Bottone del theme-switch nell'header (☀️/🌙/Auto): value e' il
  valore assegnato alla variabile Alpine "theme" dichiarata su <body>
  in layout.html (light/dark/auto), content il testo/icona visibile,
  title l'attributo title (gia' risolto con #{...} dal chiamante, vedi
  fragments/core/header.html). @click/:class restano Alpine puro, MAI
  processati da Thymeleaf (th:attr non accetta nomi con "@"/":" nella
  sua sintassi di assegnazione, verificato): "value" arriva invece via
  th:data-theme-value, letto a runtime con $el.dataset.themeValue -
  stesso ponte data-*/$el.dataset documentato in CLAUDE.md,
  "Convenzione: theming".
-->
<!--
  navToggle(open, content, title): md:hidden (i due usi stanno solo sotto md). apre (open=true) o chiude (open=false) lo
  slideover di navigazione (fragments/core/slideover :: drawer, usato da header.html e sidebar.html; stato Alpine navOpen su un antenato). Valore per-istanza via data-* letto con $el.dataset, stesso ponte
  di themeToggle qui sotto.
-->
<button th:fragment="navToggle(open, content, title)"
        type="button"
        th:data-nav-open="${open}"
        class="border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark
               rounded-md px-3 py-1 cursor-pointer text-lg leading-none md:hidden"
        @click="navOpen = $el.dataset.navOpen === 'true'"
        th:title="${title}" th:aria-label="${title}"
        th:text="${content}">☰</button>

<!--
  popoverToggle(content, contentId, title, icon): bottone che apre/chiude un popover (fragments/core/popover.html :: panel). Assume il componente Alpine
  `pinesPopover` (open, toggle) e dichiara il proprio x-ref `button`, da cui il componente calcola la posizione del pannello.
  `content` = testo del bottone, oppure null per il solo ICONA (cursori di Pines UI); `contentId` = id (o null) dello <span> del testo, per
  aggiornarlo da una risposta htmx con `<span id=... hx-swap-oob="innerHTML">`; `title` = tooltip e aria-label, sempre.
  `icon` = icona del solo-icona (solo se `content` e' null): `gallery` = immagine, altrimenti (null) i cursori.
-->
<button th:fragment="popoverToggle(content, contentId, title, icon)" type="button" x-ref="button" @click="toggle()"
        :aria-expanded="open" aria-haspopup="dialog"
        th:title="${title}" th:aria-label="${title}"
        class="inline-flex items-center justify-center border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark
               rounded-md px-3 py-1.5 cursor-pointer text-[0.85rem] leading-none whitespace-nowrap">
    <span th:if="${content != null}" th:id="${contentId}" th:text="${content}" class="max-w-[16rem] truncate">Popover</span>
    <svg th:if="${content == null and icon != 'gallery'}" class="h-4 w-4" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M5.5 3C4.67157 3 4 3.67157 4 4.5C4 5.32843 4.67157 6 5.5 6C6.32843 6 7 5.32843 7 4.5C7 3.67157 6.32843 3 5.5 3ZM3 5C3.01671 5 3.03323 4.99918 3.04952 4.99758C3.28022 6.1399 4.28967 7 5.5 7C6.71033 7 7.71978 6.1399 7.95048 4.99758C7.96677 4.99918 7.98329 5 8 5H13.5C13.7761 5 14 4.77614 14 4.5C14 4.22386 13.7761 4 13.5 4H8C7.98329 4 7.96677 4.00082 7.95048 4.00242C7.71978 2.86009 6.71033 2 5.5 2C4.28967 2 3.28022 2.86009 3.04952 4.00242C3.03323 4.00082 3.01671 4 3 4H1.5C1.22386 4 1 4.22386 1 4.5C1 4.77614 1.22386 5 1.5 5H3ZM11.9505 10.9976C11.7198 12.1399 10.7103 13 9.5 13C8.28967 13 7.28022 12.1399 7.04952 10.9976C7.03323 10.9992 7.01671 11 7 11H1.5C1.22386 11 1 10.7761 1 10.5C1 10.2239 1.22386 10 1.5 10H7C7.01671 10 7.03323 10.0008 7.04952 10.0024C7.28022 8.8601 8.28967 8 9.5 8C10.7103 8 11.7198 8.8601 11.9505 10.0024C11.9668 10.0008 11.9833 10 12 10H13.5C13.7761 10 14 10.2239 14 10.5C14 10.7761 13.7761 11 13.5 11H12C11.9833 11 11.9668 10.9992 11.9505 10.9976ZM8 10.5C8 9.67157 8.67157 9 9.5 9C10.3284 9 11 9.67157 11 10.5C11 11.3284 10.3284 12 9.5 12C8.67157 12 8 11.3284 8 10.5Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"/></svg>
    <svg th:if="${content == null and icon == 'gallery'}" class="h-4 w-4" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="1.5" width="12" height="12" rx="1.5"/><circle cx="5" cy="5.5" r="1.2"/><path d="M1.5 11l3.5-3.5 3 3 2-2 3.5 3.5"/></svg>
</button>

<!--
  panelToggle(content, title, extraClass): apre/chiude una colonna laterale collassabile della pagina (es. le conversazioni di /deep-chat). Assume sull'antenato
  x-data `panelOpen` (booleano) e `togglePanel()`. `content` = testo/glifo (es. ✕), oppure null per l'icona "colonna laterale"; `title` = tooltip e
  aria-label GIA' risolti; `extraClass` = solo layout del chiamante (es. md:hidden).
-->
<button th:fragment="panelToggle(content, title, extraClass)" type="button" @click="togglePanel()"
        :aria-expanded="panelOpen"
        th:title="${title}" th:aria-label="${title}"
        th:class="'inline-flex items-center justify-center shrink-0 border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark rounded-md px-3 py-1.5 cursor-pointer text-[0.85rem] leading-none ' + (${extraClass} ?: '')">
    <span th:if="${content != null}" th:text="${content}">✕</span>
    <svg th:if="${content == null}" class="h-4 w-4" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5"/><path d="M5.5 2.5v10"/></svg>
</button>

<!--
  menuToggle(text): toggle di un menu a tendina dell'header (fragments/core/header.html :: navMenu). Assume il componente Alpine
  `pinesPopover` (open, toggle) sul contenitore navMenu. Il chevron ruota da aperto.
-->
<button th:fragment="menuToggle(text)"
        type="button"
        class="inline-flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0 text-[0.95rem]
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark"
        x-ref="button" @click="toggle()" :aria-expanded="open" aria-haspopup="true">
    <span th:text="${text}">Menu</span>
    <span aria-hidden="true" class="text-[0.7rem] transition-transform" :class="open ? 'rotate-180' : ''">&#9662;</span>
</button>

<button th:fragment="themeToggle(value, content, title)"
        type="button"
        th:data-theme-value="${value}"
        class="border border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark text-ink dark:text-ink-dark
               rounded-md px-2 py-1 text-[0.85rem] leading-none"
        @click="theme = $el.dataset.themeValue"
        :disabled="theme === $el.dataset.themeValue"
        :aria-pressed="theme === $el.dataset.themeValue"
        :class="theme === $el.dataset.themeValue ? 'opacity-40 cursor-default' : 'cursor-pointer hover:bg-surface dark:hover:bg-surface-dark'"
        th:title="${title}"
        th:text="${content}">Bottone</button>

<!--
  toastClose(title): bottone "x" di un toast (fragments/core/toast.html). L'@click assume l'antenato Alpine del
  container dei toast (funzione dismiss e variabile di loop `t` di x-for): stesso accoppiamento esplicito di
  dangerSelectable con selectedIds. Classi esplicite sovrascrivono la regola base di "button".
-->
<button th:fragment="toastClose(title)" type="button"
        th:title="${title}" th:aria-label="${title}"
        @click="dismiss(t.key)"
        class="shrink-0 w-6 h-6 p-0 rounded-full bg-transparent text-ink-muted dark:text-ink-muted-dark hover:bg-canvas dark:hover:bg-canvas-dark leading-none">&times;</button>

<!--
  bell(count, hasError, title): bottone della campanella della toolbar (fragments/core/notification-bell.html). Assume il componente
  Alpine `pinesPopover` (open, toggle) sul contenitore. Senza non letti (count 0) l'icona e' neutra e senza badge ("spenta"); con non letti il badge
  mostra il conteggio (9+ oltre 9): rosso (danger) se fra i non letti c'e' un ERROR, altrimenti warning. Il testo del
  badge usa il colore di contrasto dei token (il badge e' sempre una tinta piena). title/aria-label: conteggio gia' tradotto.
-->
<button th:fragment="bell(count, hasError, title)" type="button"
        x-ref="button" @click="toggle()" :aria-expanded="open" aria-haspopup="true"
        th:title="${title}" th:aria-label="${title}"
        class="relative inline-flex items-center rounded-md border-0 bg-transparent p-1.5 hover:opacity-100
               text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </svg>
    <span th:if="${count > 0}"
          class="absolute -right-1 -top-1 h-4 min-w-4 rounded-full px-1 text-center text-[0.65rem] font-semibold leading-4
                 text-accent-contrast dark:text-accent-contrast-dark"
          th:classappend="${hasError} ? 'bg-danger dark:bg-danger-dark' : 'bg-warning dark:bg-warning-dark'"
          th:text="${count > 9} ? '9+' : ${count}">3</span>
</button>


<!--
  Controlli del player video (fragments/core/video-player.html): icone bianche sul video, non sul tema. Assumono il componente Alpine
  `pinesVideo` (playing, muted, togglePlay, toggleMute, toggleFullscreen). title = etichetta gia' tradotta (title + aria-label).
-->
<button th:fragment="videoPlay(title)" type="button" th:title="${title}" th:aria-label="${title}" @click="togglePlay()"
        class="flex justify-center items-center w-10 h-10 p-0 border-0 bg-transparent text-white opacity-80 duration-150 ease-out hover:opacity-100">
    <svg x-show="!playing" class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.42737 3.41611C6.46665 2.24586 4.00008 3.67188 4.00007 5.9427L4 18.0572C3.99999 20.329 6.46837 21.7549 8.42907 20.5828L18.5698 14.5207C20.4775 13.3802 20.4766 10.6076 18.568 9.46853L8.42737 3.41611Z" fill="currentColor"/></svg>
    <svg x-show="playing" x-cloak class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 3C8.55228 3 9 3.44772 9 4L9 20C9 20.5523 8.55228 21 8 21C7.44772 21 7 20.5523 7 20L7 4C7 3.44772 7.44772 3 8 3ZM16 3C16.5523 3 17 3.44772 17 4V20C17 20.5523 16.5523 21 16 21C15.4477 21 15 20.5523 15 20V4C15 3.44772 15.4477 3 16 3Z" fill="currentColor"/></svg>
</button>

<button th:fragment="videoMute(title)" type="button" th:title="${title}" th:aria-label="${title}" @click="toggleMute()"
        class="flex justify-center items-center w-6 h-10 p-0 border-0 bg-transparent text-white opacity-80 duration-150 ease-out hover:opacity-100">
    <svg x-show="!muted" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/><path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z"/></svg>
    <svg x-show="muted" x-cloak class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM17.78 9.22a.75.75 0 10-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 001.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 101.06-1.06L20.56 12l1.72-1.72a.75.75 0 00-1.06-1.06l-1.72 1.72-1.72-1.72z"/></svg>
</button>

<button th:fragment="videoFullscreen(title)" type="button" th:title="${title}" th:aria-label="${title}" x-ref="fullscreenButton" @click="toggleFullscreen()"
        class="flex justify-center items-center w-10 h-10 p-0 border-0 bg-transparent text-white opacity-80 duration-150 ease-out scale-90 hover:opacity-100 hover:scale-100">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M6.72685 5C5.77328 5 5 5.77318 5 6.72727V9C5 9.55228 4.55228 10 4 10C3.44772 10 3 9.55228 3 9V6.72727C3 4.6689 4.66842 3 6.72685 3H9C9.55228 3 10 3.44772 10 4C10 4.55228 9.55228 5 9 5H6.72685ZM14 4C14 3.44772 14.4477 3 15 3H17.2727C19.3312 3 21 4.66876 21 6.72727V9C21 9.55228 20.5523 10 20 10C19.4477 10 19 9.55228 19 9V6.72727C19 5.77333 18.2267 5 17.2727 5H15C14.4477 5 14 4.55228 14 4ZM4 14C4.55228 14 5 14.4477 5 15V17.2727C5 18.2268 5.77328 19 6.72685 19H9C9.55228 19 10 19.4477 10 20C10 20.5523 9.55228 21 9 21H6.72685C4.66842 21 3 19.3311 3 17.2727V15C3 14.4477 3.44772 14 4 14ZM20 14C20.5523 14 21 14.4477 21 15V17.2727C21 19.3312 19.3312 21 17.2727 21H15C14.4477 21 14 20.5523 14 20C14 19.4477 14.4477 19 15 19H17.2727C18.2267 19 19 18.2267 19 17.2727V15C19 14.4477 19.4477 14 20 14Z" fill="currentColor"/></svg>
</button>

</body>
</html>
