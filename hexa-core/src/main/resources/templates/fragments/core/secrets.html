<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Elenco dei segreti (contenuto di #secret-list, secrets.html): nome, tipo, suffisso del valore (mai il valore), scadenza con badge di stato
  (`warning`/`danger`). I segreti di un tipo `managed` (dei moduli) hanno il badge «gestito» e nessun bottone: si cambiano dalla UI del modulo. Con la chiave
  di cifratura mancante un alert spiega perche' non si puo' salvare.
-->
<th:block th:fragment="list(secrets, typeLabels, configured, warningDays)">
    <th:block th:unless="${configured}">
        <p th:replace="~{fragments/core/alert :: error(text=#{secrets.alert.notConfigured})}">Chiave di cifratura mancante.</p>
    </th:block>

    <p th:if="${#lists.isEmpty(secrets)}" class="mt-4" th:text="#{secrets.empty}">Nessun segreto salvato.</p>

    <ul th:unless="${#lists.isEmpty(secrets)}" class="list-none p-0 mt-4 flex flex-col gap-3">
        <li th:each="t : ${secrets}" th:id="'secret-' + ${t.id}"
            class="border border-line dark:border-line-dark rounded-lg bg-surface dark:bg-surface-dark px-4 py-3">
            <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-[0.9rem]">
                <strong th:text="${t.name}">nome</strong>
                <span th:replace="~{fragments/core/chip :: neutral(text=${typeLabels.get(t.type) ?: t.type}, textClass='text-[0.8rem]')}">HuggingFace</span>
                <code th:text="'…' + ${t.hint}">…ab12</code>
                <th:block th:if="${t.managed}"><span th:replace="~{fragments/core/chip :: neutral(text=#{secrets.managed}, textClass='text-[0.8rem]')}">gestito</span></th:block>
                <span th:if="${t.expiresAt == null}" class="text-[0.85rem] text-ink-muted dark:text-ink-muted-dark" th:text="#{secrets.noExpiry}">Nessuna scadenza</span>
                <span th:if="${t.expiresAt != null}" class="text-[0.85rem]"
                      th:classappend="${t.status.name() == 'EXPIRED'} ? 'text-danger dark:text-danger-dark font-semibold'
                                       : (${t.status.name() == 'EXPIRING'} ? 'text-warning dark:text-warning-dark font-semibold' : 'text-ink-muted dark:text-ink-muted-dark')"
                      th:text="${t.status.name() == 'EXPIRED'} ? #{secrets.status.expired(${t.expiresAt})}
                                : (${t.status.name() == 'EXPIRING'} ? #{secrets.status.expiring(${t.expiresAt})} : #{secrets.status.expires(${t.expiresAt})})">Scade il 2026-12-31</span>
            </div>
            <div th:unless="${t.managed}" class="mt-3 flex flex-wrap gap-2">
                <button th:replace="~{fragments/core/button :: dialogOpen(text=#{secrets.button.edit}, hxGet=@{/secrets/{id}/edit(id=${t.id})},
                            hxTarget='#secret-form', hxSwap='outerHTML', neutral=true, extraClass='px-3 py-1 text-[0.85rem]')}">Modifica</button>
                <button th:replace="~{fragments/core/button :: danger(type='button', text=#{secrets.button.delete}, hxPost=null, hxDelete=@{/secrets/{id}(id=${t.id})},
                            hxConfirm=#{secrets.confirm.delete}, hxSwap='innerHTML', hxTarget='#secret-list', extraClass='px-3 py-1 text-[0.85rem]')}">Elimina</button>
            </div>
        </li>
    </ul>
</th:block>

<!--
  Contenuto del dialog (secrets.html), per CREAZIONE (secretId null) e MODIFICA: sempre ri-caricato all'apertura e, con un errore di
  validazione, rimpiazzato da se' stesso (HX-Retarget/HX-Reswap dal controller). Il valore e' un campo password, MAI ripopolato: in
  modifica "lascia vuoto per non cambiarlo". Il tipo si sceglie solo in creazione (e mai fra quelli `managed`). La risposta riuscita e' l'elenco (#secret-list).
-->
<div th:fragment="secretForm(secretId, secretType, secretName, secretExpires, secretError, types, configured)" id="secret-form">
    <div class="flex items-start justify-between gap-3">
        <h2 id="secret-dialog-title" class="m-0" th:text="${secretId == null} ? #{secrets.form.newTitle} : #{secrets.form.editTitle}">Nuovo segreto</h2>
        <button th:replace="~{fragments/core/button :: dialogCloseIcon(title=#{secrets.form.close})}">&times;</button>
    </div>
    <form th:hx-post="${secretId == null} ? @{/secrets} : @{/secrets/{id}(id=${secretId})}"
          hx-target="#secret-list" hx-swap="innerHTML" class="mt-3" autocomplete="off">
        <th:block th:unless="${configured}">
            <p th:replace="~{fragments/core/alert :: error(text=#{secrets.alert.notConfigured})}">Chiave di cifratura mancante.</p>
        </th:block>
        <th:block th:if="${secretError}">
            <p th:replace="~{fragments/core/alert :: error(text=${secretError})}">Errore</p>
        </th:block>

        <th:block th:if="${secretId == null}">
            <label for="secret-type" th:text="#{secrets.form.type}">Tipo</label>
            <div class="relative" x-data="pinesSelect" x-bind="root">
                <select id="secret-type" name="type" class="sr-only" tabindex="-1" aria-hidden="true">
                    <option th:each="t : ${types}" th:value="${t.name}" th:text="${#messages.msgOrNull(t.labelKey) ?: t.name}"
                            th:selected="${t.name == secretType}">HuggingFace</option>
                </select>
                <div th:replace="~{fragments/core/select :: ui}"></div>
            </div>
        </th:block>

        <label for="secret-name" th:text="#{secrets.form.name}">Nome</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#secret-name}, clearable=true, title=null)}">
            <input type="text" id="secret-name" name="name" class="w-full" maxlength="60" required th:value="${secretName}">
        </th:block>

        <label for="secret-value" th:text="${secretId == null} ? #{secrets.form.value} : #{secrets.form.valueKeep}">Valore</label>
        <input type="password" id="secret-value" name="value" class="w-full" autocomplete="off" maxlength="500"
               th:required="${secretId == null}">

        <label for="secret-expires" th:text="#{secrets.form.expires}">Scadenza (opzionale)</label>
        <th:block th:replace="~{fragments/core/clear-field :: wrap(content=~{::#secret-expires}, clearable=true, title=null)}">
            <input type="date" id="secret-expires" name="expiresAt" class="w-full" th:value="${secretExpires}">
        </th:block>

        <div class="mt-4 flex flex-wrap justify-end gap-2">
            <button th:replace="~{fragments/core/button :: dialogClose(text=#{secrets.form.cancel}, extraClass=null)}">Annulla</button>
            <button th:replace="~{fragments/core/button :: primary(type='submit', text=#{secrets.form.save}, extraClass=null)}">Salva</button>
        </div>
    </form>
</div>

</body>
</html>
