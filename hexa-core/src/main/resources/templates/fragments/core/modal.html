<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  dialog(titleId, maxWidth, body): lo scheletro del dialog modale Pines UI (UN punto per tutto il progetto: mai uno scrim e un pannello scritti a mano).
  Assume la variabile Alpine `dialogOpen` su un antenato x-data (stesso accoppiamento di button :: dialogOpen/dialogClose/dialogCloseIcon) e la lascia
  decidere al chiamante, che gestisce anche Esc e gli eventi di chiusura. Il fragment aggiunge scrim (clic = chiude), focus trap con scroll bloccato,
  transizioni e role/aria. Il chiamante tiene il PROPRIO contenuto dentro un elemento con id univoco che lo seleziona (come clear-field :: wrap):
      <th:block th:replace="~{fragments/core/modal :: dialog(titleId='x-title', maxWidth='max-w-lg', body=~{::#x-body})}">
          <div id="x-body">... <h2 id="x-title">...</h2> ...</div>
      </th:block>
  titleId = id dell'intestazione del contenuto (aria-labelledby). maxWidth = classe Tailwind LETTERALE (max-w-lg|max-w-3xl|max-w-4xl).
-->
<div th:fragment="dialog(titleId, maxWidth, body)" x-show="dialogOpen" x-cloak x-trap.inert.noscroll="dialogOpen"
     class="fixed inset-0 z-[100] flex items-center justify-center p-4"
     role="dialog" aria-modal="true" th:aria-labelledby="${titleId}">
    <div class="absolute inset-0 bg-scrim/50" @click="dialogOpen = false" x-show="dialogOpen" x-transition.opacity></div>
    <div class="relative w-full max-h-full overflow-y-auto rounded-lg p-5 shadow-xl
                bg-surface dark:bg-surface-dark border border-line dark:border-line-dark"
         th:classappend="${maxWidth}"
         x-show="dialogOpen"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
        <th:block th:replace="${body}"></th:block>
    </div>
</div>

</body>
</html>
