<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Dropzone di immagini condivisa da /import (templates/app/import.html) e dall'editor di un dataset di addestramento
  (fragments/app/training-dataset.html). Due pezzi, come mask-editor.html:

  - `script`: registra UNA volta il componente Alpine `imageDropzone` (alpine:init). A livello di PAGINA.
  - `field(inputId, formId, maxBytes, maxFiles, compact, prompt, hint, invalidType, tooLarge, tooMany, removeTitle)`: il markup. `inputId` e' l'id
    dell'<input type=file>; `formId` il form htmx che, a invio riuscito, svuota la zona; `compact` = padding e anteprime piu' piccoli; i testi
    arrivano GIA' risolti dal chiamante (`#{...}`: ogni pagina ha i suoi messaggi); `maxFiles` e' quanto spazio resta, non per forza il tetto assoluto. La zona e' una <label> sull'<input type=file multiple name=images>: SENZA JS il click apre il
    selettore nativo e il form si invia come multipart normale (la pagina intera risponde); CON JS si aggiungono trascinamento, incolla
    (clipboardData.files), anteprime, rimozione del singolo file e la validazione client (tipo, dimensione, numero: stessi limiti del server,
    che resta l'autorita'). L'elenco finale si riscrive nell'input con DataTransfer (come la maschera in mask-editor.html): il form htmx lo
    invia in UNA richiesta multipart. I File stanno fuori dallo stato reattivo (Alpine.raw), un Proxy non e' un File.

  Limiti e messaggi arrivano da data-* (regola "binding Alpine via data-*"), mai da espressioni #{...} dentro @click.
-->
<th:block th:fragment="script">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('imageDropzone', () => ({
                items: [],
                dragging: false,
                notice: '',

                add(fileList) {
                    const data = this.$root.dataset;
                    const allowed = ['image/png', 'image/jpeg', 'image/webp'];
                    const notes = [];
                    for (const file of Array.from(fileList)) {
                        if (!allowed.includes(file.type)) {
                            notes.push(file.name + ': ' + data.invalidType);
                        } else if (file.size > Number(data.maxBytes)) {
                            notes.push(file.name + ': ' + data.tooLarge);
                        } else if (this.items.length >= Number(data.maxFiles)) {
                            notes.push(file.name + ': ' + data.tooMany);
                        } else {
                            this.items.push({ file: file, url: URL.createObjectURL(file), name: file.name });
                        }
                    }
                    this.notice = notes.join(' · ');
                    this.sync();
                },

                remove(index) {
                    URL.revokeObjectURL(this.items[index].url);
                    this.items.splice(index, 1);
                    this.sync();
                },

                clear() {
                    this.items.forEach(item => URL.revokeObjectURL(item.url));
                    this.items = [];
                    this.notice = '';
                    this.sync();
                },

                /* Riscrive l'<input type=file> con l'elenco accumulato: e' quello che il form invia. */
                sync() {
                    const transfer = new DataTransfer();
                    this.items.forEach(item => transfer.items.add(Alpine.raw(item.file)));
                    this.$refs.input.files = transfer.files;
                },

                onPick(event) {
                    this.add(event.target.files);
                },

                onDrop(event) {
                    this.dragging = false;
                    this.add(event.dataTransfer.files);
                },

                onPaste(event) {
                    const files = Array.from((event.clipboardData && event.clipboardData.files) || []);
                    if (files.length > 0) {
                        event.preventDefault();
                        this.add(files);
                    }
                }
            }));
        });
    </script>
</th:block>

<div th:fragment="field(inputId, formId, maxBytes, maxFiles, compact, prompt, hint, invalidType, tooLarge, tooMany, removeTitle)"
     x-data="imageDropzone" @paste.window="onPaste($event)"
     @htmx:after-request.window="if ($event.target.id === $el.dataset.formId &amp;&amp; $event.detail.successful) clear()"
     th:data-form-id="${formId}" th:data-max-bytes="${maxBytes}" th:data-max-files="${maxFiles}"
     th:data-invalid-type="${invalidType}" th:data-too-large="${tooLarge}" th:data-too-many="${tooMany}">
    <label th:for="${inputId}"
           class="flex flex-col items-center justify-center gap-1 text-center cursor-pointer rounded-lg border-2 border-dashed
                  border-line dark:border-line-dark bg-surface dark:bg-surface-dark text-ink-muted dark:text-ink-muted-dark"
           th:classappend="${compact} ? 'p-6' : 'p-8'"
           :class="dragging ? 'border-accent dark:border-accent-dark' : ''"
           @dragover.prevent="dragging = true" @dragleave.prevent="dragging = false" @drop.prevent="onDrop($event)">
        <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
        </svg>
        <span th:text="${prompt}">Trascina qui le immagini, incollale o scegli dal disco</span>
        <span class="text-[0.8rem]" th:text="${hint}">PNG, JPEG o WebP</span>
        <input type="file" th:id="${inputId}" name="images" multiple accept="image/png,image/jpeg,image/webp" x-ref="input"
               @change="onPick($event)" class="mt-2 text-[0.85rem]">
    </label>

    <p x-show="notice" x-cloak x-text="notice" class="mt-2 text-[0.85rem] text-danger dark:text-danger-dark" role="alert"></p>

    <ul x-show="items.length > 0" x-cloak class="list-none p-0 m-0 mt-3 grid gap-3"
        th:classappend="${compact} ? 'grid-cols-[repeat(auto-fill,minmax(6rem,1fr))]' : 'grid-cols-[repeat(auto-fill,minmax(7rem,1fr))]'">
        <template x-for="(item, index) in items" :key="item.url">
            <li class="relative">
                <img :src="item.url" :alt="item.name" class="block w-full aspect-square object-cover rounded-md">
                <span class="block truncate text-[0.75rem] text-ink-muted dark:text-ink-muted-dark" x-text="item.name"></span>
                <button th:replace="~{fragments/core/field-buttons :: removeFile(title=${removeTitle})}"></button>
            </li>
        </template>
    </ul>
</div>

</body>
</html>
