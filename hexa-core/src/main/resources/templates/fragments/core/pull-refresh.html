<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Aggiornamento di una lista: icona sempre disponibile + gesto "tira giu'" su mobile. Tre pezzi, come popover.html:

  - `script`: registra UNA volta il componente Alpine `pullRefresh` (alpine:init), a livello di PAGINA (layout.html, prima del core Alpine).
    Il componente non carica nulla da solo: emette l'evento htmx `refresh-list` su <body>; la lista che vuole aggiornarsi lo aggiunge al proprio
    `hx-trigger` (`refresh-list from:body`) e si ricarica con i filtri correnti, dalla prima pagina. Il gesto parte solo a scroll in cima
    (scrollY 0), con un dito, fuori da dialog/campi di testo; oltre la soglia l'indicatore dice di rilasciare, al rilascio parte il refresh.
    Finche' il componente e' in pagina il browser non fa il suo refresh nativo (overscroll-behavior-y: contain sull'elemento radice).
  - `indicator`: l'indicatore in alto (dentro l'antenato `x-data="pullRefresh"`); `pull`/`release` = testi GIA' risolti dal chiamante (`#{...}`).
  - il bottone e' `button :: refresh(title, extraClass)`, da mettere nello stesso antenato.
-->
<th:block th:fragment="script">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('pullRefresh', () => ({
                /* idle | pulling | ready | loading */
                state: 'idle',
                distance: 0,
                startY: null,
                threshold: 70,
                timer: null,
                previousOverscroll: '',
                init() {
                    this.previousOverscroll = document.documentElement.style.overscrollBehaviorY;
                    document.documentElement.style.overscrollBehaviorY = 'contain';
                    this.onSettled = () => this.finish();
                    document.body.addEventListener('htmx:afterSettle', this.onSettled);
                },
                destroy() {
                    document.documentElement.style.overscrollBehaviorY = this.previousOverscroll;
                    document.body.removeEventListener('htmx:afterSettle', this.onSettled);
                    clearTimeout(this.timer);
                },
                refresh() {
                    if (this.state === 'loading') return;
                    this.state = 'loading';
                    this.distance = this.threshold;
                    clearTimeout(this.timer);
                    /* Rete di sicurezza: se nessuna lista risponde, l'indicatore non resta acceso. */
                    this.timer = setTimeout(() => this.finish(), 8000);
                    htmx.trigger(document.body, 'refresh-list');
                },
                finish() {
                    if (this.state !== 'loading') return;
                    clearTimeout(this.timer);
                    this.state = 'idle';
                    this.distance = 0;
                },
                touchStart(e) {
                    this.startY = null;
                    if (this.state === 'loading' || e.touches.length !== 1 || window.scrollY > 0) return;
                    if (e.target.closest('dialog, [role="dialog"], input, textarea, select, [data-no-pull-refresh]')) return;
                    this.startY = e.touches[0].clientY;
                },
                touchMove(e) {
                    if (this.startY === null || e.touches.length !== 1) return;
                    const delta = e.touches[0].clientY - this.startY;
                    if (delta <= 0 || window.scrollY > 0) {
                        this.cancel();
                        return;
                    }
                    /* Resistenza: il dito corre piu' dell'indicatore. */
                    this.distance = Math.min(delta * 0.5, this.threshold * 1.5);
                    this.state = this.distance >= this.threshold ? 'ready' : 'pulling';
                },
                touchEnd() {
                    if (this.startY === null) return;
                    this.startY = null;
                    if (this.state === 'ready') {
                        this.refresh();
                    } else {
                        this.cancel();
                    }
                },
                cancel() {
                    this.startY = null;
                    if (this.state === 'pulling' || this.state === 'ready') {
                        this.state = 'idle';
                        this.distance = 0;
                    }
                }
            }));
        });
    </script>
</th:block>

<!--
  indicator(pull, release): freccia in alto che scende col dito; sopra soglia ruota e mostra `release`, in caricamento gira. Pensato per stare dentro
  l'elemento con `x-data="pullRefresh"` e con `@touchstart.window.passive`, `@touchmove.window.passive`, `@touchend.window`, `@touchcancel.window`
  (vedi le pagine che lo usano). `aria-hidden`: il gesto e' un'aggiunta, l'azione accessibile e' il bottone.
-->
<div th:fragment="indicator(pull, release)" aria-hidden="true"
     class="pointer-events-none fixed left-0 right-0 top-0 z-40 flex justify-center"
     x-show="state !== 'idle'" x-cloak
     :style="'transform: translateY(' + (distance - 36) + 'px); transition: ' + (startY === null ? 'transform 0.2s' : 'none')">
    <div class="flex items-center gap-2 rounded-full border border-line dark:border-line-dark bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark px-3 py-1.5 text-[0.8rem] shadow">
        <svg class="h-4 w-4 transition-transform" :class="{ 'animate-spin': state === 'loading', 'rotate-180': state === 'ready' }"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14m0 0l-5-5m5 5l5-5" x-show="state !== 'loading'"/>
            <path d="M21 12a9 9 0 1 1-3-6.7" x-show="state === 'loading'"/>
        </svg>
        <span x-show="state === 'pulling'" th:text="${pull}">Tira per aggiornare</span>
        <span x-show="state === 'ready'" th:text="${release}">Rilascia per aggiornare</span>
    </div>
</div>

</body>
</html>
