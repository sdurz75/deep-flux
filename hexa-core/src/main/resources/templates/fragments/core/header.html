<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Header di navigazione, incluso da fragments/core/layout.html. Le voci di menu NON sono qui: le fornisce l'app con
  fragments/app/nav.html :: links(inline) (punto di estensione del template), il nome dell'app e' la chiave app.brand. Usa la
  variabile Alpine "theme" dichiarata con x-data sul <body> del layout:
  th:replace inserisce questo markup come figlio diretto di quel <body>,
  quindi lo scope Alpine (basato sulla struttura del DOM risultante, non
  su quella dei template sorgente) resta invariato.
-->
<th:block th:fragment="header">
    <!--
      sticky top-0: la barra resta visibile durante lo scroll (z-40, sotto lo
      z-[99] di lightbox/modal). navOpen: stato dello slideover mobile
      (scope Alpine annidato: "theme" del <body> resta ereditato).
      Le voci (fornite dall'app) sono raggruppate in menu a tendina Pines (navMenu) e link diretti (navLink).
      Gli STESSI fragment alimentano la barra (inline=false: pannello assoluto) e lo slideover sotto md (inline=true:
      gruppo che si espande sul posto), cosi' i menu funzionano anche a barra nascosta.
    -->
    <header class="sticky top-0 z-40 border-b border-line dark:border-line-dark bg-surface dark:bg-surface-dark"
            x-data="{ navOpen: false }" @keydown.escape.window="navOpen = false">
        <!-- px-4 fisso (non il clamp fluido di <main>, vedi fragments/core/layout.html). -->
        <nav class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between gap-4">
            <button th:replace="~{fragments/core/button :: navToggle(open='true', content='☰', title=#{header.nav.open})}">☰</button>
            <a th:href="@{/}" class="font-semibold no-underline text-ink dark:text-ink-dark whitespace-nowrap max-md:flex-1" th:text="#{app.brand}">App</a>
            <div class="flex items-center gap-4 flex-1 max-md:hidden"
                 th:insert="~{fragments/app/nav :: links(inline=false)}"></div>
            <!-- Campanella degli eventi di sistema: fuori dallo slideover, sempre visibile (vedi fragments/core/notification-bell.html). -->
            <div th:replace="~{fragments/core/notification-bell :: container}"></div>
        </nav>

        <!-- Slideover Pines UI (solo sotto md): vedi fragments/core/slideover.html -->
        <th:block th:replace="~{fragments/core/slideover :: drawer(persistent=false, body=~{::#header-drawer})}">
            <div id="header-drawer">
                <div class="flex justify-start">
                    <button th:replace="~{fragments/core/button :: navToggle(open='false', content='✕', title=#{header.nav.close})}">✕</button>
                </div>
                <!-- Chiude lo slideover solo cliccando un link, non i toggle dei menu. -->
                <div class="flex flex-col gap-4 mt-4" @click="if ($event.target.closest('a')) navOpen = false"
                     th:insert="~{fragments/app/nav :: links(inline=true)}"></div>
            </div>
        </th:block>
    </header>
</th:block>

<!--
  Voci di sistema del core (registro eventi, token): l'app le include nel proprio menu Sistema
  (fragments/app/nav.html), cosi' ne decide l'ordine e vi aggiunge le sue voci.
-->
<th:block th:fragment="navSystemCore">
    <a th:replace="~{fragments/core/header :: navLink(path='/system/events', text=#{header.nav.events})}">Eventi</a>
    <a th:replace="~{fragments/core/header :: navLink(path='/tokens', text=#{header.nav.tokens})}">Token</a>
    <!-- Voci delle librerie opzionali (ILayoutContributor#manageMenu), es. la sicurezza di hexa-pwa. -->
    <th:block th:each="entry : ${manageMenuEntries}">
        <a th:replace="~{fragments/core/header :: navLink(path=${entry.path}, text=#{${entry.messageKey}})}">Voce</a>
    </th:block>
</th:block>

<!--
  Menu a tendina Pines UI: `pinesPopover` (stato `open`, scope annidato: `theme`/`navOpen` restano ereditati); si chiude con click fuori o Esc.
  `items` e' un fragment-expression con le voci; inline=false = pannello ancorato sotto il toggle (barra: fragments/core/popover :: floating),
  inline=true = gruppo che si espande sul posto (slideover). I link dentro il pannello prendono padding dal selettore
  figlio-diretto (`[&>a]`), cosi' navLink resta identico ovunque.
-->
<div th:fragment="navMenu(label, items, inline)" class="relative" x-data="pinesPopover"
     @click.outside="close()" @keydown.escape.window="close()">
    <button th:replace="~{fragments/core/button :: menuToggle(text=${label})}">Menu</button>
    <div th:if="${inline}" x-show="open" x-cloak x-transition.opacity
         class="mt-2 ml-2 pl-2 border-l border-line dark:border-line-dark flex flex-col gap-1 [&>a]:py-1.5"
         th:insert="${items}"></div>
    <!--/* th:replace batte th:unless sullo stesso elemento (come in clear-field): il ramo spento ha un blocco esterno. */-->
    <th:block th:unless="${inline}">
        <th:block th:replace="~{fragments/core/popover :: floating(align='left', extraClass='min-w-48', bodyClass='flex flex-col gap-0.5 p-1 [&>a]:px-2 [&>a]:py-1.5 [&>a]:rounded', trap=false, body=${items})}"></th:block>
    </th:block>
</div>

<th:block th:fragment="themeSwitch">
    <button th:replace="~{fragments/core/button :: themeToggle(value='light', content='☀️', title=#{header.theme.light})}">☀️</button>
    <button th:replace="~{fragments/core/button :: themeToggle(value='dark', content='🌙', title=#{header.theme.dark})}">🌙</button>
    <button th:replace="~{fragments/core/button :: themeToggle(value='auto', content=#{header.theme.auto}, title=#{header.theme.auto})}">Auto</button>
</th:block>

<!--
  Link di navigazione dell'header: le classi erano ripetute identiche
  sui 4 <a> sopra. path va passato come stringa letterale grezza (es.
  '/gallery'), MAI gia' avvolta in @{...} dal chiamante - e' questo
  fragment che la avvolge in @{${path}}, una sola volta, stesso
  contratto di basePath in fragments/core/pagination.html: farlo anche a
  monte applicherebbe due volte il prefisso di un eventuale reverse
  proxy (X-Forwarded-Prefix, vedi CLAUDE.md).
-->
<a th:fragment="navLink(path, text)"
   th:href="@{${path}}" th:text="${text}"
   class="no-underline text-[0.95rem] text-ink-muted dark:text-ink-muted-dark hover:text-ink dark:hover:text-ink-dark">Link</a>

</body>
</html>
