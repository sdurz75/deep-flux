<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{secrets.title}">Segreti</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.manage}, parentPath=null, parentText=null, current=#{secrets.title})}"></nav>
</div>
<div layout:fragment="content">
    <!--
      Dialog Pines UI per creare E modificare un segreto (stessa meccanica del dialog note di search.html): `dialogOpen` e' lo stato
      Alpine letto da button :: dialogOpen/dialogClose; x-trap.inert.noscroll confina il focus e blocca lo scroll. Il contenuto
      (#secret-form) si ri-carica a ogni apertura. Al salvataggio riuscito il server emette `secret-saved` (HX-Trigger) che chiude il
      dialog; con un errore il form si rimpiazza da se' (HX-Retarget) e il dialog resta aperto col messaggio.
    -->
    <div x-data="{ dialogOpen: false }" @keydown.escape.window="dialogOpen = false" @secret-saved.window="dialogOpen = false">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <h1 class="m-0" th:text="#{secrets.title}">Segreti</h1>
            <button th:replace="~{fragments/core/button :: dialogOpen(text=#{secrets.button.new}, hxGet=@{/secrets/new},
                        hxTarget='#secret-form', hxSwap='outerHTML', neutral=false, extraClass='px-3 py-1.5 text-[0.85rem]')}">Nuovo segreto</button>
        </div>

        <p class="text-ink-muted dark:text-ink-muted-dark">
            <!--/* Riga facoltativa dell'app (chiave secrets.intro.app nel suo bundle): il core non conosce i servizi. */-->
            <span th:with="appIntro=${#messages.msgOrNull('secrets.intro.app')}" th:if="${appIntro != null}" th:text="${appIntro}"></span>
            <span th:text="#{secrets.intro}">Segreti per servizi esterni.</span>
        </p>

        <th:block th:replace="~{fragments/core/modal :: dialog(titleId='secret-dialog-title', maxWidth='max-w-lg', body=~{::#secret-dialog-body})}">
            <div id="secret-dialog-body">
                <div th:replace="~{fragments/core/secrets :: secretForm(secretId=${secretId}, secretType=${secretType}, secretName=${secretName}, secretExpires=${secretExpires}, secretError=${secretError}, types=${types}, configured=${configured})}"></div>
            </div>
        </th:block>

        <div id="secret-list">
            <div th:replace="~{fragments/core/secrets :: list(secrets=${secrets}, typeLabels=${typeLabels}, configured=${configured}, warningDays=${warningDays})}"></div>
        </div>
    </div>
</div>
</body>
</html>
