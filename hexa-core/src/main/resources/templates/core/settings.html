<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{settings.title}">Impostazioni</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.manage}, parentPath=null, parentText=null, current=#{settings.title})}"></nav>
</div>
<div layout:fragment="content">
    <h1 th:text="#{settings.title}">Impostazioni</h1>
    <p th:text="#{settings.intro}">Impostazioni dei moduli.</p>
    <p th:if="${#lists.isEmpty(views)}" th:text="#{settings.empty}" class="text-ink-muted dark:text-ink-muted-dark">Nessun modulo configurabile.</p>
    <th:block th:unless="${#lists.isEmpty(views)}" th:replace="~{fragments/core/tabs :: list(extraClass='mb-4', body=~{::#settings-tabs})}">
        <th:block id="settings-tabs">
            <th:block th:each="view : ${views}" th:with="tabHref=@{/settings(module=${view.id})}">
                <a th:replace="~{fragments/core/tabs :: tab(text=#{${view.titleKey}}, href=${tabHref}, hxTarget=null, selected=${view.id == active}, compact=false)}">Scheda</a>
            </th:block>
        </th:block>
    </th:block>
    <th:block th:each="view : ${views}" th:if="${view.id == active}">
        <div th:replace="~{fragments/core/settings-section :: section(view=${view}, error=${view.error}, saved=${view.saved})}"></div>
    </th:block>
</div>
</body>
</html>
