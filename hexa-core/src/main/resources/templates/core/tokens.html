<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/core/layout}">
<head>
    <title th:text="#{tokens.title}">Token</title>
</head>
<body>
<div layout:fragment="breadcrumbs">
    <nav th:replace="~{fragments/core/breadcrumbs :: trail(group=#{header.menu.manage}, parentPath=null, parentText=null, current=#{tokens.title})}"></nav>
</div>
<div layout:fragment="content">
    <!--
      Dialog Pines UI per creare E modificare un token (stessa meccanica del dialog note di search.html): `dialogOpen` e' lo stato
      Alpine letto da button :: dialogOpen/dialogClose; x-trap.inert.noscroll confina il focus e blocca lo scroll. Il contenuto
      (#token-form) si ri-carica a ogni apertura. Al salvataggio riuscito il server emette `token-saved` (HX-Trigger) che chiude il
      dialog; con un errore il form si rimpiazza da se' (HX-Retarget) e il dialog resta aperto col messaggio.
    -->
    <div x-data="{ dialogOpen: false }" @keydown.escape.window="dialogOpen = false" @token-saved.window="dialogOpen = false">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <h1 class="m-0" th:text="#{tokens.title}">Token</h1>
            <button th:replace="~{fragments/core/button :: dialogOpen(text=#{tokens.button.new}, hxGet=@{/tokens/new},
                        hxTarget='#token-form', hxSwap='outerHTML', neutral=false, extraClass='px-3 py-1.5 text-[0.85rem]')}">Nuovo token</button>
        </div>

        <p class="text-ink-muted dark:text-ink-muted-dark">
            <!--/* Riga facoltativa dell'app (chiave tokens.intro.app nel suo bundle): il core non conosce i servizi. */-->
            <span th:with="appIntro=${#messages.msgOrNull('tokens.intro.app')}" th:if="${appIntro != null}" th:text="${appIntro}"></span>
            <span th:text="#{tokens.intro}">Token API per servizi esterni.</span>
        </p>

        <th:block th:replace="~{fragments/core/modal :: dialog(titleId='token-dialog-title', maxWidth='max-w-lg', body=~{::#token-dialog-body})}">
            <div id="token-dialog-body">
                <div th:replace="~{fragments/core/tokens :: tokenForm(tokenId=${tokenId}, tokenProvider=${tokenProvider}, tokenName=${tokenName}, tokenExpires=${tokenExpires}, tokenError=${tokenError}, providers=${providers}, configured=${configured})}"></div>
            </div>
        </th:block>

        <div id="token-list">
            <div th:replace="~{fragments/core/tokens :: list(tokens=${tokens}, configured=${configured}, warningDays=${warningDays})}"></div>
        </div>
    </div>
</div>
</body>
</html>
