# Profilo "backup": lo attiva Application.main per i sottocomandi `export` e `import` (vedi core.backup, CLAUDE.md "Backup e restore"). E' un
# processo da riga di comando, NON il server: niente web, niente lavori in background, niente servizi remoti (Replicate, OpenRouter,
# SearXNG: l'AI di hexa-ai spegne embedding e ricerca nel proprio ai.yml, profilo backup), e lo schema lo pilota il backup stesso. Un profilo batte application.yml (dei default programmatici NO), per questo sta qui.
spring:
  main:
    web-application-type: none
    banner-mode: off
  jpa:
    hibernate:
      # Su un DB vuoto o piu' vecchio (import) "validate" fallirebbe prima che il backup possa migrarlo.
      ddl-auto: none
  flyway:
    # La migrazione automatica all'avvio sporcherebbe il DB sorgente (export) e salterebbe il passo "migra alla versione del backup" (import).
    # Il backup usa Flyway da codice, con le stesse spring.flyway.locations.
    enabled: false
app:
  recovery:
    enabled: false
  tokens:
    expiry-check-enabled: false
storage:
  webdav:
    cache:
      # Niente cache locale dei blob: un export/import legge/scrive ogni file una volta sola.
      max-size: 0
  migration:
    from-local:
      enabled: false
