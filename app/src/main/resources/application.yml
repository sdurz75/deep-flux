# Config dell'APP (generazione immagini, chat, ricerca): il resto, riusabile, e' in core.yml (importato sotto).
spring:
  config:
    # Carica .env (nella working directory, tipicamente la root del
    # progetto) come fosse un file .properties: le righe KEY=VALUE
    # finiscono tra le proprieta' lette sotto (${REPLICATE_API_TOKEN},
    # ecc.), senza bisogno di "sourcizzarlo" a mano nella shell prima di
    # ogni avvio. "optional:" evita che l'app fallisca ad avviarsi se
    # .env non esiste (es. in CI, dove i token arrivano da vere
    # variabili d'ambiente). prompts.properties (nessun "optional:": e'
    # nel jar, deve sempre esistere) porta il testo dei system prompt,
    # vedi ChatService.
    import: optional:file:.env[.properties],classpath:core.yml,classpath:prompts.properties
  application:
    name: deep-flux
  flyway:
    # core (sistemi riusabili) + app: versioni a timestamp, una sola sequenza (vedi db/migration/core/V2026_10_01_1200__core_baseline.sql).
    # Qui e non in core.yml: una chiave dell'app vince sempre su quella importata, e la lista dipende da quante location ha l'app.
    locations: classpath:db/migration/core,classpath:db/migration/app
  ai:
    openai:
      # Token generato su https://openrouter.ai/settings/keys. OpenRouter espone un'API OpenAI-compatibile
      # (https://openrouter.ai/docs): basta puntare lo starter Spring AI per OpenAI sul suo base-url, nessun client custom.
      # Da esportare come variabile d'ambiente, mai committato:  export OPENROUTER_API_TOKEN=sk-or-...
      api-key: ${OPENROUTER_API_TOKEN:}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:deepseek/deepseek-v4.1-flash}
    # Ricerca semantica (PgVectorStore): embedding LOCALI, nessuna chiamata di rete a runtime. Il modello ONNX
    # (multilingual-e5-small quantizzato, ~120 MB, italiano/inglese) e il tokenizer si scaricano UNA volta al primo avvio in
    # ./data/models. Cambiare l'URI del modello => ArchiveIndexService reindicizza tutto (l'URI e' l'id del modello).
    model:
      embedding: transformers
    embedding:
      transformer:
        cache:
          directory: ./data/models
        onnx:
          model-uri: https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx
          model-output-name: last_hidden_state
        tokenizer:
          uri: https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/tokenizer.json

# Modello di visione dell'"AI enhance" dei video (PromptEnhancementService#enhanceVideo): guarda
# l'immagine sorgente. Scelto per permissivita' oltre che per prezzo: niente modelli "moderated" di
# OpenRouter (OpenAI/Anthropic/Amazon) ne' Gemini, che rifiutano spesso il nudo non esplicito.
# Il fallback e' usato UNA volta se il primo rifiuta.
enhancer:
  vision-model: ${OPENROUTER_VISION_MODEL:qwen/qwen3-vl-32b-instruct}
  vision-fallback-model: ${OPENROUTER_VISION_FALLBACK_MODEL:mistralai/mistral-small-3.2-24b-instruct}

# Token generato su https://replicate.com/account/api-tokens.
# Da esportare come variabile d'ambiente, mai committato:
#   export REPLICATE_API_TOKEN=r8_...
replicate:
  api-token: ${REPLICATE_API_TOKEN:}
  api-base-url: https://api.replicate.com/v1
  # Il catalogo dei modelli proposti nel combobox di /generations/new e
  # /deep-chat non e' piu' configurato qui: e' censito nella tabella
  # REPLICATE_MODEL (vedi db/migration/app e
  # IModelCatalog), niente piu' fetch dal vivo di una collection
  # Replicate o di un elenco di modelli personali ad ogni avvio.

# HuggingFace: solo per la copia dei pesi di un LoRA addestrato (repo privato creato prima del training; i pesi li carica il trainer). Il token non e' qui:
# si sceglie per nome fra quelli salvati in /tokens.
huggingface:
  api-base-url: https://huggingface.co/api

# Credito residuo OpenRouter nella barra in basso (CreditsService, GET /credits): serve una MANAGEMENT key
# (https://openrouter.ai/settings/management-keys), diversa dal token della chat. Senza, il credito OpenRouter non compare.
# Da esportare come variabile d'ambiente, mai committato:  export OPENROUTER_MANAGEMENT_KEY=sk-or-...
openrouter:
  base-url: https://openrouter.ai/api/v1
  management-key: ${OPENROUTER_MANAGEMENT_KEY:}

# Istanza SearXNG usata dal tool di web search del modello su /deep-chat
# (vedi WebSearchTool/SearxngClient). Richiede che il formato JSON sia
# abilitato lato server (settings.yml: search.formats: [html, json]),
# altrimenti risponde 403. Credenziali Basic Auth da esportare come
# variabili d'ambiente, mai committate:
#   export SEARXNG_USERNAME=...
#   export SEARXNG_PASSWORD=...
searxng:
  base-url: ${SEARXNG_BASE_URL:https://sdurz.me/xng/}
  username: ${SEARXNG_USERNAME:}
  password: ${SEARXNG_PASSWORD:}

app:
  import:
    # Immagini esterne (pagina /import, ImportedImageService): quante al massimo per importazione. Il limite di richiesta multipart
    # (spring.servlet.multipart.max-request-size in core.yml) deve coprire max-files x dimensione massima di un'immagine.
    max-files: 20
  training:
    # Addestramento LoRA (TrainingDatasetService): quante immagini al massimo in un dataset (il trainer ne consiglia 10-20). Come per l'import,
    # max-images x dimensione massima di un'immagine (10 MB) deve stare nel limite di richiesta multipart (spring.servlet.multipart.max-request-size
    # in core.yml, 250 MB): 25 x 10 MB. Alzarlo oltre richiede di alzare anche quel limite, altrimenti un caricamento pieno fallisce per intero.
    max-images: 25
    # Lato lungo massimo, in pixel, di un'immagine ritagliata nel browser (TrainingController, editor di ritaglio): il canvas la riduce prima dell'invio.
    # Il trainer ridimensiona comunque (~1024): oltre questo valore si spedirebbero solo byte inutili. L'originale resta com'e'.
    max-image-side: 1536
    # Ogni quanto lo sweep rilancia le didascalie automatiche rimaste in sospeso (evento perso, coda piena): il lavoro e' idempotente e ricorda quali
    # immagini ha in corso, quindi un rilancio non ne duplica una gia' partita. All'avvio le rilancia tutte. Spento con app.recovery.enabled=false.
    caption-sweep-interval: 5m
    # Il training vero (TrainingService, replicate/fast-flux-trainer): A PAGAMENTO su Replicate e un modello Replicate privato nuovo per ogni lancio.
    # min-images blocca il lancio; warn-images solo lo sconsiglia (lo schema del trainer ne consiglia 10). min-steps/max-steps sono limiti dell'app, non del
    # trainer (default 1000). timeout: oltre questo tempo il training si annulla (altrimenti Replicate continua e fattura). poll-interval: ogni quanto si
    # interrogano i training in corso anche a pagina chiusa. trainer-version vuoto = l'ultima, poi pinnata nella riga del training.
    # destination-hardware: l'hardware con cui si crea il modello di destinazione (POST /models lo richiede; non e' quello dell'addestramento).
    min-images: 4
    warn-images: 10
    min-steps: 100
    max-steps: 4000
    timeout: 2h
    poll-interval: 30s
    trainer-model: replicate/fast-flux-trainer
    trainer-version:
    destination-hardware: gpu-t4
    # Il risultato di un training riuscito (TrainingResultService: preset in /loras, modello censito, copia su HuggingFace verificata). result-grace: subito dopo
    # il successo la versione del modello o l'elenco dei file su HuggingFace possono non essere ancora visibili, quindi un rifiuto entro questo tempo si ritenta.
    # result-retry-window: per quanto tempo lo sweep riprende un risultato rimasto a meta'; result-sweep-interval: ogni quanto.
    result-grace: 10m
    result-retry-window: 6h
    result-sweep-interval: 5m
  chat:
    # /deep-chat (ImageGenerationTool, VisionTool, ChatService): tetti di sicurezza per turno e finestra della cronologia mandata al modello.
    # max-generations-per-turn: ogni generateImage e' una predizione a pagamento; max-vision-calls-per-turn: ogni describeImage costa token
    # del modello di visione; history-max-turns/-chars: quanta cronologia (dal DB, non dal client) rientra nel contesto del modello.
    max-generations-per-turn: 3
    max-vision-calls-per-turn: 2
    history-max-turns: 40
    history-max-chars: 60000
    # Sezioni del system prompt (chiavi di prompts.properties) prima e dopo quelle dei tool presenti; senza: solo nucleo e guida.
    prompt-sections:
      leading:
        - deep-chat.section.core
        - deep-chat.section.guidance
        - deep-chat.section.appmap
      trailing:
        - prompts.creative-context
        - deep-chat.image-prompting-guide
    # Il template dell'app con i punti di innesto della pagina /deep-chat (intro, leftRail, below, scripts, conversationTags, knownTags).
    host-fragment: fragments/app/chat-host
    # Path dell'app che la chat trasforma in link (solo in visualizzazione, vedi ChatLinkPaths): elenco CHIUSO di frammenti di regex senza lo
    # slash iniziale, i piu' lunghi per primi. Un path nuovo citabile va aggiunto qui e nella sezione di prompt deep-chat.section.appmap.
    # entity-link-paths: i prefissi di /<prefisso>/<id> mostrati come #id.
    link-paths:
      - 'generations/new'
      - 'generations/\d+'
      - 'generations'
      - 'import/\d+'
      - 'import'
      - 'gallery'
      - 'search'
      - 'loras'
      - 'tokens'
      - 'system/events'
      - 'manual/[\w\-]+(?:#[\w\-]+)?'
      - 'manual'
    entity-link-paths:
      - generations
      - import
  recovery:
    # Recupero delle generazioni rimaste "in corso" (riavvio a meta' polling, watcher perso): all'avvio e
    # ogni pochi minuti (GenerationRecoveryService). Disattivato nei test (application-test.yml).
    enabled: true
    sweep-interval: 2m
  search:
    # Indice semantico (ArchiveIndexService / ArchiveSearchTool): prompt delle generazioni, messaggi e titoli delle chat.
    # Disattivato nei test (application-test.yml): l'EmbeddingModel locale scaricherebbe il modello.
    enabled: true
    # Template dell'app con gli slot di /search (filtro media, preferiti, badge, link, miniature dei documenti dell'app).
    host-fragment: fragments/app/search-host
    reindex-interval: 5m
    top-k: 5
    # Soglia di somiglianza minima (%, 0..100) di default della ricerca in /search (i punteggi e5 sono compressi: 70-90%, quindi 80 taglia il rumore
    # senza svuotare i risultati); la form la mostra e l'utente la cambia per ricerca. Non vale per la tool della chat (top-k).
    similarity-threshold-percent: 80
  push:
    # Gli eventi SSE dell'app (il core gestisce solo "system-event"): ri-dispatchati da fragments/core/live-events.html come CustomEvent
    # su document.body. reconnect-events: quelli da ri-dispatchare alla riconnessione dell'EventSource (PushModelAdvice).
    client-events: gallery-update,chat-message,training-update
    reconnect-events: gallery-update,training-update
